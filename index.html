       <div class="nivh"><span class="nivn">${badge}</span><b style="font-size:15px">${esc(tit)}</b>
        <span style="font-size:12px;color:var(--ink5)">${sub}</span>
        <span style="margin-left:auto;font-family:var(--fm);font-weight:700">${S(total)} / unidad</span></div>
       <div class="tw"><table><thead><tr><th>Insumo</th><th class="n">Por tanda</th><th class="n">Por unidad</th>
         <th class="n">S/ por unidad de insumo</th><th class="n">Costo por unidad</th><th class="n">% de la línea</th></tr></thead>
        <tbody>${filas.map(f=>`<tr><td style="font-weight:600">${esc(f.n)}${f.extra?`<div style="font-size:11px;color:var(--ink5);font-weight:400">${f.extra}</div>`:""}</td>
         <td class="n">${f.lote!=null?N(f.lote,1)+" "+esc(f.u||""):"—"}</td>
         <td class="n" style="font-weight:600">${N(f.unid,2)} ${esc(f.u||"")}</td>
         <td class="n" style="color:var(--ink5)">${f.cu!=null?S3(f.cu):"—"}</td>
         <td class="n" style="font-weight:700">${S(f.c)}</td>
         <td class="n">${total?P(100*f.c/total,1):"—"}</td></tr>`).join("")}</tbody></table></div></div>`;
     let html="";
     const st=L.subtotales||{};
     // nivel 1: la masa, con su receta propia
     if(semi){
       const g=(L.semielaborado.gramos_por_unidad||0);
       const harina=(semi.receta||[]).reduce((s,r)=>s+(/harina/i.test(r.nombre)?r.cant_lote:0),0)||1;
       html+=bloque(semi.nombre, `${N(g,1)} g de masa por unidad · la tanda rinde ${N(semi.rinde_g)} g y cuesta ${S(semi.costo_tanda)}`,
         (semi.receta||[]).map(r=>({n:r.nombre, lote:r.gramos, u:"g",
            unid:(r.gramos||0)*g/(semi.rinde_g||1), cu:r.costo_unit,
            c:(r.costo||0)*g/(semi.rinde_g||1),
            extra:r.pct_panadero!=null?N(r.pct_panadero,1)+"% panadero":""})),
         st.semielaborado||0,"Nivel 1 · masa");
       if((semi.usado_por||[]).length>1)
         html+=`<div class="note" style="margin:-4px 0 11px"><b>Esta misma masa la usan ${semi.usado_por.length} productos.</b>
           ${semi.usado_por.map(x=>esc((D.productos.find(q=>q.id===x)||{}).nombre||x)).join(" · ")}.
           Cambiar un insumo de acá los mueve a todos.</div>`;
     }
     // nivel 1: rellenos, con su receta propia
     (L.rellenos||[]).forEach(rl=>{
       const R=D.rellenos.find(x=>x.id===rl.id||x.nombre===rl.nombre);
       const g=rl.gramos_por_unidad||0;
       if(R) html+=bloque(R.nombre, `${N(g,1)} g por unidad · la tanda rinde ${N(R.rinde_g)} g y cuesta ${S(R.costo_tanda)}`+
         (R.min_mano_obra?` · ${N(R.min_mano_obra)} min de preparación por tanda`:""),
         (R.insumos||[]).map(r=>{const I=D.insumos.find(x=>x.id===r.insumo_id)||{};
           return {n:I.nombre||r.insumo_id, lote:r.gramos, u:I.unidad_receta||"g",
            unid:(r.gramos||0)*g/(R.rinde_g||1), cu:I.costo_efectivo,
            c:(r.costo||0)*g/(R.rinde_g||1)};}),
         rl.costo_por_unidad||0,"Nivel 1 · relleno")
         +(R.min_mano_obra?`<div class="note warn" style="margin:-4px 0 11px"><b>Ojo con estos ${N(R.min_mano_obra)} minutos.</b>
           ${esc(R.nota||"")}</div>`:"");
       else html+=bloque(rl.nombre||"Relleno", `${N(g,1)} g por unidad`, [], rl.costo_por_unidad||0,"Nivel 1 · relleno");
     });
     // nivel 2: lo que se le pone encima y el empaque
     if((L.directos||[]).length)
       html+=bloque("Insumos directos","Lo que se le pone al producto ya formado, fuera de la masa",
         L.directos.map(x=>({n:x.nombre, lote:(x.gramos_por_unidad||0)*lote, u:"g",
           unid:x.gramos_por_unidad||0, cu:null, c:x.costo_por_unidad||0,
           extra:x.uso?esc(x.uso):""})), st.directos||0,"Nivel 2 · directos");
     if((L.empaque||[]).length)
       html+=bloque("Empaque","Lo que se lleva el cliente",
         L.empaque.map(x=>({n:x.nombre, lote:(x.cantidad||0)*lote, u:"und",
           unid:x.cantidad||0, cu:null, c:x.costo_por_unidad||0})), st.empaque||0,"Nivel 2 · empaque");
     const totMP=(st.semielaborado||0)+(st.rellenos||0)+(st.directos||0)+(st.empaque||0);
     // si el producto no tiene cascada, se muestra la receta plana
     if(!html) html=bloque(p.nombre,`Receta directa · tanda de ${N(lote)} unidades`,
       (p.receta||[]).map(r=>({n:r.nombre, lote:r.cant_lote, u:r.unidad||"g",
         unid:(r.cant_lote||0)/lote, cu:r.costo_unit_ins, c:r.costo_por_unidad||0,
         extra:r.tipo!=="masa"?esc(r.tipo):""})), p.mp,"Receta");
     return html+`
      <div class="tw"><table><tfoot><tr><td>TOTAL MATERIA PRIMA POR UNIDAD</td>
        <td class="n" style="font-weight:700">${S(totMP||p.mp)}</td>
        <td class="n">${P(100*(totMP||p.mp)/p.neto,1)} del precio neto</td></tr></tfoot></table></div>
      <div class="note" style="margin:12px 0 0"><b>Qué falta acá y dónde está.</b>
       Esta es la materia prima. Los <b>minutos</b> de cada paso están en la ficha del producto
       (pestaña Productos, clic en el producto) y el resumen por estación en Mano de obra.
       ${p.pasos&&p.pasos.length?`${esc(p.nombre)} lleva ${p.pasos.length} pasos y ${N(p.min_hombre,2)} minutos de persona por unidad.`:""}</div>`;
   })()}
  </div>
  <div class="card"><div class="ch"><div><h2 class="ct">Rellenos <span class="cnt">${D.rellenos.length}</span></h2>
    <p class="cs">Sub-recetas con su propio rendimiento. El producto paga por los gramos que usa.</p></div></div>
   <div class="tw"><table><thead><tr><th>Relleno</th><th class="n">Rinde</th><th class="n">Costo tanda</th>
     <th class="n">Costo por kg</th><th class="n">Min. preparación</th><th>Ingredientes</th></tr></thead>
    <tbody>${D.rellenos.map(r=>`<tr><td style="font-weight:600">${esc(r.nombre)}</td>
      <td class="n">${N(r.rinde_g)} g</td><td class="n">${S(r.costo_tanda)}</td>
      <td class="n">${S(r.costo_por_g*1000)}</td><td class="n">${N(r.min_mano_obra||0)} min</td>
      <td style="font-size:12.5px;color:var(--ink7)">${r.insumos.map(x=>esc((INS[x.insumo_id]||{}).nombre||x.insumo_id)+" "+N(x.gramos)+"g").join(" · ")}</td></tr>`).join("")}</tbody>
   </table></div></div>`;
  $$("#p-ins input[data-fam]").forEach(el=>el.oninput=e=>{
    ST.insumos[e.target.dataset.fam]=+e.target.value;
    const lb=e.target.parentElement.querySelector("span");
    if(lb){const v=+e.target.value; lb.textContent=(v>0?"+":"")+v+"%";
      lb.style.color=v>0?"var(--ba)":v<0?"var(--ok)":"var(--c600)";}
    clearTimeout(window._ti);
    window._ti=setTimeout(()=>{save();vIns();vRes();vProd();vUtil();vAlertas();pintarBadge();setTimeout(()=>tablasFiltrables(),30);},300);
  });
  $("#bInsReset").onclick=()=>{FAMILIAS.forEach(f=>ST.insumos[f]=0);save();render();};
  if($("#recSel")) $("#recSel").onchange=e=>{RECE=e.target.value;vIns();setTimeout(()=>tablasFiltrables($("#p-ins")),20);};
  $("#qIns").oninput=e=>{const q=e.target.value.toLowerCase();
    $$("#tbIns tr").forEach(t=>t.style.display=!q||t.dataset.q.includes(q)?"":"none");};
}

/* ---------------- MANO DE OBRA ---------------- */
function vMo(){
  const F=D.factor_seguridad, MZ=D.matriz_mo[ST.anio]||{};
  const ps=TODOS().filter(p=>p.pasos.length).map(p=>{
    const m=Object.values(MZ[p.id]||{}).reduce((s,x)=>s+x.min,0)/12;
    const c=Object.values(MZ[p.id]||{}).reduce((s,x)=>s+x.costo,0)/12;
    return {...p, u:und(p.id,ST.anio), minMes:m, costoMes:c};
  });
  const totDem=ps.reduce((s,p)=>s+p.minMes,0);
  const cap=D.capacidad.map(c=>{
    const dem=ps.reduce((s,p)=>s+((MZ[p.id]||{})[c.id]?.min||0),0)/12;
    return {...c, dem, util:c.min_practica?100*dem/c.min_practica:0,
            holgura:c.min_practica-dem, utilTeo:c.min_teorica?100*dem/c.min_teorica:0};
  });
  const totPrac=cap.reduce((s,c)=>s+c.min_practica,0), totTeo=cap.reduce((s,c)=>s+c.min_teorica,0);
  const totHolg=totPrac-totDem;
  const costoMin=cap.reduce((s,c)=>s+c.pool,0);
  const costoOcio=cap.reduce((s,c)=>s+c.holgura*c.tarifa,0);

  const MMES=Array.from({length:12},(_,i)=>{
    const C=consumoMO(ST.anio,i+1);
    return {mes:i+1, min:C.min, costo:C.costo, niv:C.niv, setup:C.setup, und:C.und, porEst:C.porEst};
  });
  $("#p-mo").innerHTML=`
  <div class="note">La mano de obra se mide en minutos, no repartiendo sueldos a ojo. Cada paso consume minutos de una estación,
   y las ventas del año dicen cuántos minutos se piden en total.</div>

  <div class="kpis">
   <div class="kpi"><span class="kl">Capacidad teórica</span><div class="kv">${N(totTeo/60)} h</div>
     <div class="kf"><span>horas contratadas al mes</span></div></div>
   <div class="kpi c"><span class="kl">Capacidad práctica</span><div class="kv">${N(totPrac/60)} h</div>
     <div class="kf"><span>${P(F*100,0)} de la teórica</span></div></div>
   <div class="kpi"><span class="kl">Demanda de las ventas</span><div class="kv">${N(totDem/60)} h</div>
     <div class="kf"><span>${N(totDem)} minutos/mes</span></div></div>
   <div class="kpi ${totDem/totPrac>=0.95?'ba':totDem/totPrac>=0.85?'wa':'ok'}"><span class="kl">Utilización</span>
     <div class="kv">${P(100*totDem/totPrac,1)}</div><div class="kf"><span>sobre la práctica</span></div></div>
   <div class="kpi ok"><span class="kl">Holgura</span><div class="kv">${N(totHolg/60)} h</div>
     <div class="kf"><span>${S0(costoOcio)} al mes</span></div></div>
  </div>

  <div class="note warn"><b>Por qué no se usa el 100%.</b> Nadie produce las 8 horas seguidas: hay cambios de turno, limpieza,
   calibración del horno, mantenimiento, pedidos que se rehacen y días que no salen. Por eso la capacidad que se puede comprometer
   es el <b>${P(F*100,0)}</b> de la contratada, no el total. Programar contra la teórica es lo que hace que un pedido grande
   reviente el viernes. La holgura de <b>${N(totHolg/60)} horas</b> no es desperdicio: es el colchón que absorbe los imprevistos.</div>

  <div class="card"><div class="ch"><div><h2 class="ct">Simular cambios de tarifa</h2>
    <p class="cs">Un aumento de sueldo o un cambio de dotación mueve el costo por minuto, y de ahí se propaga a cada
     producto según los minutos que consume en esa estación.</p></div>
    <button class="btn" id="bEstReset">Volver a cero</button></div>
   <div class="simg">${D.estaciones.map(e=>{const v=ST.estaciones[e.id]||0;
     return `<div class="fg"><label>${esc(e.nombre)}:
      <span style="font-family:var(--fm);color:${v>0?'var(--ba)':v<0?'var(--ok)':'var(--c600)'}">${v>0?"+":""}${v}%</span></label>
      <input class="sl" type="range" min="-20" max="40" value="${v}" data-est="${e.id}"/>
      <div style="font-size:11px;color:var(--ink5)">${S3(e.costo_minuto_hombre*(1+v/100))} por minuto</div></div>`}).join("")}</div>
   ${(()=>{const hay=D.estaciones.some(e=>ST.estaciones[e.id]);
     if(!hay) return "";
     const b=D.productos.map(p=>p.mod*und(p.id,ST.anio)/12).reduce((a,x)=>a+x,0);
     const a2=TODOS().map(p=>p.mod*und(p.id,ST.anio)/12).reduce((a,x)=>a+x,0);
     return `<div class="note ${a2>b?'bad':'warn'}" style="margin:14px 0 0">La mano de obra del mes pasa de
      <b>${S0(b)}</b> a <b>${S0(a2)}</b>: ${a2>b?"son":"se ahorran"} <b>${S0(Math.abs(a2-b))}</b> al mes.</div>`})()}
  </div>

  <div class="card"><div class="ch"><div><h2 class="ct">Utilización por estación</h2>
    <p class="cs">Teórica es lo contratado. Práctica es lo que se puede comprometer de verdad. Demanda es lo que piden las ventas de ${ST.anio}.</p></div></div>
   <p class="cs" style="margin:0 0 9px">Clic en una estación para ver qué productos la cargan y por qué no cuadra.</p>
   <div class="tw"><table><thead><tr><th>Estación</th><th class="n">Teórica</th><th class="n">Práctica</th>
     <th class="n">Demanda</th><th class="n">Holgura</th><th style="width:170px">Utilización</th><th class="n">S/ por minuto</th></tr></thead>
    <tbody>${cap.sort((a,b)=>b.dem-a.dem).map(c=>`<tr class="clic" data-e="${c.id}">
      <td style="font-weight:600">${esc(c.nombre)} <span style="color:var(--c600);font-size:11px">ver carga ›</span></td>
      <td class="n" style="color:var(--ink5)">${N(c.min_teorica)}</td>
      <td class="n">${N(c.min_practica)}</td><td class="n" style="font-weight:600">${N(c.dem)}</td>
      <td class="n" style="color:${c.holgura<0?'var(--ba)':'var(--ok)'}">${N(c.holgura)}</td>
      <td><div class="ptr" style="height:20px"><div class="pfl" style="width:${Math.min(100,c.util).toFixed(1)}%;
        background:${c.util>=95?'linear-gradient(90deg,#f87171,var(--babar))':c.util>=85?'linear-gradient(90deg,#fbbf24,var(--wabar))':'linear-gradient(90deg,#22c55e,var(--okbar))'}"></div>
        <div class="pac" style="left:100%"></div></div>
        <div style="font-family:var(--fm);font-size:11.5px;text-align:right;margin-top:2px">${P(c.util,1)}</div></td>
      <td class="n">${S3(c.tarifa)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>TOTAL</td><td class="n">${N(totTeo)}</td><td class="n">${N(totPrac)}</td>
      <td class="n">${N(totDem)}</td><td class="n">${N(totHolg)}</td>
      <td class="n">${P(100*totDem/totPrac,1)}</td><td class="n">${S0(costoMin)}</td></tr></tfoot></table></div>
   <div class="note" style="margin:12px 0 0">Cómo sale la tarifa: ${esc(cap[0].calculo||"pool mensual ÷ minutos prácticos")}</div></div>

  <div class="card"><div class="ch"><div><h2 class="ct">Cuánta mano de obra demanda cada producto</h2>
    <p class="cs">Minutos al mes que pide cada producto según lo que se vendió. Clic en una fila para ver sus pasos.</p></div></div>
   <div class="pb">${ps.sort((a,b)=>b.minMes-a.minMes).map(p=>`
     <div class="pr clic" data-p="${p.id}">
      <span class="pn" style="background:${p.minMes/totDem>0.15?'var(--babar)':'var(--g800)'}">${Math.round(100*p.minMes/totDem)}</span>
      <div class="pnm"><span>${esc(p.nombre)}</span>
       <span class="psb">${N(p.minMes/60)} h/mes · ${N(p.min_hombre,2)} min por unidad · ${S0(p.costoMes)} de mano de obra</span></div>
      <div class="ptr"><div class="pfl" style="width:${(100*p.minMes/ps[0].minMes).toFixed(1)}%"></div></div>
      <div class="pmt"><span>${P(100*p.minMes/totDem,1)}</span>
       <span class="bd ${p.ub_pct>=48?'ok':p.ub_pct>=42?'wa':'ba'}">UB ${P(p.ub_pct,0)}</span></div></div>`).join("")}</div>
  </div>

  <div class="card"><div class="ch"><div><h2 class="ct">Matriz producto × estación</h2>
    <p class="cs">Minutos al mes. Sirve para ver dónde se acumula el trabajo y qué producto satura cada puesto.</p></div></div>
   <div class="tw"><table><thead><tr><th>Producto</th>
     ${cap.map(c=>`<th class="n">${esc(c.nombre.split(" ")[0])}</th>`).join("")}
     <th class="n">Total</th><th class="n">min/unidad</th></tr></thead>
    <tbody>${ps.map(p=>`<tr class="clic" data-p="${p.id}"><td style="font-weight:600">${esc(p.nombre)}</td>
      ${cap.map(c=>{const m=((MZ[p.id]||{})[c.id]?.min||0)/12;
        return `<td class="n" ${m/totDem>0.08?'style="background:#fdf0e3;font-weight:600"':''}>${m?N(m):"—"}</td>`}).join("")}
      <td class="n" style="font-weight:700">${N(p.minMes)}</td>
      <td class="n">${N(p.min_hombre,2)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>DEMANDA TOTAL</td>${cap.map(c=>`<td class="n">${N(c.dem)}</td>`).join("")}
      <td class="n">${N(totDem)}</td><td class="n">—</td></tr>
     <tr><td>CAPACIDAD PRÁCTICA</td>${cap.map(c=>`<td class="n">${N(c.min_practica)}</td>`).join("")}
      <td class="n">${N(totPrac)}</td><td class="n">—</td></tr>
     <tr><td>UTILIZACIÓN</td>${cap.map(c=>`<td class="n"><span class="bd ${c.util>=95?'ba':c.util>=85?'wa':'ok'}">${P(c.util,0)}</span></td>`).join("")}
      <td class="n">${P(100*totDem/totPrac,0)}</td><td class="n">—</td></tr></tfoot></table></div></div>

<div class="card"><div class="ch"><div><h2 class="ct">Utilización mes a mes</h2>
    <p class="cs">Los minutos que realmente se piden en cada mes, no el promedio del año. Un mes promedio al 78% puede esconder un diciembre al 110%.</p></div>
    <span class="bd nt">acumula ${N(MMES.reduce((s,m)=>s+m.min,0))} min en ${ST.anio}</span></div>

   <div class="tw"><table><thead><tr><th>Mes</th><th class="n">Unidades</th>
     <th class="n">Min persona</th><th class="n">Masa</th><th class="n">Relleno</th><th class="n">Propios</th>
     <th class="n">Preparación</th><th class="n">Horas</th><th class="n">% de capacidad</th>
     <th class="n">Costo MOD</th><th class="n">Acumulado</th></tr></thead>
    <tbody>${(()=>{let ac=0; return MMES.map(m=>{ac+=m.min;
      const pc=totPrac?100*m.min/totPrac:0;
      return `<tr><td style="font-weight:600">${MES[m.mes]}</td>
       <td class="n">${N(m.und)}</td>
       <td class="n" style="font-weight:600">${N(m.min)}</td>
       <td class="n" style="color:var(--ink5)">${N(m.niv.semi)}</td>
       <td class="n" style="color:var(--ink5)">${N(m.niv.relleno)}</td>
       <td class="n" style="color:var(--ink5)">${N(m.niv.producto)}</td>
       <td class="n" style="color:var(--ink5)">${N(m.setup)}</td>
       <td class="n">${N(m.min/60)}</td>
       <td class="n"><span class="bd ${pc>=100?'ba':pc>=90?'aw':'ok'}">${P(pc,1)}</span></td>
       <td class="n">${S0(m.costo)}</td>
       <td class="n" style="color:var(--ink5)">${N(ac/60)} h</td></tr>`;}).join("")})()}
    </tbody>
    <tfoot><tr><td>AÑO ${ST.anio}</td><td class="n">${N(MMES.reduce((s,m)=>s+m.und,0))}</td>
     <td class="n">${N(MMES.reduce((s,m)=>s+m.min,0))}</td>
     <td class="n">${N(MMES.reduce((s,m)=>s+m.niv.semi,0))}</td>
     <td class="n">${N(MMES.reduce((s,m)=>s+m.niv.relleno,0))}</td>
     <td class="n">${N(MMES.reduce((s,m)=>s+m.niv.producto,0))}</td>
     <td class="n">${N(MMES.reduce((s,m)=>s+m.setup,0))}</td>
     <td class="n">${N(MMES.reduce((s,m)=>s+m.min,0)/60)}</td>
     <td class="n">${P(totPrac?100*MMES.reduce((s,m)=>s+m.min,0)/(totPrac*12):0,1)}</td>
     <td class="n">${S0(MMES.reduce((s,m)=>s+m.costo,0))}</td><td class="n"></td></tr></tfoot></table></div>

   <div class="note" style="margin:12px 0 0"><b>Cuadre.</b> La suma de los doce meses da
    <b>${N(MMES.reduce((s,m)=>s+m.min,0))} minutos</b> y <b>${S0(MMES.reduce((s,m)=>s+m.costo,0))}</b> de mano de obra directa.
    La misma cifra que sale del P&L por otro camino: ${S0((D.pnl||{}).mano_obra_directa_mes*12||0)} al año.
    Si las dos no coinciden, alguna vista está mintiendo.</div>

   ${(()=>{const pico=MMES.slice().sort((a,b)=>b.min-a.min)[0]; if(!pico) return "";
     const cp=capPractica();
     const filas=Object.entries(pico.porEst).map(([e,v])=>({e,v,c:cp[e]||{}}))

      ${rojas.length?`<div class="note ba" style="margin:12px 0 0"><b>En ${MES[pico.mes]} no alcanza.</b>
        ${rojas.map(f=>`${esc(f.c.nombre||f.e)} pide ${N(f.v.min)} minutos y tiene ${N(f.c.min_practica)}: le faltan
         <b>${N(f.v.min-f.c.min_practica)}</b>, que son ${N((f.v.min-f.c.min_practica)/((D.planilla||{}).minutos_disponibles_por_persona_mes||8985.6),2)} personas más ese mes`).join("; ")}.

   </div>

    <p class="cs">De aquí sale el costo por minuto. El factor de carga social (${N((D.planilla||{}).factor_carga_social||0,2)})
     suma gratificaciones, CTS y EsSalud al sueldo bruto. Cada persona tiene ${N((D.planilla||{}).horas_mes||0)} horas al mes,
     de las que se comprometen el ${P(((D.planilla||{}).factor_capacidad_practica||0)*100,0)}.</p></div></div>
   <div class="tw"><table><thead><tr><th>Puesto</th><th class="n">Sueldo bruto</th><th class="n">Costo empresa</th>

      <td><span class="bd ${x.es_directo?'ok':'nt'}">${x.es_directo?'directo':'indirecto'}</span></td></tr>`).join("")}</tbody>
    <tfoot><tr><td>TOTAL</td><td class="n">${S0(((D.planilla||{}).puestos||[]).reduce((s,x)=>s+(x.sueldo_bruto||0),0))}</td>
      <td class="n">${S0(((D.planilla||{}).puestos||[]).reduce((s,x)=>s+(x.costo_cargado_mes||0),0))}</td>
      <td class="n">—</td><td></td></tr></tfoot></table></div>

  $$("#p-mo input[data-est]").forEach(el=>el.oninput=e=>{

  });
  $("#bEstReset").onclick=()=>{D.estaciones.forEach(e=>ST.estaciones[e.id]=0);save();render();};
  $$("#p-mo .clic").forEach(t=>t.onclick=()=>t.dataset.e?abrirEst(t.dataset.e):abrir(t.dataset.p));
}

/* desglose de una linea del P&L */
function verDesglose(key){
  const box=$("#desgl"); if(!box) return;
  if(box.dataset.k===key){ box.innerHTML=""; box.dataset.k=""; return; }
  box.dataset.k=key;
  const ps=TODOS().map(p=>({...p,u:und(p.id,ST.anio)/12}));
  const V=ps.reduce((s,p)=>s+vta(p,ST.anio)/12,0);
  const fila=(c,m,n)=>`<tr><td style="font-weight:600">${esc(c)}</td>
    <td class="n" style="font-weight:600">${S0(m)}</td><td class="n">${P(100*m/V,2)}</td>
    <td style="font-size:12.5px;color:var(--ink7)">${esc(n||"")}</td></tr>`;
  const caja=(tit,sub,filas,total)=>`<div class="card" style="margin:9px 0 0;background:var(--s100);border-color:var(--c600)">
    <div class="ch"><div><h2 class="ct" style="font-size:16px">${esc(tit)}</h2><p class="cs">${sub}</p></div>
     <button class="btn sm" id="cerrarD">Cerrar</button></div>
    <div class="tw"><table><thead><tr><th>Concepto</th><th class="n">S/ al mes</th><th class="n">% venta</th><th>Nota</th></tr></thead>
     <tbody>${filas}</tbody><tfoot><tr><td>TOTAL</td><td class="n">${S0(total)}</td>
      <td class="n">${P(100*total/V,2)}</td><td></td></tr></tfoot></table></div></div>`;
  let html="";
  if(key==="cuf"){
    const MP=ps.reduce((s,p)=>s+p.mp*p.u,0), MO=ps.reduce((s,p)=>s+p.mod*p.u,0);
    const CI=ps.reduce((s,p)=>s+p.cif*p.u,0);
    const pl=D.planilla.puestos||[];
    const dir=pl.filter(q=>q.clase==="MOD_PROD"||q.clase==="MOD_FOH").reduce((s,q)=>s+q.costo_cargado_mes,0);
    html=caja("Qué hay dentro del costo de ventas",
      "Los tres elementos del costeo: lo que se compra, lo que se trabaja y lo que cuesta tener la planta andando.",
      fila("Materia prima y empaque",MP,"Insumos valorizados con merma, rellenos y empaque")+
      fila("Mano de obra directa",MO,"Minutos cronometrados × tarifa de cada estación. Planilla directa disponible: "+S0(dir))+
      D.cif.map(c=>fila("CIF · "+c.concepto,c.monto_mensual,"Driver: "+c.driver)).join(""),
      MP+MO+D.cif.reduce((s,c)=>s+c.monto_mensual,0));
  } else if(key==="canal"){
    const E={}; D.canales.forEach(c=>E[c.id]=econCanal(c,ST.anio));
    html=caja("Comisiones por canal","Lo que se lleva cada plataforma. No depende del pan sino de por dónde salió.",
      D.canales.map(c=>fila(c.nombre,E[c.id].com/12,
        c.comision_pct?P(c.comision_pct,0)+" de su venta bruta · ticket "+S((E[c.id].ticket||0)):"Sin comisión de plataforma")).join(""),
      D.canales.reduce((s,c)=>s+E[c.id].com/12,0));
  } else if(key==="ocio"){
    const MZ=D.matriz_mo[ST.anio]||{};
    const pools=D.capacidad.map(c=>{
      const dem=ps.reduce((s,p)=>s+((MZ[p.id]||{})[c.id]?.min||0),0)/12;
      return {...c, holg:Math.max(0,c.min_practica-dem), ocio:Math.max(0,c.min_practica-dem)*c.tarifa};});
    html=caja("Capacidad pagada y no usada, estación por estación",
      "Minutos que están en la planilla y no los pidió ningún producto. NIC 2 párr. 13: gasto del periodo, no costo del pan.",
      pools.map(c=>fila(c.nombre,c.ocio,N(c.holg)+" minutos libres × S/ "+N(c.tarifa,4)+" por minuto")).join(""),
      pools.reduce((s,c)=>s+c.ocio,0));
  } else if(key==="reg"){
    const R=D.regalias||{}; const base=V;
    html=caja("Regalía contractual","Se cobra sobre la venta, antes de cualquier costo de estructura.",
      fila("Base: "+(R.base==="venta_neta"?"venta neta sin IGV":"venta bruta"),base,"Lo que factura el negocio en el mes")+
      fila("Regalía "+P(R.pct,0)+" para "+(R.beneficiario||"el licenciante"),base*R.pct/100,R.nota||"")+
      fila("Si la base fuera la venta CON IGV",base*(1+ST.igv/100)*R.pct/100,"Diferencia de "+S0(base*((1+ST.igv/100)-1)*R.pct/100)+" al mes"),
      base*R.pct/100);
  } else if(key==="deuda"){
    html=caja("Gastos financieros","Solo el interés. La amortización baja deuda y no pasa por el resultado.",
      (D.deuda.lineas||[]).map(l=>fila(l.nombre,l.interes_mes,l.para)).join(""),
      (D.deuda.lineas||[]).reduce((s,l)=>s+l.interes_mes,0));
  } else if(key==="ir"){
    html=`<div class="note" style="margin:9px 0 0"><b>El impuesto está desglosado en su propia tarjeta más abajo</b>,
      con los dos tramos del régimen MYPE y cuánto falta para pasarse al régimen general.</div>`;
    box.innerHTML=html; return;
  } else if(key.startsWith("g:")){
    const id=key.slice(2), g=D.gastos.find(x=>x.id===id);
    const det=(D.detalle_gastos||{})[id];
    if(det==="planilla"){
      const pl=(D.planilla.puestos||[]).filter(q=>q.clase==="GA_PLANILLA"||q.clase==="GV_PLANILLA");
      html=caja("Planilla de estructura, persona por persona",
        "Administración, comercial y tienda. Ninguno de estos sueldos entra al costo del pan.",
        pl.map(q=>fila(q.puesto,q.costo_cargado_mes,q.area+" · sueldo "+S0(q.sueldo_bruto)+" + cargas y movilidad")).join(""),
        pl.reduce((s,q)=>s+q.costo_cargado_mes,0));
    } else if(Array.isArray(det)){
      html=caja(g.concepto,"Desglose de la línea.",det.map(x=>fila(x.c,x.m,x.n)).join(""),
        det.reduce((s,x)=>s+x.m,0));
    } else {
      html=`<div class="note" style="margin:9px 0 0">Esta línea no tiene desglose cargado todavía.</div>`;
    }
  }
  box.innerHTML=html;
  if($("#cerrarD")) $("#cerrarD").onclick=()=>{box.innerHTML="";box.dataset.k="";};
  box.scrollIntoView({block:"nearest",behavior:"smooth"});
}

function vUtil(){
  const ps=TODOS().map(p=>({...p,u:und(p.id,ST.anio)/12}));
  const MZ=D.matriz_mo[ST.anio]||{};
  const V=ps.reduce((s,p)=>s+vta(p,ST.anio)/12,0);
  const MP=ps.reduce((s,p)=>s+p.mp*p.u,0);
  const MO=ps.reduce((s,p)=>s+p.mod*p.u,0), CI=ps.reduce((s,p)=>s+p.cif*p.u,0);
  const CUF=MP+MO+CI, MB=V-CUF;                    // piso 1 y margen bruto

  // linea 7: capacidad pagada y no usada, por pool. NO se reparte a productos (NIC 2, parr. 13)
  const pools=D.capacidad.map(c=>{
    const dem=ps.reduce((s,p)=>s+((MZ[p.id]||{})[c.id]?.min||0),0)/12;
    return {...c, dem, holg:Math.max(0,c.min_practica-dem), ocio:Math.max(0,c.min_practica-dem)*c.tarifa};
  });
  const OCIO=pools.reduce((s,c)=>s+c.ocio,0);
  const MERMA=CUF*0.05;                            // provision de mermas, 5% del costo de ventas
  const REG=(D.regalias||{}).pct?V*(D.regalias.pct/100):0;   // regalia contractual sobre la venta

  // la bolsa que no se reparte al producto: estructura + periodo
  const gl=id=>(D.gastos.find(g=>g.id===id)||{}).monto_mensual||0;
  const ADM=gl("go_administracion"), ALQ=gl("go_alquiler_tienda"), SER=gl("go_servicios");
  const MKT=gl("go_marketing"), CON=gl("go_contabilidad");
  /* A1 (revision Motor V4, 27-nov): la escalera restaba solo la comision de
     plataforma, y como monto pegado del ano 2026. econCanal ya calcula los tres
     costos variables de canal; se toman de ahi para que sigan al ano elegido. */
  const EC=D.canales.map(k=>econCanal(k,ST.anio));
  const COMD=EC.reduce((s,e)=>s+(e.com||0),0)/12;
  const POSC=EC.reduce((s,e)=>s+(e.pos||0),0)/12;
  const EMPC=EC.reduce((s,e)=>s+(e.emp||0),0)/12;
  const DEP=(D.cif.find(c=>/depreciac/i.test(c.concepto))||{}).monto_mensual||0;
  const PEAJE=OCIO+D.gastos.filter(g=>g.id!=="go_comisiones_delivery").reduce((s,g)=>s+g.monto_mensual,0)+PLAN_FUERA;
  // la estructura ya no es una lista fija: sale de los gastos, menos las comisiones del canal
  const GEST=D.gastos.filter(g=>g.id!=="go_comisiones_delivery");
  /* A2: pool_directo_mensual de la planilla (28,797.55) contra la suma de los
     pools de estacion (27,348.53). La diferencia es tiempo pagado de produccion
     que no cae en ninguna estacion y que no estaba en ninguna linea del P&L. */
  const PLAN_FUERA=Math.max(0,((D.planilla||{}).pool_directo_mensual||0)-D.capacidad.reduce((s,c)=>s+c.pool,0));
  const ESTR=GEST.reduce((s,g)=>s+g.monto_mensual,0)+PLAN_FUERA;
  const EBIT=MB-REG-MERMA-COMD-POSC-EMPC-OCIO-ESTR;
  const DEPREP=(((D.detalle_gastos||{}).go_reparto)||[]).filter(x=>/epreciac/i.test(x.c)).reduce((s,x)=>s+x.m,0);
  const DEPT=DEP+DEPREP;
  const EBITDA=EBIT+DEPT;                          // se devuelve la depreciacion ya cargada arriba
  const GF=(D.deuda||{}).gasto_financiero_mes||0;
  const UAI=EBIT-GF;
  const TOPE=(D.impuestos||{}).uit*((D.impuestos||{}).tramo_1_uit||15);
  const uaiA=UAI*12;
  const IR=UAI>0?(Math.min(uaiA,TOPE)*D.impuestos.tasa_tramo_1/100+Math.max(0,uaiA-TOPE)*D.impuestos.tasa_exceso/100)/12:0;
  const NETO=UAI-IR;

  // reparto del peaje POR RECURSOS (minutos), no por venta
  const minProd=p=>Object.values(MZ[p.id]||{}).reduce((s,x)=>s+x.min,0)/12;
  const totMin=ps.reduce((s,p)=>s+minProd(p),0);
  const pr=ps.map(p=>{
    const m=minProd(p), vP=vta(p,ST.anio)/12, uP=p.u||0;
    const nt=uP?vP/uP:p.neto;
    const peaje=totMin?PEAJE*m/totMin:0;           // su parte de la bolsa, por recursos
    const merma=p.cuf*0.05*uP;
    const piso1=p.cuf;
    const piso2=uP?piso1+(totMin?OCIO*m/totMin:0)/uP:piso1;
    /* A5: piso2 ya lleva la ociosidad del producto; PEAJE tambien la lleva, asi
       que sumar el peaje completo la contaba dos veces. Y el libro
       (DOCTRINA:PISOS_DE_COSTO) pone la regalia dentro del piso 3. */
    const estr=totMin?ESTR*m/totMin:0;
    const reg=(D.regalias||{}).pct?vP*(D.regalias.pct/100):0;
    const piso3=uP?piso2+(merma+reg+estr)/uP:piso2;
    const r_=((D.regalias||{}).pct||0)/100;
    const pisoInc=p.cuf*1.05/(1-r_);
    const pisoPleno=uP?(piso2+(merma+estr)/uP)/(1-r_):pisoInc;
    return {...p, m, vP, nt, uP, peaje, peajeU:uP?peaje/uP:0, piso1, piso2, piso3, pisoInc, pisoPleno,
      mcU:nt-p.mp, mc:(nt-p.mp)*uP, aporte:(nt-piso1)*uP,
      pagaPeaje:nt>=pisoPleno, pierde:nt<pisoInc,
      pctMin:totMin?100*m/totMin:0, pctVta:V?100*vP/V:0};
  }).sort((a,b)=>b.aporte-a.aporte);

  const f=(lb,v,nota,t)=>`<div class="cr"><div class="clb"><span>${lb}</span><span class="cnt2">${nota}</span></div>
    <div class="cbar"><div class="cseg ${t}" style="width:${(100*v/V).toFixed(2)}%"></div>
     <div class="cseg rest" style="width:${(100-100*v/V).toFixed(2)}%"></div></div>
    <div class="n" style="color:var(--ba)">−${S0(v)}</div><div class="n">${P(100*v/V,1)}</div></div>`;
  const fd=(lb,v,nota,t,key)=>`<div class="cr clicd" data-d="${key}" style="cursor:pointer">
    <div class="clb"><span>${lb} <span style="color:var(--c600);font-size:11px">ver detalle ›</span></span><span class="cnt2">${nota}</span></div>
    <div class="cbar"><div class="cseg ${t}" style="width:${(100*v/V).toFixed(2)}%"></div>
     <div class="cseg rest" style="width:${(100-100*v/V).toFixed(2)}%"></div></div>
    <div class="n" style="color:var(--ba)">−${S0(v)}</div><div class="n">${P(100*v/V,1)}</div></div>`;
  const h=(lb,v,nota,fuerte)=>`<div class="cr" style="border-top:2px solid var(--lineS);border-bottom:none;padding:11px 0;${fuerte?'background:var(--g50)':''}">
    <div class="clb"><span style="font-family:var(--fd);font-weight:700;font-size:${fuerte?'17px':'15px'}">${lb}</span><span class="cnt2">${nota}</span></div>
    <div class="cbar"><div class="cseg" style="width:${(100*v/V).toFixed(2)}%;background:${fuerte?'var(--okbar)':'var(--g100)'}"></div></div>
    <div class="n" style="font-weight:700;font-size:${fuerte?'17px':'15px'}">${S0(v)}</div>
    <div class="n"><span class="bd ${v>0?(fuerte?'ok':'wa'):'ba'}">${P(100*v/V,1)}</span></div></div>`;

  $("#p-util").innerHTML=`
  <div class="note"><b>Dónde para el costo del producto y dónde empieza la bolsa.</b>
   Materia prima, mano de obra y CIF son el <b>piso del producto</b>: lo que cuesta fabricarlo.
   De ahí en adelante nada es del producto — es del negocio. Ordenado como lo ordena el motor, y como lo exige la norma.
   Cifras de un mes promedio de ${ST.anio}.</div>

  <div class="kpis">
   <div class="kpi"><span class="kl">Venta neta del mes</span><div class="kv">${S0(V)}</div></div>
   <div class="kpi c"><span class="kl">Costo de fabricar (CUF)</span><div class="kv">${P(100*CUF/V,1)}</div>
     <div class="kf"><span>${S0(CUF)} · piso 1</span></div></div>
   <div class="kpi ok"><span class="kl">Margen bruto</span><div class="kv">${P(100*MB/V,1)}</div>
     <div class="kf"><span>${S0(MB)}</span></div></div>
   <div class="kpi wa"><span class="kl">Peaje (bolsa no repartible)</span><div class="kv">${P(100*PEAJE/V,1)}</div>
     <div class="kf"><span>${S0(PEAJE)}</span></div></div>
   ${REG?`<div class="kpi"><span class="kl">Regalía</span><div class="kv">${P((D.regalias||{}).pct,0)}</div>
     <div class="kf"><span>${S0(REG)} al mes · ${S0(REG*12)} al año</span></div></div>`:""}
   <div class="kpi ${NETO>0?'ok':'ba'}"><span class="kl">Resultado neto</span><div class="kv">${P(100*NETO/V,1)}</div>
     <div class="kf"><span>${S0(NETO)} · EBITDA ${P(100*EBITDA/V,1)}</span></div></div>
  </div>

  <div class="card"><div class="ch"><div><h2 class="ct">El P&amp;L por líneas, hasta el resultado neto</h2>
    <p class="cs">La misma escalera que usa el motor de costeo: primero lo que es del producto, después lo que es del periodo.
     <b>Haz clic en cualquier línea con flecha para ver qué hay dentro.</b></p></div>
   <span class="bd nt">mes promedio</span></div>
   <div class="casc">
    ${h("1 · Venta neta sin IGV",V,"Cada canal a su propio precio",false)}
    ${fd("2 · Costo de ventas (CUF)",CUF,"Materia prima + minutos cronometrados × tarifa + CIF por driver","costo","cuf")}
    ${h("3 · MARGEN BRUTO",MB,"Hasta acá llega el costo del producto",true)}
    ${REG?fd("4 · Regalía contractual",REG,P((D.regalias||{}).pct,0)+" de la venta para "+esc((D.regalias||{}).beneficiario||"el licenciante"),"gasto","reg"):""}
    ${f((REG?5:4)+" · Provisión de mermas",MERMA,"5% del costo de ventas: lo que se rompe, se pasa o se regala","costo")}
    ${fd((REG?6:5)+" · Comisiones de plataforma",COMD,"Rappi: 28% de la venta del canal. No es costo del pan","gasto","canal")}
    ${POSC?f((REG?7:6)+" · Comisión del POS",POSC,"Lo que cobra el operador por la venta con tarjeta","gasto"):""}

  <div class="card"><div class="ch"><div><h2 class="ct">Los cuatro pisos de un producto</h2>
    <p class="cs">Cada piso sirve para una decisión distinta y no se mezclan. Esta es la respuesta a
     "¿hasta dónde es costo del producto?".</p></div></div>
   <div class="tw"><table><thead><tr><th style="width:150px">Piso</th><th>Qué incluye</th><th>Para qué sirve</th><th>Qué NO puede hacer</th></tr></thead>
    <tbody>
     <tr><td style="font-weight:700;color:var(--g900)">1 · Costo de fabricación<div style="font-size:11px;font-weight:400;color:var(--ink5)">el CUF</div></td>
      <td>Materia prima real + minutos cronometrados × tarifa de mano de obra + minutos × tarifa de cada pool de CIF.</td>
      <td>Valorizar inventario, el costo de ventas del P&amp;L, y ver si una receta se encareció. Es lo único <b>medido</b>.</td>
      <td>No dice si el precio es suficiente: todavía no tiene nada del negocio.</td></tr>
     <tr><td style="font-weight:700">2 · Costo de producción pleno</td>
      <td>CUF + la capacidad pagada que no se usó.</td>
      <td>Decisiones de precio de largo plazo: si la planta está a media máquina, el pan "verdadero" cuesta más.</td>
      <td><b>No valoriza inventario ni entra al costo de ventas.</b> La NIC 2 párr. 13 lo prohíbe expresamente.</td></tr>
     <tr><td style="font-weight:700">3 · Costo pleno</td>
      <td>Piso 2 + mermas + gastos de operación, repartidos <b>por capas separadas</b> (tienda / servir / estructura).</td>
      <td>Una venta corporativa al costo. Es el número de "cuánto me cuesta de verdad atender a este cliente".</td>
      <td>No se construye con un solo porcentaje sobre el precio: eso esconde quién consume qué.</td></tr>
     <tr style="background:var(--g50)"><td style="font-weight:700">4 · Precio piso<div style="font-size:11px;font-weight:400;color:var(--ink5)">hay dos, no uno</div></td>
      <td><b>Incremental:</b> cubre lo que esa unidad causa. <b>Recuperación plena:</b> cubre además su parte de la bolsa.</td>
      <td>El incremental es el mínimo para llenar capacidad ociosa (un pedido puntual). El pleno es el mínimo para un negocio permanente.</td>
      <td>Vender siempre al incremental quiebra la empresa: nadie estaría pagando los fijos.</td></tr>
    </tbody></table></div>
   <div class="note warn" style="margin:13px 0 0"><b>La regla que ordena todo esto.</b>
    NIC 2, párrafo 13: el costo indirecto fijo se distribuye según la <b>capacidad normal</b>, y
    "el importe de costos indirectos fijos distribuido a cada unidad de producción no se incrementará como consecuencia
    de un nivel bajo de producción, ni por la existencia de capacidad ociosa.
    Los costos indirectos no distribuidos se reconocerán como gastos del periodo en que han sido incurridos".
    Traducido: <b>la capacidad que pagaste y no usaste es gasto del mes, no costo del pan</b>. Por eso la línea 6 de arriba
    está separada y no se reparte entre productos.</div>
  </div>

  <div class="card"><div class="ch"><div><h2 class="ct">La bolsa en acción: cuánto aporta cada producto al peaje</h2>
    <p class="cs"><b>Peaje</b> = su parte de los gastos fijos que no se reparten al costo del producto: estructura
     más capacidad pagada sin usar. Se reparte <b>por los recursos que consume</b>, no por lo que vende:
     el que más planta usa, más carga.</p></div>

   <div class="tw"><table><thead><tr><th>Producto</th><th class="n">Unid./mes</th><th class="n">% de la venta</th>

    <tbody>${pr.map(p=>{const sobra=p.aporte-p.peaje;
      return `<tr class="clic" data-p="${p.id}">
      <td style="font-weight:600">${esc(p.nombre)}</td>
      <td class="n">${N(p.uP)}</td>
      <td class="n">${P(p.pctVta,1)}</td>
      <td class="n" style="color:${p.pctMin>p.pctVta*1.25?'var(--ba)':'var(--ink7)'}">${P(p.pctMin,1)}</td>
      <td class="n" style="font-weight:600">${S0(p.aporte)}</td>
      <td class="n" style="color:var(--ba)">−${S0(p.peaje)}</td>
      <td class="n" style="font-weight:700;color:${sobra>0?'var(--ok)':'var(--ba)'}">${sobra>0?"+":"−"}${S0(Math.abs(sobra))}</td>
      <td class="n" style="color:var(--ink5)">${S(p.piso1)}</td>
      <td class="n">${S(p.piso3)}</td>
      <td class="n" style="font-weight:600">${S(p.nt)}</td>
      <td>${p.pierde?'<span class="bd ba">pierde plata</span>'
        :p.pagaPeaje?'<span class="bd ok">paga su peaje</span>'
        :'<span class="bd wa">cubre su costo, no su peaje</span>'}</td></tr>`}).join("")}</tbody>
    <tfoot><tr><td>TOTAL</td><td class="n">${N(pr.reduce((s,p)=>s+p.uP,0))}</td><td class="n">100%</td><td class="n">100%</td>
      <td class="n">${S0(pr.reduce((s,p)=>s+p.aporte,0))}</td>
      <td class="n">−${S0(PEAJE)}</td>
      <td class="n">${S0(pr.reduce((s,p)=>s+p.aporte,0)-PEAJE)}</td>
      <td class="n">—</td><td class="n">—</td><td class="n">—</td><td></td></tr></tfoot></table></div>
   <div class="note" style="margin:13px 0 0"><b>Cómo se lee esta tabla.</b>
    Las tres columnas que importan son <b>% de la venta</b>, <b>% de los minutos</b> y <b>sobra/falta</b>.
    Cuando un producto pesa más en minutos que en venta, está consumiendo más planta de la que paga: ese es el subsidio cruzado
    que el reparto por ventas esconde y el reparto por recursos destapa.
    ${(()=>{const sub=pr.filter(p=>p.pctMin>p.pctVta*1.2).sort((a,b)=>(b.pctMin-b.pctVta)-(a.pctMin-a.pctVta));
      const pag=pr.filter(p=>p.aporte-p.peaje>0).sort((a,b)=>(b.aporte-b.peaje)-(a.aporte-a.peaje));
      return (sub.length?`Hoy el caso más claro es <b>${esc(sub[0].nombre)}</b>: ${P(sub[0].pctVta,1)} de la venta
        pero ${P(sub[0].pctMin,1)} de los minutos. `:"Hoy ningún producto está claramente subsidiado. ")+
       (pag.length?`Y el que carga la casa es <b>${esc(pag[0].nombre)}</b>, que después de pagar su peaje todavía deja
        ${S0(pag[0].aporte-pag[0].peaje)} al mes para los demás.`:"")})()}</div>
   <div class="note warn" style="margin:13px 0 0"><b>Tres veredictos, no dos.</b>
    <b>Paga su peaje</b> = el precio cubre el piso 3, el producto se sostiene solo.
    <b>Cubre su costo pero no su peaje</b> = cubre lo que causa pero no su parte de los fijos; no se saca sin mirar
    quién pagaría esos fijos en su lugar, porque sacarlo no los elimina, los traslada.
    <b>Pierde plata</b> = el precio no cubre ni la materia prima: cada unidad vendida resta.</div>
  </div>

let VT={mes:"0"};
function vVentas(){
  const ps=TODOS().map(p=>({...p,u:und(p.id,ST.anio)}));
  const E={}; D.canales.forEach(c=>E[c.id]=econCanal(c,ST.anio));
  const TC=D.ticket_config||{}, META=(D.metas||{})[ST.anio]||{};
  const mes=VT.mes==="0"?null:VT.mes;
  const vC=c=>{const R=(D.rentabilidad_canal[ST.anio]||{})[c.id]||{};
    if(!mes) return {venta:R.venta||0,u:R.u||0};
    let v=0,u=0;
    ps.forEach(p=>{const q=(D.ventas[p.id]?.[ST.anio]?.[mes]||{})[c.id]||0;
      u+=q; v+=p.neto*(FPREC[c.id]!=null?FPREC[c.id]:1)*q;});
    return {venta:v,u};};
  const dat=D.canales.map(c=>{
    const {venta,u}=vC(c);
    const upt=(TC[c.id]||{}).und_por_ticket||1;
    const tx=u/upt;
    const meta=mes?(META[c.id]||{})[mes]||0:Object.values(META[c.id]||{}).reduce((a,b)=>a+b,0);
    const mcPct=E[c.id].mc_pct||0;
    return {...c, venta,u,tx, upt, ticket:tx?venta/tx:0, uxt:upt, meta,
      cumpl:meta?100*venta/meta:0, mc:venta*mcPct/100, mcPct};
  });
  const V=dat.reduce((s,c)=>s+c.venta,0), U=dat.reduce((s,c)=>s+c.u,0);
  const TX=dat.reduce((s,c)=>s+c.tx,0), MT=dat.reduce((s,c)=>s+c.meta,0);
  const MC=dat.reduce((s,c)=>s+c.mc,0);

  const col=id=>id==='tienda'?'var(--g700)':id==='pedidos'?'var(--teal)':id==='corporativo'?'#7c5cbf':'var(--c500)';
  const PH=D.perfil_hora||{}, horas=Object.keys(PH).map(Number).sort((a,b)=>a-b);
  const txTiendaDia=(dat.find(c=>c.id==='tienda')||{tx:0}).tx/dias;

  $("#p-ventas").innerHTML=`

/* ---------------- CONSUMO DE INSUMOS: UNA SOLA FUENTE ----------------
   Toda linea de receta guarda la cantidad POR TANDA; por unidad es cant_lote/unidades_lote.
   Las lineas de relleno se abren en sus propios insumos, para que inventario y consumo
   hablen del mismo kilo de azucar. */
function consumoInsumos(anio, mes, unidadesPorProd){
  const out={};
  const anota=(iid,nombre,familia,cant,costo,unidad,prod)=>{
    const k=iid||nombre;
    out[k]=out[k]||{id:iid,nombre,familia,cant:0,costo:0,unidad,prods:new Set()};
    out[k].cant+=cant; out[k].costo+=costo; if(prod)out[k].prods.add(prod);
  };
  TODOS().forEach(p=>{
    const u = unidadesPorProd ? (unidadesPorProd[p.id]||0) : und(p.id,anio,mes?String(mes):undefined);
    if(!u) return;
    const lote=p.unidades_lote||1;
    (p.receta||[]).forEach(r=>{
      const porU=(r.cant_lote||0)/lote;
      if(r.tipo==="relleno"){
        const R=(D.rellenos||[]).find(x=>x.nombre===r.nombre||x.id===r.id);
        if(R&&R.rinde_g){
          (R.insumos||[]).forEach(ri=>{
            const I=D.insumos.find(x=>x.id===ri.insumo_id)||{};
            const g=(ri.gramos||0)*porU/R.rinde_g;
            anota(ri.insumo_id, I.nombre||ri.insumo_id, I.familia||"otros",
                  g*u, g*u*(I.costo_efectivo||0), I.unidad_receta||"g", p.nombre);
          });
          return;
        }
      }
      const I=D.insumos.find(x=>x.nombre===r.nombre);
      anota(I?I.id:null, r.nombre, r.familia||(I||{}).familia||"otros",
            porU*u, (r.costo_por_unidad||0)*u, r.unidad||"g", p.nombre);
    });
  });
  return out;
}

/* ---------------- INVENTARIO Y PEDIDOS ----------------
   Dos cosas distintas que se usan juntas: contar lo que hay, y pedir lo que falta.
   El consumo sale del mismo modelo de recetas, así que lo teórico y lo contado
   se pueden restar y eso es la merma. */
let IV={fam:"", frec:"", q:"", ciego:false, cobertura:7, prov:""};
let PT={turno:"manana", dia:"viernes"};
function consumoDiario(){
  // misma fuente que la pestaña de Consumo, dividida entre los 365 días
  const C=consumoInsumos(ST.anio);
  const porIns={};
  Object.values(C).forEach(x=>{ if(x.id) porIns[x.id]=x.cant/365; });
  return porIns;
}
function invEstado(){
  const CD=consumoDiario();
  const cont=(ST.inv&&ST.inv.conteos)||{};
  return D.insumos.map(i=>{
    const dia=CD[i.id]||0;                           // en unidad de receta
    /* A8: consumoInsumos da el consumo NETO (gramos de receta). El stock se
       cuenta bruto, en unidad de compra. Sin dividir por (1-merma) el pedido
       sale corto y la cobertura inflada. */
    const diaC=dia/(1-(i.merma_pct||0))/(i.factor_conversion_compra_receta||1);
    const stock=cont[i.id]!=null?+cont[i.id]:null;   // lo que se contó, en unidad de compra
    const dias=stock!=null&&diaC>0?stock/diaC:(diaC>0?null:999);
    const objetivo=(i.lead_time_dias||3)+(+IV.cobertura||7);
    const necesita=diaC*objetivo;
    const falta=stock!=null?Math.max(0,necesita-stock):null;
    const pres=i.presentacion_compra||1;
    const pedir=falta!=null?Math.ceil(falta/pres)*pres:null;
    let sem="nd";
    if(dias!=null){ sem = dias<(i.lead_time_dias||3)?"rojo"
      : dias<((i.lead_time_dias||3)+(i.dias_seguridad||3))?"ambar" : "verde"; }
    if(diaC<=0) sem="nd";   // insumo sin receta activa: se cuenta, pero no se puede proyectar
    return {...i, dia, diaC, stock, dias, objetivo, necesita, falta, pedir, pres,
      valor:stock!=null?stock*i.costo_compra:0, costoPedido:pedir?pedir*i.costo_compra:0, sem};
  });
}

    cont.innerHTML=tabIns+tabPT+
     `<div class="note" style="margin:12px 0 0"><b>Por qué están en la base y no solo en el navegador.</b>
      Un conteo que vive en el navegador aguanta una recarga, pero no sale de ese equipo: si Deborah cuenta en

      se pueden editar después — si un conteo salió mal, se cuenta de nuevo y los dos quedan a la vista.</div>`;

/* ---------------- CANALES ---------------- */
let CAN={}; D.canales.forEach(c=>CAN[c.id]={com:c.comision_pct, pos:c.comision_pos_pct, dias:c.dias_cobro});
let TASA=D.tasa_capital_mensual;
function econCanal(c, anio){
  const R=(D.rentabilidad_canal[anio]||{})[c.id]||{}, k=CAN[c.id];
  const v=R.venta||0;
  const com=v*k.com/100;
  const pos=v*(c.pct_con_tarjeta/100)*(k.pos/100);
  const fin=v*(TASA/100)*k.dias/30;
  const emp=R.empaque||0;
  const mc=(R.ub||0)-com-pos-fin-emp;
  return {...R, com, pos, fin, emp, mc, mc_pct:v?100*mc/v:0, venta:v};
}
/* ---------------- CANAL B2B (mayorista) ----------------
   No hay historia de B2B, asi que esto es una simulacion, no un reporte.
   La pregunta correcta no es "deja margen", es "deja mas que la unidad de tienda
   que desplaza", porque la planta ya corre al limite. */
let B2={desc:25, und:1500, prod:"mix", dias:30, flete:0.35, minLote:4, mcObj:30};
function calcB2B(){
  const ps=TODOS().map(p=>({...p,u:und(p.id,ST.anio)}));
  const MZ=D.matriz_mo[ST.anio]||{};
  const minU=p=>{const t=Object.values(MZ[p.id]||{}).reduce((s,x)=>s+x.min,0); const uu=und(p.id,ST.anio); return uu?t/uu:0;};
  const vivos=ps.filter(p=>p.u>0 && !p.es_reventa);
  const Utot=vivos.reduce((s,p)=>s+p.u,0);
  const d=B2.desc/100, fin=(TASA/100)*B2.dias/30;
  const linea=p=>{
    const netoB2B=p.neto*(1-d);
    const costoFin=netoB2B*fin;
    const varB2B=p.mp+B2.flete+costoFin;            // lo que solo existe si vendes la unidad
    const mc=netoB2B-varB2B;                        // margen de contribucion B2B
    const mcTienda=p.neto-p.mp;                     // tienda no paga flete ni credito
    const ubB2B=netoB2B-p.cuf-B2.flete-costoFin;    // despues de absorber MOD y CIF
    // descuento al que el MC B2B iguala al MC de tienda (punto de indiferencia con planta llena)
    const dIndif=p.neto?100*(1-(mcTienda+B2.flete)/(p.neto*(1-fin))):0;
    // descuento maximo que aun deja el MC objetivo
    const dMax=p.neto?100*(1-(p.mp+B2.flete)/(p.neto*(1-fin)*(1-B2.mcObj/100))):0;
    return {...p, netoB2B, costoFin, varB2B, mc, mc_pct:netoB2B?100*mc/netoB2B:0, mcTienda,
      mcT_pct:p.neto?100*mcTienda/p.neto:0, ubB2B, ub_pct_b2b:netoB2B?100*ubB2B/netoB2B:0,
      dIndif, dMax, minU:minU(p)};
  };
  const filas=vivos.map(linea);
  // mix: reparte las unidades B2B segun el peso actual de cada producto
  const mezcla=filas.map(f=>({...f, q:B2.prod==="mix"? B2.und*f.u/Utot : (f.id===B2.prod?B2.und:0)}));
  const vta=mezcla.reduce((s,f)=>s+f.netoB2B*f.q,0);
  const mcT=mezcla.reduce((s,f)=>s+f.mc*f.q,0);
  const ubT=mezcla.reduce((s,f)=>s+f.ubB2B*f.q,0);
  const mins=mezcla.reduce((s,f)=>s+f.minU*f.q,0);
  const capPrac=D.capacidad.reduce((s,c)=>s+c.min_practica,0);
  const demAct=vivos.reduce((s,p)=>s+minU(p)*p.u,0)/12;
  const holgura=capPrac-demAct;
  // si no cabe, cuanta venta de tienda desplaza
  const desplaza=Math.max(0,mins-holgura);
  const mcTiendaMin=mezcla.reduce((s,f)=>s+f.mcTienda*f.q,0)/(mins||1);   // S/ de MC tienda por minuto
  const mcPerdido=desplaza*mcTiendaMin;
  return {filas,mezcla,vta,mcT,ubT,mins,capPrac,demAct,holgura,desplaza,mcPerdido,
    neto:mcT-mcPerdido, fin, d};
}

function vClientes(){

  const fin=c=>R.venta*c.peso*(TASA/100)*c.dias_credito/30;

    // cada cliente compra con su propio descuento; el canal guarda el promedio

     <td style="font-size:12.5px;color:var(--ink7)">${esc(c.tipo)}<div style="font-size:11px;color:var(--ink5)">${esc(c.contacto)}</div></td>

     <td class="n"><span class="bd ${c.descuento_pct>=15?'ba':c.descuento_pct>=13?'wa':'ok'}">−${P(c.descuento_pct,0)}</span></td>

     <td class="n">−${P(C.reduce((s,x)=>s+x.peso*x.descuento_pct,0),1)}</td>
     <td class="n">${S0(R.venta)}</td>
     <td class="n">${N(C.reduce((s,c)=>s+c.peso*c.dias_credito,0),0)} d</td>
     <td class="n">−${S0(C.reduce((s,c)=>s+fin(c),0))}</td>

  box.style.display="";
}

   ${B2.dias} días de crédito. <b>Descuento de indiferencia</b> es el punto donde la unidad B2B deja lo mismo que
   la unidad de tienda que desplaza: pasado ese número, con planta llena estás cambiando plata por volumen.
   ${(()=>{const peor=K.filas.slice().sort((a,b)=>a.dMax-b.dMax)[0], mejor=K.filas.slice().sort((a,b)=>b.dMax-a.dMax)[0];

      <b>${esc(mejor.nombre)}</b> con ${P(mejor.dMax,0)}. Una lista B2B con un solo descuento parejo deja plata

  <div class="note warn" style="margin:13px 0 0"><b>Lo que no está en el número.</b>
   ${B2.dias} días de crédito son ${S0(K.vta*K.fin)} al mes de costo financiero al ${N(TASA,1)}% mensual,
   pero el riesgo real es el que no paga: un cliente B2B que quiebra se lleva ${N(B2.dias)} días de producción.
   Y el canal trae su propio trabajo administrativo — facturación, cobranza, reparto — que acá no está costeado.</div>`;

  $$("#cardB2B input[data-b2]").forEach(el=>el.oninput=e=>{B2[e.target.dataset.b2]=+e.target.value;vB2B();});
  $("#b2Prod").onchange=e=>{B2.prod=e.target.value;vB2B();};
  $("#b2Flete").onchange=e=>{B2.flete=Math.max(0,+e.target.value||0);vB2B();};
  $("#bB20").onclick=()=>{B2={desc:25,und:1500,prod:"mix",dias:30,flete:0.35,minLote:4,mcObj:30};vB2B();};
  $$("#cardB2B .clic").forEach(t=>t.onclick=()=>abrir(t.dataset.p));
}

/* ---------------- PRONÓSTICO ---------------- */
let PR={crec:10, precio:0, insumos:0, rappi:0, base:'mes'};
const DIAS=[["lunes","Lun"],["martes","Mar"],["miercoles","Mié"],["jueves","Jue"],["viernes","Vie"],["sabado","Sáb"],["domingo","Dom"]];
function vPron(){
  const ps=TODOS(), MZ=D.matriz_mo[ST.anio]||{}, cap=D.capacidad;
  const g=1+PR.crec/100, fp=1+PR.precio/100, fi=1+PR.insumos/100;
  const mesSel=+ST.mes;
  const estac=(D["perfil_mes_"+ST.anio]&&D["perfil_mes_"+ST.anio][String(mesSel)])||(100/12);
  const prev=ST.anio==="2026"?"2025":"2026";
  // de dónde sale el punto de partida
  function baseUnid(pid){
    switch(PR.base){
      case "mes":      return und(pid,ST.anio,String(mesSel));
      case "promedio": return und(pid,ST.anio)/12;
      case "trim":     { let s=0,n=0; for(let k=0;k<3;k++){const m=mesSel-k; if(m>=1){s+=und(pid,ST.anio,String(m));n++;} }
                         return n?s/n:0; }
      case "anterior": return und(pid,prev,String(mesSel));
      default:         return und(pid,ST.anio,String(mesSel));
    }
  }
  const BASES={mes:`${MES[mesSel]} de ${ST.anio}`, promedio:`promedio mensual de ${ST.anio}`,
    trim:`promedio de los últimos 3 meses hasta ${MES[mesSel]}`, anterior:`${MES[mesSel]} de ${prev}`};

  let V=0,MP=0,MO=0,CI=0,MIN=0,U=0;
  const porProd=[];
  ps.forEach(p=>{
    const u=baseUnid(p.id);
    const uP=u*g;
    const minU=Object.values(MZ[p.id]||{}).reduce((s,x)=>s+x.min,0)/und(p.id,ST.anio)||0;
    U+=uP; V+=p.neto*fp*uP; MP+=p.mp*fi*uP; MO+=p.mod*uP; CI+=p.cif*uP; MIN+=minU*uP;
    if(uP>0.5) porProd.push({...p, u:uP, minU, lote:p.unidades_lote});
  });
  const SEM=4.345, dSem=V/SEM, uSem=U/SEM, minSem=MIN/SEM;
  const capPrac=cap.reduce((s,c)=>s+c.min_practica,0), capSem=capPrac/SEM;
  const util=100*MIN/capPrac;

  // comisiones y costo financiero proyectados
  const EC={}; D.canales.forEach(c=>EC[c.id]=econCanal(c,ST.anio));
  const Vanio=D.canales.reduce((s,c)=>s+EC[c.id].venta,0);
  const factorMes=V/(Vanio/12||1);
  const com=D.canales.reduce((s,c)=>s+EC[c.id].com,0)/12*factorMes*g;
  const pos=D.canales.reduce((s,c)=>s+EC[c.id].pos,0)/12*factorMes*g;
  const fin=D.canales.reduce((s,c)=>s+EC[c.id].fin,0)/12*factorMes*g;
  const G=D.gastos.filter(x=>x.id!=='go_comisiones_delivery').reduce((s,x)=>s+x.monto_mensual,0);
  const UB=V-MP-MO-CI, UO=UB-G-com-pos-fin;

  const sl=(k,lb,min,max,suf)=>`<div class="fg"><label>${lb}: <span style="font-family:var(--fm);color:var(--c600)">${PR[k]>0?"+":""}${PR[k]}${suf}</span></label>

  $("#p-pron").innerHTML=`
  <div class="note">Elige de dónde partir y qué supuestos aplicar. De ahí sale cuánto producir <b>cada día y cada semana</b>,
   si la cocina da abasto y qué queda después de comisiones y del costo de esperar la plata.</div>
  ${(()=>{const otras=Object.keys(BASES).filter(k=>k!==PR.base);
    const val=k=>{let t=0; ps.forEach(p=>{const u=(k==="mes"?und(p.id,ST.anio,String(mesSel)):
      k==="promedio"?und(p.id,ST.anio)/12:
      k==="trim"?(()=>{let s=0,n=0;for(let j=0;j<3;j++){const m=mesSel-j;if(m>=1){s+=und(p.id,ST.anio,String(m));n++;}}return n?s/n:0;})():
      und(p.id,prev,String(mesSel))); t+=p.neto*u;}); return t;};
    const actual=val(PR.base);
    return `<div class="note"><b>Comparación de bases.</b> Con <b>${esc(BASES[PR.base])}</b> partes de ${S0(actual)}.
      ${otras.map(k=>`Con ${esc(BASES[k])}: ${S0(val(k))} (${val(k)>actual?"+":""}${P(100*(val(k)/actual-1),1)})`).join(" · ")}.
      Elegir la base cambia el pronóstico antes de mover un solo supuesto.</div>`})()}

  ${util>100?`<div class="note bad"><b>No alcanza la gente.</b> Faltan ${N(MIN-capPrac)} minutos al mes

   :util>95?`<div class="note warn"><b>Al límite.</b> Quedan ${N(capPrac-MIN)} minutos de holgura al mes.
    Sin margen para un feriado ni un pedido grande de última hora.</div>`
   :`<div class="note"><b>Cabe.</b> Quedan ${N(capPrac-MIN)} minutos libres (${N((capPrac-MIN)/60)} horas), ${P(100-util,0)} de holgura.</div>`}

  <div class="card"><div class="ch"><div><h2 class="ct">Qué se vende cada día</h2>
    <p class="cs">La semana no es pareja: viernes y sábado son pan de Shabat y concentran la mayor parte.</p></div>
    <span class="bd wa">reparto estimado</span></div>
   <div class="tw"><table><thead><tr><th>Día</th><th class="n">% semana</th><th class="n">Unidades</th>
     <th class="n">Venta</th><th class="n">Materia prima</th><th class="n">Min. de persona</th><th style="width:130px">Carga del día</th></tr></thead>
    <tbody>${DIAS.map(([k,nm])=>{const f=(D.perfil_dia||{})[k]||0;
      const capDia=capSem/6;  // se produce 6 días
      const minDia=minSem*f, uso=capDia?100*minDia/capDia:0;
      return `<tr${k==='viernes'||k==='sabado'?' style="background:var(--g50)"':''}>

   <div class="note" style="margin:12px 0 0">El viernes concentra ${P(((D.perfil_dia||{}).viernes||0)*100,0)} de la venta de la semana.
    Pero esa es la VENTA, no la producción: el pan del viernes se hornea antes. La tabla de abajo simula la semana real,
    adelantando lo que aguanta fresco.</div></div>

  ${(()=>{
    /* Produccion por dia, con adelanto. La venta de un dia no es la produccion de
       ese dia: lo que se vende el viernes se hornea el jueves o el viernes de
       madrugada. Se adelanta hasta dos dias, que es lo que aguanta fresco, y
       nunca mas: el pan de Shabat no se hornea el martes. */
    const ADEL=2, capDia=capSem/6;
    const sim=DIAS.map(([k,nm])=>({k,nm,vende:(D.perfil_dia||{})[k]||0}));
    let banco=0;
    sim.forEach(d=>{
      d.necesita=minSem*d.vende;
      d.capacidad=(d.k==="domingo")?0:capDia;
      const hace=Math.min(d.necesita, d.capacidad+banco);
      d.produce=hace;
      d.falta=d.necesita-hace;
      d.adelantado=Math.max(0,hace-Math.min(d.necesita,d.capacidad));
      banco=Math.max(0, Math.min(d.capacidad*ADEL, banco+d.capacidad-hace));
      d.libre=banco;
      d.uso=d.capacidad?100*hace/d.capacidad:0;
    });
    const falta=sim.reduce((s,d)=>s+d.falta,0);
    return `<div class="card"><div class="ch"><div><h2 class="ct">Cuánto producir cada día</h2>

        <td class="n">${N(d.necesita)}</td>
        <td class="n" style="color:var(--ink5)">${d.capacidad?N(d.capacidad):"cerrado"}</td>
        <td class="n" style="font-weight:600">${N(d.produce)}</td>
        <td class="n" style="color:var(--ink5)">${d.adelantado>1?N(d.adelantado):"—"}</td>
        <td class="n" style="font-weight:700;color:${d.falta>1?'var(--ba)':'var(--ink5)'}">${d.falta>1?N(d.falta):"—"}</td>
        <td class="n" style="color:var(--ink5)">${N(d.libre)}</td>
        <td class="n"><span class="bd ${d.uso>=100?'ba':d.uso>=90?'aw':'ok'}">${P(d.uso,0)}</span></td></tr>`).join("")}</tbody>
      <tfoot><tr><td>SEMANA</td><td class="n">${N(minSem)}</td><td class="n">${N(capSem)}</td>
       <td class="n">${N(sim.reduce((s,d)=>s+d.produce,0))}</td><td class="n"></td>
       <td class="n">${falta>1?N(falta):"—"}</td><td class="n"></td>
       <td class="n">${P(capSem?100*minSem/capSem:0,0)}</td></tr></tfoot></table></div>
     <div class="note ${falta>1?'ba':''}" style="margin:12px 0 0">${falta>1
       ? "<b>La semana no cabe.</b> Quedan "+N(falta)+" minutos sin hacer aunque se adelante todo lo que la frescura permite. Hay que sumar gente el día que falta o mover volumen a otro día."
       : "<b>La semana cabe.</b> El viernes pide "+P(100*(sim[4]||{}).uso,0)+" de su capacidad, y se sostiene porque lunes y martes dejan "+N((sim[1]||{}).libre||0)+" minutos de colchón que se adelantan. Sin ese adelanto, el viernes solo no entraría."}</div>
    </div>`;})()}

  <div class="card"><div class="ch"><div><h2 class="ct">Cuánto producir por semana</h2>
    <p class="cs">Unidades y lotes que hay que programar para cubrir la proyección.</p></div></div>
   <div class="tw"><table><thead><tr><th>Producto</th><th class="n">Unid./semana</th><th class="n">Unid./viernes</th>

/* ---------------- PLAN DE PRODUCCION ----------------
   Del pronostico sale cuanto se VENDE. Lo que hay que PRODUCIR es otra cosa:
     produccion = demanda del dia + lo que se quiere dejar en vitrina - lo que ya hay
   y redondeado hacia arriba al tamano del lote, porque no se hornea media tanda.
   El domingo no se produce: lo que se venda ese dia sale del horno del sabado. */
let PL={cob:30, dia:"viernes", prodDom:false};
const ORD=["lunes","martes","miercoles","jueves","viernes","sabado","domingo"];
const NOMD={lunes:"Lunes",martes:"Martes",miercoles:"Miércoles",jueves:"Jueves",viernes:"Viernes",sabado:"Sábado",domingo:"Domingo"};

function basePron(pid){
  const mesSel=+ST.mes, prev=ST.anio==="2026"?"2025":"2026";
  switch(PR.base){
    case "promedio": return und(pid,ST.anio)/12;
    case "trim":{let s=0,n=0;for(let k=0;k<3;k++){const m=mesSel-k;if(m>=1){s+=und(pid,ST.anio,String(m));n++;}}return n?s/n:0;}
    case "anterior": return und(pid,prev,String(mesSel));
    default: return und(pid,ST.anio,String(mesSel));
  }
}
function calcPlan(){
  const SEM=4.345, g=1+PR.crec/100, per=D.perfil_dia||{}, MZ=D.matriz_mo[ST.anio]||{};
  const prodDias=PL.prodDom?ORD:ORD.filter(d=>d!=="domingo");
  const items=D.productos.filter(p=>!p.es_reventa && (p.pasos||[]).length).map(p=>{
    const uMes=basePron(p.id)*g, uSem=uMes/SEM;
    const minU=Object.values(MZ[p.id]||{}).reduce((s,x)=>s+x.min,0)/(und(p.id,ST.anio)||1);
    const dias={}; let stock=ST.stock[p.id]||0; let prodTot=0, sobra=0, falt=0;
    ORD.forEach((d,i)=>{
      const dem=uSem*(per[d]||0);
      const sig=ORD[(i+1)%7], demSig=uSem*(per[sig]||0);
      // si manana no se produce, hoy hay que dejar tambien su demanda
      const puente=prodDias.indexOf(sig)<0?demSig:0;
      const obj=demSig*(PL.cob/100)+puente;
      const apertura=stock;
      let prod=0, lotes=0;
      if(prodDias.indexOf(d)>=0){
        const neto=dem+obj-apertura;
        if(neto>0){ const L=p.unidades_lote||1; lotes=Math.ceil(neto/L); prod=lotes*L; }
      }
      const cubierto=Math.min(dem,apertura+prod);
      if(cubierto<dem-0.5) falt+=dem-cubierto;
      stock=apertura+prod-cubierto;
      prodTot+=prod;
      dias[d]={dem,apertura,prod,lotes,cierre:stock,obj,min:minU*prod};
    });
    sobra=stock;
    return {...calc(p), uSem, minU, dias, prodTot, sobra, falt, lote:p.unidades_lote||1};
  }).filter(x=>x.uSem>0.5);
  // reventa: no se produce, se repone
  const rev=D.productos.filter(p=>p.es_reventa||!(p.pasos||[]).length).map(p=>{
    const uSem=basePron(p.id)*g/SEM; return {...calc(p), uSem, stock:ST.stock[p.id]||0};
  }).filter(x=>x.uSem>0.5);
  const porDia={}; ORD.forEach(d=>{
    porDia[d]={dem:0,prod:0,lotes:0,min:0,cierre:0,
      prodHoy:prodDias.indexOf(d)>=0};
    items.forEach(it=>{const x=it.dias[d];
      porDia[d].dem+=x.dem; porDia[d].prod+=x.prod; porDia[d].lotes+=x.lotes;
      porDia[d].min+=x.min; porDia[d].cierre+=x.cierre;});
  });
  const capPrac=D.capacidad.reduce((s,c)=>s+c.min_practica,0);
  const capDia=capPrac/SEM/prodDias.length;
  return {items,rev,porDia,prodDias,capDia,capSem:capPrac/SEM,SEM};
}

/* ---------- PUNTO DE EQUILIBRIO ----------
   Variable = lo que solo existe si vendes una unidad más: insumos, comisiones, empaque.
   Fijo = lo que pagas igual aunque no vendas nada: planilla, alquiler, CIF, estructura. */
function calcEquilibrio(){
  const REGpct=(D.regalias||{}).pct||0;   // la regalia es variable: se paga sobre cada sol vendido
  // todo en un mes promedio: la venta tambien, si no el margen de seguridad sale absurdo
  const ps=TODOS().map(p=>({...p,u:und(p.id,ST.anio)/12}));
  const V=ps.reduce((s,p)=>s+vta(p,ST.anio)/12,0), U=ps.reduce((s,p)=>s+p.u,0);
  const MP=ps.reduce((s,p)=>s+p.mp*p.u,0);
  let com=0,pos=0,empq=0;
  D.canales.forEach(c=>{const e=econCanal(c,ST.anio); com+=e.com/12; pos+=e.pos/12; empq+=(e.emp||0)/12;});
  const VAR=MP+com+pos+empq+V*REGpct/100;   // la regalia es variable
  // Fijo: solo la planilla DIRECTA de produccion. La de mostrador y administracion
  // ya viene dentro de los gastos de estructura, y contarla dos veces inflaba el equilibrio.
  const puestos=D.planilla?.puestos||[];
  const plProd=puestos.filter(x=>x.es_directo).reduce((s,x)=>s+(x.costo_cargado_mes||0),0);
  const plIndir=puestos.filter(x=>!x.es_directo).reduce((s,x)=>s+(x.costo_cargado_mes||0),0);
  const modAbsorbida=ps.reduce((s,p)=>s+p.mod*p.u,0);
  const ociosa=Math.max(0,plProd-modAbsorbida);
  const cif=D.cif.reduce((s,x)=>s+x.monto_mensual,0);
  const gastos=D.gastos.filter(x=>x.id!=='go_comisiones_delivery').reduce((s,x)=>s+x.monto_mensual,0);
  const FIJO=plProd+cif+gastos;
  const mcTot=V-VAR, ratio=V?mcTot/V:0, mcUnit=U?mcTot/U:0;
  const peSoles=ratio>0?FIJO/ratio:0, peUnid=mcUnit>0?FIJO/mcUnit:0;
  const util=mcTot-FIJO;
  const seguridad=V>0?100*(V-peSoles)/V:0;
  const diaria=V/30, diaPE=diaria>0?peSoles/diaria:0;
  return {V,U,MP,com,pos,empq,VAR,plProd,plIndir,modAbsorbida,ociosa,cif,gastos,FIJO,
          mcTot,ratio,mcUnit,peSoles,peUnid,util,seguridad,diaPE,diaria};
}

/* ---------------- ALERTAS ---------------- */
let UMB={ub_min:42, fc_max:35, util_max:95, canal_min:25, mo_max:15, insumo_max:20};
function calcAlertas(){
  const A=[], ps=TODOS().map(p=>({...p,u:und(p.id,ST.anio)}));
  const MZ=D.matriz_mo[ST.anio]||{}, cap=D.capacidad;
  const V=ps.reduce((s,p)=>s+vta(p,ST.anio),0);
  const add=(sev,tipo,titulo,detalle,accion,ir,est)=>A.push({sev,tipo,titulo,detalle,accion,ir,est});

  // 1. margen por debajo del objetivo
  ps.filter(p=>p.u>0).forEach(p=>{
    if(p.ub_pct<0) add("alta","margen",`${p.nombre} pierde plata`,
      `Su utilidad bruta es ${P(p.ub_pct,1)}: el costo total (${S(p.cuf)}) supera al precio neto (${S(p.neto)}).`,
      `Subir precio a ${S(p.cuf/(1-UMB.ub_min/100))} o sacarlo de la carta.`, "prod");
    else if(p.ub_pct<UMB.ub_min) add("media","margen",`${p.nombre} bajo el objetivo`,
      `Utilidad bruta de ${P(p.ub_pct,1)}, contra el objetivo de ${P(UMB.ub_min,0)}. Deja ${S(p.ub)} por unidad.`,
      `Para llegar al objetivo: precio de ${S(p.cuf/(1-UMB.ub_min/100))} (+${P(100*(p.cuf/(1-UMB.ub_min/100)/p.neto-1),1)}).`, "prod");
  });

  // 2. food cost alto
  ps.filter(p=>p.u>0 && !p.es_reventa && p.fc_pct>UMB.fc_max).forEach(p=>
    add("media","costo",`${p.nombre} con food cost alto`,
      `${P(p.fc_pct,1)} de materia prima sobre el precio neto, contra el techo de ${P(UMB.fc_max,0)}.`,
      `Revisar gramajes o negociar el insumo que más pesa en su receta.`, "prod"));

  // 3. mano de obra desproporcionada
  const totMin=ps.reduce((s,p)=>s+Object.values(MZ[p.id]||{}).reduce((a,x)=>a+x.min,0),0);
  ps.filter(p=>p.u>0).forEach(p=>{
    const m=Object.values(MZ[p.id]||{}).reduce((a,x)=>a+x.min,0);
    const pctMin=totMin?100*m/totMin:0, pctVta=V?100*vta(p,ST.anio)/V:0;
    if(pctMin>UMB.mo_max && pctMin>pctVta*1.4) add("media","trabajo",
      `${p.nombre} consume más trabajo del que aporta`,
      `Se lleva ${P(pctMin,1)} de la mano de obra y aporta ${P(pctVta,1)} de la venta. Son ${N(p.min_hombre,2)} minutos por unidad.`,
      `Revisar el paso más largo de su proceso, o subir el precio para que el tiempo se pague.`, "mo");
  });

  // 4. estaciones saturadas
  cap.forEach(c=>{
    const dem=ps.reduce((s,p)=>s+((MZ[p.id]||{})[c.id]?.min||0),0)/12;
    const u=c.min_practica?100*dem/c.min_practica:0;
    if(u>100) add("alta","capacidad",`${c.nombre} sin capacidad`,
      `Pide ${N(dem)} minutos al mes y solo hay ${N(c.min_practica)}. Faltan ${N(dem-c.min_practica)}.`,
      `Contratar, redistribuir carga o bajar volumen de los productos más pesados de esa estación.`, "mo", c.id);
    else if(u>UMB.util_max) add("media","capacidad",`${c.nombre} al límite`,
      `Utilización de ${P(u,1)}, sobre el umbral de ${P(UMB.util_max,0)}. Holgura: ${N(c.min_practica-dem)} minutos.`,
      `Sin margen para un feriado o una máquina parada. Vigilar antes de aceptar pedidos grandes.`, "mo", c.id);
  });

  /* 5. El pico de la semana.
     Antes esta regla comparaba la VENTA de un dia contra la capacidad de ese dia,
     repartida en partes iguales. Como el viernes concentra el 34% de la venta y un
     dia es el 17% de la semana, la cuenta daba 2.04 y la alerta saltaba siempre,
     en las seis estaciones. Era ruido, y ademas comparaba cosas distintas: el pan
     del viernes no se hornea el viernes.
     Ahora se simula la semana: cada dia se produce lo que se puede, se adelanta lo
     que cabe —hasta dos dias, que es lo que aguanta fresco— y se mira si al final
     de algun dia quedo trabajo sin hacer. Solo entonces hay alerta. */
  const PERD=D.perfil_dia||{};
  const DIASEM=[["lunes","lunes"],["martes","martes"],["miercoles","miércoles"],
                ["jueves","jueves"],["viernes","viernes"],["sabado","sábado"],["domingo","domingo"]];
  const ADELANTO=2;
  cap.forEach(c=>{
    const demSem=ps.reduce((s,p)=>s+((MZ[p.id]||{})[c.id]?.min||0),0)/52;
    if(!demSem||!c.min_practica) return;
    const capDia=c.min_practica/4.345/6;            // domingo no se produce
    let banco=0, peor=null;
    DIASEM.forEach(([k,nom],i)=>{
      const necesita=demSem*(PERD[k]||0);
      const disponible=(k==="domingo")?0:capDia;
      // lo que se puede adelantar: la capacidad libre de hasta ADELANTO dias antes
      const hoy=Math.min(necesita,disponible+banco);
      const falta=necesita-hoy;
      banco=Math.max(0,Math.min(disponible*ADELANTO, banco+disponible-Math.min(necesita,disponible+banco)));
      if(falta>1 && (!peor||falta>peor.falta)) peor={dia:nom,falta,necesita,disponible};
    });
    if(peor) add("alta","capacidad",`El ${peor.dia} no alcanza en ${c.nombre}`,
      `Ese día pide ${N(peor.necesita)} minutos, la capacidad del día es ${N(peor.disponible)} y, aun adelantando lo de ${ADELANTO} días antes, quedan ${N(peor.falta)} sin hacer.`,
      `Sumar gente ese día, o adelantar lo que aguante frío. Lo de Shabat no se adelanta.`, "plan", c.id);
  });

  // 6. canales
  D.canales.forEach(c=>{
    const e=econCanal(c,ST.anio);
    if(e.venta>0 && e.mc_pct<UMB.canal_min) add("media","canal",`${c.nombre} deja poco margen`,
      `Margen del canal: ${P(e.mc_pct,1)}. Comisión ${S0(e.com)}, POS ${S0(e.pos)}, costo financiero ${S0(e.fin)} por ${CAN[c.id].dias} días de cobro.`,
      `Subir precio del canal o renegociar la comisión. Vender más por acá baja la utilidad total.`, "can");
    if(CAN[c.id].dias>=20) add("baja","canal",`${c.nombre} tarda en pagar`,
      `${CAN[c.id].dias} días de cobro inmovilizan ${S0(e.fin)} al año en costo financiero.`,
      `Negociar liquidación más frecuente.`, "can");
  });

  // 7. concentración de insumos
  /* Se agrupa por id, no por nombre: dos insumos distintos con el mismo nombre
     colapsaban en uno. Y se usa consumoInsumos, que explota los rellenos en sus
     insumos, para no contar la fila del relleno Y sus hijos. */
  const gasto={}, nombres={};
  try{ Object.values(consumoInsumos(ST.anio)).forEach(x=>{
        if(!x.id) return; gasto[x.id]=(gasto[x.id]||0)+x.costo; nombres[x.id]=x.nombre; }); }
  catch(e){ ps.forEach(p=>p.receta.forEach(r=>{ const k=r.insumo_id||r.nombre;
        gasto[k]=(gasto[k]||0)+r.costo_por_unidad*p.u; nombres[k]=r.nombre; })); }
  const TG=Object.values(gasto).reduce((a,b)=>a+b,0);
  Object.entries(gasto).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(([id,g])=>{
    const n=nombres[id]||id;
    if(100*g/TG>UMB.insumo_max) add("baja","insumo",`${n} concentra el gasto`,
      `Es ${P(100*g/TG,1)} de toda la materia prima: ${S0(g)} al año.`,
      `Un alza de 10% en ese insumo cuesta ${S0(g*0.1)}. Conviene tener un segundo proveedor.`, "ins");
  });

  // 8. concentración de ventas
  const orden=[...ps].sort((a,b)=>b.neto*b.u-a.neto*a.u);
  if(orden.length && V){
    const top=100*orden[0].neto*orden[0].u/V;
    if(top>30) add("baja","venta",`La venta depende de ${orden[0].nombre}`,
      `Un solo producto es ${P(top,1)} de la facturación.`,
      `Si ese producto falla una semana, el impacto es directo. Vale desarrollar el segundo.`, "ventas");
  }
  const sev={alta:0,media:1,baja:2};
  return A.sort((a,b)=>sev[a.sev]-sev[b.sev]);
}
function vAlertas(){
  const A=calcAlertas();
  const n=s=>A.filter(x=>x.sev===s).length;
  const ICO={margen:"📉",costo:"🧾",trabajo:"⏱",capacidad:"🏭",canal:"🛵",insumo:"📦",venta:"🎯"};
  const COL={alta:"ba",media:"wa",baja:"nt"};
  const TXT={alta:"Crítica",media:"Atención",baja:"Para mirar"};
  const sl=(k,lb,min,max,suf)=>`<div class="fg"><label>${lb}: <span style="font-family:var(--fm);color:var(--c600)">${UMB[k]}${suf}</span></label>
    <input class="sl" type="range" min="${min}" max="${max}" value="${UMB[k]}" data-u="${k}"/></div>`;
  $("#p-ale").innerHTML=`
  <div class="note">La app revisa sola los números y avisa. Los umbrales los pones tú: lo que para una panadería es grave,

  const MO=ps.reduce((s,p)=>s+p.mod*p.u,0), CI=ps.reduce((s,p)=>s+p.cif*p.u,0);
  const G=D.gastos.reduce((s,g)=>s+g.monto_mensual,0)+costosCanal(ST.anio).total/12;
  return {venta:V, mp:MP, ub:V-MP-MO-CI, ub_pct:V?100*(V-MP-MO-CI)/V:0,

/* B2: render() llamaba las 16 vistas en cadena. Si una lanzaba, las siguientes

   catch mudo escondia el error (asi vivio A6). Ahora cada vista falla sola y lo
   dice en su propio panel. */
function seguro(fn,pane,nombre){
  try{ fn(); }
  catch(e){
    console.error("["+nombre+"]",e);
    const el=document.querySelector(pane);
    if(el) el.insertAdjacentHTML("afterbegin",
      `<div class="note ba"><b>Esta vista falló y muestra datos viejos.</b> ${esc(e.message||String(e))}</div>`);
  }
}

async function login(){
  const email=$("#gEmail").value.trim(), pass=$("#gPass").value;
  if(!email||!pass) return vLogin("Escribe tu correo y tu contraseña.");
  $("#gEntrar").disabled=true; $("#gEntrar").textContent="Entrando...";
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error) return vLogin(error.message.includes("Invalid")?"Correo o contraseña incorrectos.":error.message);
  arrancarSesion();
}
async function registrar(){
  const nom=$("#rNom").value.trim(), email=$("#rEmail").value.trim(), pass=$("#rPass").value;
  if(!email||pass.length<6) return vRegistro("Pon un correo válido y una contraseña de al menos 6 caracteres.");
  $("#rCrear").disabled=true; $("#rCrear").textContent="Creando...";
  const {error}=await sb.auth.signUp({email,password:pass,options:{data:{nombre:nom}}});
  if(error) return vRegistro(error.message);
  vRegistro(null,"Cuenta creada. Ahora inicia sesión; vas a quedar en espera de aprobación.");
  setTimeout(()=>vLogin(),2200);
}
async function salir(){ await sb.auth.signOut(); PERFIL=null; SESION=null; vLogin(); }

async function arrancarSesion(){
  const limite=(p,ms,q)=>Promise.race([p,new Promise((_,x)=>setTimeout(()=>x(new Error("La base no respondió ("+q+")")),ms))]);
  try{
    const {data:{session}}=await limite(sb.auth.getSession(),12000,"sesión");
    SESION=session;
    if(!session) return vLogin();
    const {data,error}=await limite(
      sb.from("perfiles").select("*").eq("id",session.user.id).maybeSingle(),12000,"perfil");
    if(error) return vLogin("No se pudo leer tu perfil: "+error.message);
    PERFIL=data;
    if(!PERFIL) return vPendiente();
    if(PERFIL.estado==="bloqueado") return vBloqueado();
    if(PERFIL.estado!=="aprobado") return vPendiente();
    entrar(); pintarSesion();
    /* El modelo se carga ANTES del primer render: si no, se pinta la semilla y
       despues salta a otros numeros delante del usuario. */
    try{ MODELO=await limite(cargarModelo(),12000,"modelo"); }
    catch(e){ MODELO={origen:"semilla", version:0, error:(e&&e.message)||String(e)}; }
    window.MODELO=MODELO;
    try{ await limite(cargarEscenarios(),12000,"escenarios"); }catch(e){ ST.esc=[]; }
    render();
  }catch(e){
    vLogin((e&&e.message)||"No se pudo conectar. Revisa tu internet y vuelve a intentar.");
  }
}

function pintarSesion(){
  const r=VISTA.activa
    ? ({lectura:"Lectura",edicion:"Edición",admin:"Administrador"}[VISTA.rol]||VISTA.rol)+" · prueba"
    : ({lectura:"Lectura",edicion:"Edición",admin:"Administrador"}[PERFIL.rol]||PERFIL.rol);
  $("#usrBox").innerHTML=`<div class="usr">
    <div class="uav">${esc((PERFIL.nombre||PERFIL.email)[0].toUpperCase())}</div>
    <div class="uinfo"><b>${esc(PERFIL.nombre||PERFIL.email)}</b><span>${r}</span></div>
    <button class="hbtn" id="bMapa" title="Dónde está cada cosa">Mapa</button>
    ${esAdminReal()?(VISTA.activa
      ?'<button class="hbtn ac" id="bFinVista">Volver a mi perfil</button>'
      :'<button class="hbtn ac" id="bVerComo">Ver como…</button>'):""}
    <button class="hbtn" id="bSalir">Salir</button></div>`;
  $("#bSalir").onclick=salir;
  if($("#bMapa")) $("#bMapa").onclick=()=>abrirMapa();
  if($("#bVerComo")) $("#bVerComo").onclick=()=>abrirPrueba();
  if($("#bFinVista")) $("#bFinVista").onclick=salirVista;
  if(!puedeEditar()) document.body.classList.add("solo-lectura");
  else document.body.classList.remove("solo-lectura");
  aplicarPermisos();
}

async function cargarEscenarios(){
  const {data,error}=await sb.from("escenarios").select("*").order("creado_en",{ascending:false});

  ST.esc=(data||[]).map(e=>({id:e.id,nombre:e.nombre,fecha:new Date(e.creado_en).toLocaleString("es-PE",{dateStyle:"short",timeStyle:"short"}),
    aj:e.ajustes,igv:e.igv,r:e.resultados}));

async function guardar(){
  if(!puedeEditar()) return alert("Tu perfil es de solo lectura: no puedes guardar escenarios.");
  const n=($("#nom")?.value||"").trim()||("Escenario "+(ST.esc.length+1));
  const paq={productos:ST.aj, insumos:ST.insumos, estaciones:ST.estaciones};

async function borrarEscenario(id){

}

        <b>${esc(v.n)}</b><span>${v.v.length} pestañas</span>
        <em>${esc(v.d)}</em>
        <div class="paqt">${v.v.map(x=>esc((PESTANAS.find(p=>p.k===x)||{}).n||x)).join(" · ")}</div></button>`).join("")}
       <button class="paq ${pa==="medida"?"on":""}" data-paq="medida">
