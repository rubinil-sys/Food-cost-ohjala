/* ---------------- VERSIONES DE RECETA ----------------
   La tabla receta_version es append-only por diseño: tiene politica de select y de
   insert, y ninguna de update ni de delete. Una version grabada no se puede alterar
   ni borrar desde la aplicacion, ni por un admin. Eso es lo que la vuelve servible
   como rastro: si alguien cambia un gramaje, la version anterior sigue ahi.
   El numero de version lo pone un trigger en la base, no el navegador. */
async function grabarVersionReceta(pid, nota){
  const p=D.productos.find(x=>x.id===pid); if(!p) throw new Error("producto desconocido");
  const u=(await sb.auth.getUser()).data.user;
  if(!u) throw new Error("hay que iniciar sesion");
  const datos={receta:p.receta, pasos:p.pasos, niveles:p.niveles,
    min_niveles:p.min_niveles, mo_niveles:p.mo_niveles,
    unidades_lote:p.unidades_lote, min_setup_lote:p.min_setup_lote,
    semielaborado:(D.semielaborados||[]).find(s=>s.id===((p.niveles||{}).semielaborado||{}).id)||null,
    rellenos:((p.niveles||{}).rellenos||[]).map(rl=>(D.rellenos||[]).find(q=>q.id===rl.id)||null)};
  const resumen={mp:p.mp, mod:p.mod, cif:p.cif, cuf:p.cuf, precio:p.precio, neto:p.neto,
    min_hombre:p.min_hombre, pasos:(p.pasos||[]).length, insumos:(p.receta||[]).length};
  const {data,error}=await sb.from("receta_version").insert({
    producto_id:pid, producto_nombre:p.nombre, version:0,
    datos, resumen, nota:(nota||"").slice(0,400), autor:u.id, autor_email:u.email
  }).select().single();
  if(error) throw error;
  return data;
}
async function listarVersionesReceta(pid){
  const {data,error}=await sb.from("receta_version")
    .select("id,version,nota,autor_email,creado_en,resumen")
    .eq("producto_id",pid).order("version",{ascending:false});
  if(error) throw error;
  return data||[];
}
async function leerVersionReceta(id){
  const {data,error}=await sb.from("receta_version").select("*").eq("id",id).single();
  if(error) throw error; return data;
}
window.grabarVersionReceta=grabarVersionReceta;
window.listarVersionesReceta=listarVersionesReceta;
window.leerVersionReceta=leerVersionReceta;

/* ---------------- CONTEOS DE INVENTARIO COMPARTIDOS ----------------
   Antes el conteo vivia solo en el localStorage del navegador: aguantaba una
   recarga, pero no salia de ese equipo. Esto lo manda a la base, con autor y
   hora, para que el conteo de la tableta de la panaderia se vea en la laptop.
   La tabla es append-only: un conteo es un hecho de un momento y no se edita.
   El localStorage se queda como borrador de trabajo mientras se cuenta. */
async function guardarConteo(payload){
  const u=(await sb.auth.getUser()).data.user;
  if(!u) throw new Error("hay que iniciar sesion para compartir el conteo");
  const {data,error}=await sb.from("inventario_conteo").insert({
    tipo:payload.tipo, fecha:payload.fecha, turno:payload.turno||null, dia:payload.dia||null,
    responsable:(payload.responsable||"").slice(0,120),
    lineas:payload.lineas||{}, n_lineas:payload.n||0,
    valor:payload.valor!=null?payload.valor:null,
    unidades:payload.unidades!=null?payload.unidades:null,
    nota:(payload.nota||"").slice(0,400),
    autor:u.id, autor_email:u.email
  }).select().single();
  if(error) throw error;
  return data;
}
async function listarConteos(tipo, limite){
  const {data,error}=await sb.from("inventario_conteo")
    .select("id,tipo,fecha,turno,dia,responsable,n_lineas,valor,unidades,nota,autor_email,creado_en")
    .eq("tipo",tipo).order("fecha",{ascending:false}).order("creado_en",{ascending:false})
    .limit(limite||15);
  if(error) throw error;
  return data||[];
}
async function leerConteo(id){
  const {data,error}=await sb.from("inventario_conteo").select("*").eq("id",id).single();
  if(error) throw error; return data;
}
window.guardarConteo=guardarConteo;
window.listarConteos=listarConteos;
window.leerConteo=leerConteo;

/* ---------------- EL MODELO: CARGA Y GUARDADO ----------------
   El dataset vivia dentro del HTML, asi que solo quien edita el codigo podia
   cambiar un gramo. Ahora la tabla modelo guarda una fila por version y la
   aplicacion carga la ultima al abrir. La copia embebida en el HTML queda como
   semilla: si la base no tiene ninguna version, o no hay sesion, se usa esa.
   Una sola fuente de verdad en cada momento, nunca dos. */
async function cargarModelo(){
  try{
    const {data,error}=await sb.from("modelo")
      .select("id,version,datos,nota,autor_email,creado_en")
      .order("version",{ascending:false}).limit(1);
    if(error) throw error;
    if(!data||!data.length) return {origen:"semilla", version:0};
    const m=data[0];
    // se reemplaza el contenido de D sin cambiar la referencia: todas las vistas la tienen capturada
    Object.keys(D).forEach(k=>{ if(!(k in m.datos)) delete D[k]; });
    Object.assign(D,m.datos);
    return {origen:"base", version:m.version, nota:m.nota, autor:m.autor_email, creado_en:m.creado_en};
  }catch(e){
    console.warn("modelo: se usa la copia embebida.", e.message||e);
    return {origen:"semilla", version:0, error:e.message||String(e)};
  }
}
async function guardarModelo(nota){
  const u=(await sb.auth.getUser()).data.user;
  if(!u) throw new Error("hay que iniciar sesion");
  const resumen={
    productos:(D.productos||[]).length, insumos:(D.insumos||[]).length,
    semielaborados:(D.semielaborados||[]).length, rellenos:(D.rellenos||[]).length,
    mp_total:+(D.productos||[]).reduce((s,p)=>s+(p.mp||0),0).toFixed(4)
  };
  const {data,error}=await sb.from("modelo").insert({
    version:0, datos:D, resumen, nota:(nota||"").slice(0,400), autor:u.id, autor_email:u.email
  }).select("id,version,creado_en").single();
  if(error) throw error;
  return data;
}
async function listarModeloVersiones(){
  const {data,error}=await sb.from("v_modelo_versiones").select("*").limit(20);
  if(error) throw error;
  return data||[];
}
async function restaurarModelo(id){
  const {data,error}=await sb.from("modelo").select("datos,version").eq("id",id).single();
  if(error) throw error;
  Object.keys(D).forEach(k=>{ if(!(k in data.datos)) delete D[k]; });
  Object.assign(D,data.datos);
  return data.version;
}
window.cargarModelo=cargarModelo; window.guardarModelo=guardarModelo;
window.listarModeloVersiones=listarModeloVersiones; window.restaurarModelo=restaurarModelo;

</script>
