<style>
:root{
 --g950:#102e24; --g900:#174133; --g800:#1e5442; --g700:#276953; --g100:#e3f1ec; --g50:#f2f8f5;
 --c600:#c96b2c; --c500:#e8803a; --c100:#fcecd9; --s200:#e5dfd0; --s100:#f5f1e7;
 --bg:#faf7f0; --sf:#fff; --sf2:#fcfaf5;
 --ink:#1c2421; --ink7:#3b4742; --ink5:#66736d; --line:#e4dfd3; --lineS:#cfc7b6;
 --ok:#166534; --okbg:#dcfce7; --okbar:#1f8f52; --okbd:#86efac;
 --wa:#92400e; --wabg:#fef3c7; --wabar:#d97706; --wabd:#fcd34d;
 --ba:#991b1b; --babg:#fee2e2; --babar:#dc2626; --babd:#fca5a5;
 --teal:#3f9099;

 --r:14px; --rm:10px; --sh:0 2px 8px rgba(28,36,33,.06); --shm:0 8px 24px rgba(28,36,33,.09);
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--fs);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5}
button,input,select{font:inherit;color:inherit} button{cursor:pointer}
.hd{background:linear-gradient(135deg,var(--g950),var(--g900) 55%,var(--g800));color:#fff;border-top:4px solid var(--c500);box-shadow:0 4px 18px rgba(16,46,36,.22);position:sticky;top:0;z-index:40}
.hdi{max-width:1440px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.logo{width:48px;height:48px;border-radius:13px;background:linear-gradient(145deg,#f7efe2,#eadbc3);border:2px solid rgba(232,128,58,.65);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.bt{display:flex;flex-direction:column;gap:1px;min-width:0}

.pill{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:rgba(232,128,58,.22);color:#ffd5b5;border:1px solid rgba(232,128,58,.45);margin-left:9px}
.hc{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cfg{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:10px}

.cfg select,.cfg input{background:#fff;color:var(--ink);border:1px solid rgba(0,0,0,.12);border-radius:7px;padding:4px 8px;font-size:13px;font-weight:600;outline:none}
.cfg input{width:62px;text-align:right;font-family:var(--fm)}
.hbtn{border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.09);color:#fff;padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.18)} .hbtn.ac{background:var(--c500);border-color:var(--c500)} .hbtn.ac:hover{background:var(--c600)}
.tabs{background:var(--sf);border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(28,36,33,.03);position:sticky;top:74px;z-index:30}
.ti{max-width:1440px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:4px;overflow-x:auto}
.tb{border:none;background:transparent;padding:13px 16px 11px;font-size:14px;font-weight:600;color:var(--ink5);border-bottom:3px solid transparent;white-space:nowrap}
.tb:hover{color:var(--g900);background:var(--sf2)} .tb.on{color:var(--g900);border-bottom-color:var(--c500);font-weight:700}
.cnt{font-family:var(--fm);font-size:11px;font-weight:700;padding:2px 6px;border-radius:999px;background:var(--s100);color:var(--ink7);margin-left:6px}
.tb.on .cnt{background:var(--c100);color:var(--c600)}
.src{margin-left:auto;font-size:11.5px;color:var(--ink5);white-space:nowrap;padding-left:12px;font-family:var(--fm)}
.wrap{max-width:1440px;margin:0 auto;padding:20px 22px 60px}
.pane{display:none} .pane.on{display:block;animation:fi .16s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:19px;margin-bottom:17px;box-shadow:var(--sh)}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:15px}
.ct{margin:0;font-family:var(--fd);font-size:19px;font-weight:700;color:var(--g950);letter-spacing:-.01em}
.cs{margin:3px 0 0;font-size:13px;color:var(--ink5);max-width:72ch}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin-bottom:17px}
@media(max-width:1120px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--sf);border:1px solid var(--line);border-top:4px solid var(--g800);border-radius:var(--rm);padding:14px 15px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:5px}
.kpi.c{border-top-color:var(--c500)} .kpi.ok{border-top-color:var(--okbar)} .kpi.wa{border-top-color:var(--wabar)} .kpi.ba{border-top-color:var(--babar)}

.kv{font-family:var(--fm);font-size:23px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}

.bd{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.bd.ok{background:var(--okbg);color:var(--ok);border-color:var(--okbd)}
.bd.wa{background:var(--wabg);color:var(--wa);border-color:var(--wabd)}
.bd.ba{background:var(--babg);color:var(--ba);border-color:var(--babd)}
.bd.nt{background:var(--s100);color:var(--ink7);border-color:var(--line)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rm);background:var(--sf)}
table{width:100%;border-collapse:collapse;font-size:13.6px}
thead th{background:var(--s100);color:var(--ink7);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:10px 11px;text-align:left;border-bottom:1px solid var(--lineS);white-space:nowrap}
tbody td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none} tbody tr:hover td{background:var(--sf2)}
tfoot td{background:var(--s100);font-weight:700;padding:10px 11px;border-top:2px solid var(--lineS)}
.n{text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap} thead th.n{text-align:right}
/* Pareto */
.pb{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.pr{display:grid;grid-template-columns:30px 230px 1fr 120px;align-items:center;gap:12px}

.pnm{font-weight:700;display:flex;flex-direction:column}
.psb{font-size:11.5px;font-weight:500;color:var(--ink5)}

.pfl{height:100%;background:linear-gradient(90deg,var(--c500),var(--c600));border-radius:6px;transition:width .3s}

.pmt{display:flex;align-items:center;justify-content:flex-end;gap:7px;font-family:var(--fm);font-size:13px;font-weight:700}
/* cascada */
.casc{display:flex;flex-direction:column;gap:3px;margin-top:4px}

.clb{font-weight:600;display:flex;flex-direction:column}

.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:15px}

.pcn{font-family:var(--fd);font-size:16px;font-weight:700;color:var(--g950);line-height:1.25}

.lg{display:flex;gap:11px;flex-wrap:wrap;font-size:11px;color:var(--ink7)}

.mrow{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0}
.mrow b{font-family:var(--fm)}
.note{font-size:12.5px;color:var(--ink7);background:var(--s100);border:1px dashed var(--lineS);border-radius:9px;padding:10px 13px;margin-bottom:14px}

.note.bad{background:#fff5f5;border-color:var(--babd);color:var(--ba)}
.btn{border:1px solid var(--lineS);background:var(--sf);color:var(--ink);padding:7px 13px;border-radius:9px;font-size:13.2px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--s100);border-color:var(--ink5)}
.btn.pri{background:var(--g800);border-color:var(--g800);color:#fff} .btn.pri:hover{background:var(--g900)}
.btn.cr{background:var(--c500);border-color:var(--c500);color:#fff} .btn.cr:hover{background:var(--c600)}

.inp{width:100%;padding:8px 11px;border:1px solid var(--lineS);border-radius:8px;background:#fff;

.clic{cursor:pointer}
tr.clic:hover td{background:var(--g50)!important}

.modal{position:fixed;inset:0;background:rgba(16,46,36,.55);z-index:90;display:none;overflow-y:auto;padding:26px 16px}

.mbody{padding:18px}
.dhead{display:flex;gap:18px;align-items:center;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:16px;box-shadow:var(--sh);flex-wrap:wrap}

 align-items:center;justify-content:center;padding:24px;overflow-y:auto}

 border:2px solid rgba(232,128,58,.6);display:flex;align-items:center;justify-content:center}

 background:var(--c600);color:#fff;padding:2px 8px;border-radius:999px}

<script>

"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const S=n=>"S/ "+(Number(n)||0).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
const S0=n=>"S/ "+(Number(n)||0).toLocaleString("es-PE",{maximumFractionDigits:0});
const S3=n=>"S/ "+(Number(n)||0).toLocaleString("es-PE",{minimumFractionDigits:3,maximumFractionDigits:3});
const P=(n,d=1)=>(Number(n)||0).toFixed(d)+"%";
const N=(n,d=0)=>(Number(n)||0).toLocaleString("es-PE",{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const MES=["","Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Set","Oct","Nov","Dic"];
const INS={}; D.insumos.forEach(i=>INS[i.id]=i);
const INS_FAM={}; D.insumos.forEach(i=>INS_FAM[i.nombre]=i.familia);

let ST={anio:"2026", mes:"12", igv:D.meta.igv, aj:{}, esc:[], abierto:null,
        insumos:{}, estaciones:{}, stock:{}, inv:{conteos:{}}, invHist:[], invPT:{conteos:{}}};   // variaciones por familia de insumo y por estacion
const FAMILIAS=[...new Set(D.insumos.map(i=>i.familia))].sort();
FAMILIAS.forEach(f=>ST.insumos[f]=0);
D.estaciones.forEach(e=>ST.estaciones[e.id]=0);
D.productos.forEach(p=>{ST.aj[p.id]={precio:0,mp:0,mod:0,manual:null};ST.stock[p.id]=0;});
try{const g=localStorage.getItem("ohjala_v2");if(g){const o=JSON.parse(g);
  if(o.esc)ST.esc=o.esc; if(o.aj)Object.assign(ST.aj,o.aj); if(o.igv)ST.igv=o.igv; if(o.insumos)Object.assign(ST.insumos,o.insumos); if(o.estaciones)Object.assign(ST.estaciones,o.estaciones); if(o.stock)Object.assign(ST.stock,o.stock); if(o.inv)ST.inv=o.inv; if(o.invHist)ST.invHist=o.invHist; if(o.invPT)ST.invPT=o.invPT;}}catch(e){}
const save=()=>{try{localStorage.setItem("ohjala_v2",JSON.stringify({esc:ST.esc,aj:ST.aj,igv:ST.igv,insumos:ST.insumos,estaciones:ST.estaciones,stock:ST.stock,inv:ST.inv,invHist:ST.invHist,invPT:ST.invPT}))}catch(e){}};

function factorMP(p){
  // la variacion de cada familia pesa segun cuanto aporta esa familia al costo del producto
  if(!p.receta||!p.receta.length) return 1;
  const tot=p.receta.reduce((s,r)=>s+r.costo_por_unidad,0);
  if(!tot) return 1;
  let f=0;
  p.receta.forEach(r=>{
    const fam=r.familia==='relleno'?'relleno':(INS_FAM[r.nombre]||r.familia||'otros');
    const v=(ST.insumos[fam]!=null?ST.insumos[fam]:0)/100;
    f += (r.costo_por_unidad/tot)*(1+v);
  });
  return f;
}
/* la mano de obra de un producto son tres cosas: la masa que heredó, el relleno que heredó
   y sus propios pasos. El deslizador de una estación tiene que mover las tres. */
function moPorEstacion(p){
  const out={};
  (p.pasos||[]).forEach(x=>{ out[x.estacion]=(out[x.estacion]||0)+x.costo_unid; });
  const L=p.niveles||{};
  const semi=(D.semielaborados||[]).find(s=>s.id===((L.semielaborado||{}).id));
  if(semi&&semi.por_estacion){
    const g=((L.semielaborado||{}).gramos_por_unidad||0)/1000;
    Object.entries(semi.por_estacion).forEach(([e,v])=>{ out[e]=(out[e]||0)+g*v.mo; });
  }
  (L.rellenos||[]).forEach(rl=>{
    const R=(D.rellenos||[]).find(q=>q.id===rl.id||q.nombre===rl.nombre);
    if(!R||!R.por_estacion) return;
    const g=(rl.gramos_por_unidad||0)/1000;
    Object.entries(R.por_estacion).forEach(([e,v])=>{ out[e]=(out[e]||0)+g*v.mo; });
  });
  return out;
}
function factorMOD(p){
  const porEst=moPorEstacion(p);
  const tot=Object.values(porEst).reduce((s,v)=>s+v,0);
  if(!tot) return 1;
  let f=0;
  Object.entries(porEst).forEach(([e,v])=>{ f += (v/tot)*(1+(ST.estaciones[e]||0)/100); });
  return f;
}
function calc(p){
  const a=ST.aj[p.id]||{precio:0,mp:0,mod:0,manual:null};
  // si hay precio escrito a mano, ese manda sobre el deslizador
  const neto = (a.manual!=null && a.manual>0) ? a.manual/(1+ST.igv/100) : p.neto*(1+a.precio/100);
  const mp=p.mp*factorMP(p), mod=p.mod*factorMOD(p), cif=p.cif;
  const cuf=mp+mod+cif;
  return {...p, neto, mp, mod, cif, cuf, ub:neto-cuf,
    ub_pct:neto?100*(neto-cuf)/neto:0, fc_pct:neto?100*mp/neto:0,
    mod_pct:neto?100*mod/neto:0, cif_pct:neto?100*cif/neto:0,
    precio:neto*(1+ST.igv/100),
    sugerido:(mp+mod+cif)/(1-UMB.ub_min/100)*(1+ST.igv/100)};
}
const TODOS=()=>D.productos.map(calc);
const FPREC={}; D.canales.forEach(c=>FPREC[c.id]=(c.factor_precio!=null?c.factor_precio:1));
/* venta neta de un producto: cada canal tiene su propio precio, el corporativo compra con descuento */
function vta(p,anio,mes){
  const v=D.ventas[p.id]?.[anio]; if(!v) return 0;
  const ms=mes?[String(mes)]:Object.keys(v);
  let s=0; ms.forEach(m=>Object.entries(v[m]||{}).forEach(([ca,u])=>{s+=p.neto*(FPREC[ca]!=null?FPREC[ca]:1)*u;}));
  return s;
}
/* precio medio realmente cobrado, mezclando canales */
function netoPond(p,anio){const u=und(p.id,anio); return u?vta(p,anio)/u:p.neto;}
function und(pid,anio,mes){
  const v=D.ventas[pid]?.[anio]; if(!v) return 0;
  if(mes) return Object.values(v[mes]||{}).reduce((s,x)=>s+x,0);
  return Object.values(v).reduce((s,m)=>s+Object.values(m).reduce((a,b)=>a+b,0),0);
}
/* A6: und(pid,anio,mes) toma el mes en la tercera posicion. Tres llamadas le
   pasaban el canal ahi y devolvian 0, o le pasaban un cuarto argumento que se
   perdia en silencio. Esta funcion es la que suma por canal. */
/* A7: la comision de Rappi estaba como monto fijo en D.gastos, calculada a mano
   sobre la venta de 2026. Al elegir 2025 seguia igual. Ahora los tres costos
   variables de canal salen de econCanal, que si sigue al ano y a los deslizadores.
   Se llama solo en tiempo de render: econCanal usa CAN, que se define mas abajo. */
function costosCanal(anio){
  try{
    const e=D.canales.map(k=>econCanal(k,anio));
    const com=e.reduce((s,x)=>s+(x.com||0),0);
    const pos=e.reduce((s,x)=>s+(x.pos||0),0);
    const emp=e.reduce((s,x)=>s+(x.emp||0),0);
    return {com,pos,emp,total:com+pos+emp};
  }catch(err){ return {com:0,pos:0,emp:0,total:0}; }
}
function undCanal(pid,anio,canal){
  const v=D.ventas[pid]?.[anio]||{};
  return Object.values(v).reduce((s,m)=>s+((m||{})[canal]||0),0);
}
function canales(pid,anio,mes){
  const v=D.ventas[pid]?.[anio]?.[mes]||{}; return v;
}

/* ---------------- RECARGO AL CONSUMO ----------------
   DL 25988, 5a disp. complementaria: hasta 13% del valor del servicio, acordado con los
   trabajadores. No es remuneracion, no es base del IGV y no es ingreso de la empresa:
   se recauda del cliente y se reparte entre el personal. Lo que SI mueve la utilidad es
   (a) la demanda, porque el cliente paga mas, (b) la planilla de atencion que se puede
   financiar con el recargo, y (c) la comision del POS, que cobra sobre el total cargado. */
let RCG={pct:0, canales:{tienda:true,pedidos:false,rappi:false}, cobertura:0, elast:-0.6, reparto:'todos', regla:'igual'};
const ATENCION=["vendedora_mostrador_1","vendedora_mostrador_2","barista_barra"];

/* la bolsa: como se reparte lo recaudado entre el personal */
function repartoRC(recaudado){
  const q=(D.planilla.puestos||[]).filter(x=>RCG.reparto==='todos'?true:ATENCION.indexOf(x.id)>=0);
  if(!q.length||!recaudado) return {q:[],filas:[]};
  let pesos;
  if(RCG.regla==='igual')      pesos=q.map(()=>1);
  else if(RCG.regla==='sueldo')pesos=q.map(x=>x.sueldo_bruto);
  else                         pesos=q.map(x=>RCG.reparto==='todos'?(ATENCION.indexOf(x.id)>=0?2:1):1);
  const tot=pesos.reduce((a,b)=>a+b,0);
  const filas=q.map((x,i)=>{const mes=recaudado/12*pesos[i]/tot;
    return {...x, mes, pct:100*mes/x.sueldo_bruto};});
  return {q,filas};
}

function calcRC(){
  const ps=TODOS().map(p=>({...p,u:und(p.id,ST.anio)}));
  const U0=ps.reduce((s,p)=>s+p.u,0);
  // todo sale de la misma fuente que UB1: la rentabilidad por canal, que ya usa el precio de cada canal
  const RC0=D.rentabilidad_canal[ST.anio]||{};
  const V0=D.canales.reduce((s,c)=>s+((RC0[c.id]||{}).venta||0),0);
  const UB0=D.canales.reduce((s,c)=>s+((RC0[c.id]||{}).ub||0),0);
  const CUF0=D.canales.reduce((s,c)=>s+((RC0[c.id]||{}).mp||0)+((RC0[c.id]||{}).mod||0)+((RC0[c.id]||{}).cif||0),0);
  // misma definicion de resultado operativo que la pestana del EBITDA: mermas y capacidad ociosa incluidas
  const MZrc=D.matriz_mo[ST.anio]||{};
  const OCIOrc=D.capacidad.reduce((s,c)=>{
    const dem=D.productos.reduce((a,p)=>a+((MZrc[p.id]||{})[c.id]?.min||0),0)/12;
    return s+Math.max(0,c.min_practica-dem)*c.tarifa;},0)*12;
  const MERMArc=CUF0*0.05;
  const REGrc=(D.regalias||{}).pct?V0*((D.regalias.pct)/100):0;
  const G=D.gastos.reduce((s,g)=>s+g.monto_mensual,0)*12+costosCanal(ST.anio).total+OCIOrc+MERMArc+REGrc;
  const rc=RCG.pct/100;
  // el recargo sube el precio final en rc/(1+igv): no paga IGV
  const dPrecio=rc/(1+ST.igv/100);
  const plAt=(D.planilla.puestos||[]).filter(q=>ATENCION.indexOf(q.id)>=0)
    .reduce((s,q)=>s+q.costo_cargado_mes,0)*12;

  const cs=D.canales.map(c=>{
    const R=(D.rentabilidad_canal[ST.anio]||{})[c.id]||{};
    const aplica=!!RCG.canales[c.id];
    const v0=R.venta||0, u0=R.u||0, ub0=R.ub||0;
    const caida=aplica?RCG.elast*dPrecio:0;          // negativo
    const u1=u0*(1+caida), v1=v0*(1+caida), ub1=ub0*(1+caida);
    const recaudado=aplica?v1*rc:0;
    const posExtra=aplica?recaudado*(c.pct_con_tarjeta/100)*((c.comision_pos_pct||0)/100):0;
    return {id:c.id, nombre:c.nombre, aplica, v0, u0, ub0, v1, u1, ub1,
      ticket0:R.ticket||0, ticketCliente:(R.ticket||0)*(1+ST.igv/100)*(1+(aplica?rc/(1+ST.igv/100)*(1+ST.igv/100)/(1+ST.igv/100):0)),
      recaudado, posExtra, caida};
  });
  const V1=cs.reduce((s,c)=>s+c.v1,0), U1=cs.reduce((s,c)=>s+c.u1,0);
  const UB1=cs.reduce((s,c)=>s+c.ub1,0);
  const recaudado=cs.reduce((s,c)=>s+c.recaudado,0);
  const posExtra=cs.reduce((s,c)=>s+c.posExtra,0);
  const ahorro=Math.min(recaudado, plAt*RCG.cobertura/100);
  const UO0=UB0-G, UO1=UB1-G+ahorro-posExtra;
  return {ps,cs,V0,V1,U0,U1,UB0,UB1,UO0,UO1,G,rc,dPrecio,recaudado,posExtra,ahorro,plAt};
}

/* ---------------- FILTRAR Y ORDENAR CUALQUIER TABLA ----------------
   Se aplica sola a toda tabla con mas de 5 filas: una caja de busqueda,
   un selector por cada columna que se repite, y orden al tocar la cabecera. */
function numCel(t){
  const s=String(t).replace(/\s/g,"").replace(/S\/|%|u$/g,"").replace(/,/g,"");
  const n=parseFloat(s.replace(/[^\d.,-]/g,""));
  return Number.isFinite(n)?n:null;
}
function tablasFiltrables(raiz){
  (raiz||document).querySelectorAll(".tw > table").forEach(tb=>{
    if(tb.dataset.f) return;
    const tbody=tb.querySelector("tbody"); if(!tbody) return;
    const filas=[...tbody.querySelectorAll("tr")].filter(r=>!r.querySelector("td[colspan]"));
    if(filas.length<6) return;
    tb.dataset.f="1";
    const ths=[...tb.querySelectorAll("thead th")];
    const tw=tb.parentElement;
    // columnas que se repiten -> se vuelven selector
    const cands=[];
    ths.forEach((th,i)=>{
      if(th.classList.contains("n")) return;
      const vals=filas.map(r=>(r.children[i]?.textContent||"").trim().split("\n")[0].trim()).filter(Boolean);
      const uniq=[...new Set(vals)];
      if(uniq.length>1 && uniq.length<=14 && uniq.length<=vals.length*0.7) cands.push({i,n:th.textContent.trim(),uniq});
    });
    const bar=document.createElement("div"); bar.className="tfil";
    bar.innerHTML=`<input type="search" placeholder="Buscar en la tabla..."/>
      ${cands.slice(0,3).map(c=>`<select data-c="${c.i}"><option value="">${esc(c.n)}: todos</option>
        ${c.uniq.sort().map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("")}</select>`).join("")}
      <span class="tcount"></span>
      <button class="btn sm" data-reset>Limpiar</button>`;
    tw.parentElement.insertBefore(bar,tw);
    const cuenta=bar.querySelector(".tcount");
    const aplicar=()=>{
      const q=(bar.querySelector("input").value||"").toLowerCase().trim();
      const sel=[...bar.querySelectorAll("select")].map(s=>({i:+s.dataset.c,v:s.value}));
      let n=0;
      filas.forEach(r=>{
        let ok=!q || r.textContent.toLowerCase().includes(q);
        sel.forEach(s=>{ if(ok&&s.v){ const t=(r.children[s.i]?.textContent||"").trim().split("\n")[0].trim();
          if(t!==s.v) ok=false; }});
        r.style.display=ok?"":"none"; if(ok)n++;
      });
      cuenta.textContent=n===filas.length?`${filas.length} filas`:`${n} de ${filas.length}`;
      cuenta.style.color=n===filas.length?"var(--ink5)":"var(--c600)";
    };
    bar.querySelector("input").oninput=aplicar;
    bar.querySelectorAll("select").forEach(s=>s.onchange=aplicar);
    bar.querySelector("[data-reset]").onclick=()=>{bar.querySelector("input").value="";
      bar.querySelectorAll("select").forEach(s=>s.value=""); aplicar();};
    // ordenar al tocar la cabecera
    ths.forEach((th,i)=>{
      th.style.cursor="pointer"; th.title="Ordenar por "+th.textContent.trim();
      th.onclick=()=>{
        const asc=th.dataset.o!=="asc"; ths.forEach(x=>{x.dataset.o="";x.classList.remove("ord");});
        th.dataset.o=asc?"asc":"desc"; th.classList.add("ord");
        const orden=filas.slice().sort((a,b)=>{
          const ta=(a.children[i]?.textContent||"").trim(), tb2=(b.children[i]?.textContent||"").trim();
          const na=numCel(ta), nb=numCel(tb2);
          if(na!==null&&nb!==null) return asc?na-nb:nb-na;
          return asc?ta.localeCompare(tb2,"es"):tb2.localeCompare(ta,"es");
        });
        orden.forEach(r=>tbody.appendChild(r));
      };
    });
    aplicar();
  });
}

     const suma=(c,k)=>Q.filter(q=>q.clase===c).reduce((s,q)=>s+(q[k]||0),0);

      <td class="n">${P(100*tot("costo_cargado_mes")/V,1)}</td></tr></tfoot></table></div></div>`;

/* ---------------- ACUMULADOR DE MANO DE OBRA POR MES ----------------
   La pestana medía un "mes promedio" (el año dividido por 12). Eso esconde el
   problema: el mes promedio puede estar al 78% y diciembre al 112%. Esto cuenta
   los minutos mes por mes, siguiendo la estacionalidad real de las ventas, con
   la misma cascada de tres niveles del costo. Es a la mano de obra lo que
   consumoInsumos es a la materia prima: una sola fuente para todas las vistas. */
function minPorEstacion(p){
  const out={}, L=p.unidades_lote||1;
  (p.pasos||[]).forEach(x=>{ out[x.estacion]=(out[x.estacion]||0)+(x.minh_lote||0)/L; });
  const N0=p.niveles||{};
  const semi=(D.semielaborados||[]).find(s=>s.id===((N0.semielaborado||{}).id));
  if(semi&&semi.por_estacion){ const g=((N0.semielaborado||{}).gramos_por_unidad||0)/1000;
    Object.entries(semi.por_estacion).forEach(([e,v])=>{ out[e]=(out[e]||0)+g*(v.minh||0); }); }
  (N0.rellenos||[]).forEach(rl=>{ const R=(D.rellenos||[]).find(q=>q.id===rl.id||q.nombre===rl.nombre);
    if(R&&R.por_estacion){ const g=(rl.gramos_por_unidad||0)/1000;
      Object.entries(R.por_estacion).forEach(([e,v])=>{ out[e]=(out[e]||0)+g*(v.minh||0); }); } });
  return out;
}
function consumoMO(anio,mes,unidadesPorProd){
  const porEst={}, porProd={}, niv={semi:0,relleno:0,producto:0};
  let min=0, costo=0, setup=0, und_=0;
  TODOS().forEach(p=>{
    const u = unidadesPorProd ? (unidadesPorProd[p.id]||0) : und(p.id,anio,mes?String(mes):undefined);
    if(!u) return;
    const me=minPorEstacion(p), ce=moPorEstacion(p), f=factorMOD(p);
    /* A11: factorMOD es el promedio ponderado de los deslizadores de COSTO. Al
       multiplicar los minutos por el, subir el sueldo del horno movia los
       minutos de la mesa de formado. Los minutos no dependen del sueldo. */
    Object.keys(me).forEach(e=>{ porEst[e]=porEst[e]||{min:0,costo:0};
      porEst[e].min+=me[e]*u; });
    Object.keys(ce).forEach(e=>{ porEst[e]=porEst[e]||{min:0,costo:0};
      porEst[e].costo+=ce[e]*u*(1+((ST.estaciones||{})[e]||0)/100); });
    const MN=p.min_niveles||{};
    niv.semi+=(MN.semi||0)*u; niv.relleno+=(MN.relleno||0)*u; niv.producto+=(MN.producto||0)*u;
    const mu=Object.values(me).reduce((s,v)=>s+v,0);
    min+=mu*u; costo+=(p.mod||0)*u; und_+=u;
    setup+=(p.min_setup_lote||0)*(u/(p.unidades_lote||1));
    porProd[p.id]={nombre:p.nombre, u, min:mu*u, costo:(p.mod||0)*u,
                   minU:mu, est:me};
  });
  return {porEst,porProd,niv,min,costo,setup,und:und_};
}

function pintarVersiones(){
  const c=$("#dtVersiones"); if(!c) return;
  if(typeof listarModeloVersiones!=="function"){ c.innerHTML=`<div class="note">Hace falta sesión abierta.</div>`; return; }
  listarModeloVersiones().then(vs=>{
    if(!vs.length){ c.innerHTML=`<div class="note">Todavía no hay versiones guardadas. El tablero está usando la copia que viene dentro de la página.</div>`; return; }
    c.innerHTML=`<div class="tw"><table><thead><tr><th>Versión</th><th>Cuándo</th><th>Quién</th><th>Nota</th>
      <th class="n">Productos</th><th class="n">Insumos</th><th class="n">MP sumada</th><th></th></tr></thead>
     <tbody>${vs.map(v=>`<tr><td style="font-family:var(--fm);font-weight:700">v${v.version}</td>
      <td>${new Date(v.creado_en).toLocaleString("es-PE",{day:"2-digit",month:"short",year:"2-digit",hour:"2-digit",minute:"2-digit"})}</td>
      <td style="font-size:12px">${esc(v.autor_email||"—")}</td>
      <td style="font-size:12.5px;color:var(--ink5)">${esc(v.nota||"—")}</td>
      <td class="n">${esc(v.productos||"—")}</td><td class="n">${esc(v.insumos||"—")}</td>
      <td class="n">${v.mp_total!=null?S(v.mp_total):"—"}</td>
      <td><button class="btn sm" data-rest="${v.id}" data-v="${v.version}">Cargar</button></td></tr>`).join("")}</tbody>
    </table></div>`;
    $$("#dtVersiones [data-rest]").forEach(b=>b.onclick=async()=>{
      if(!confirm("¿Cargar la versión "+b.dataset.v+"? Lo que tengas sin guardar se pierde.")) return;
      try{ const v=await restaurarModelo(b.dataset.rest);
        if(typeof MODELO!=="undefined"){ MODELO.origen="base"; MODELO.version=v; }
        DT.sucio=false; recalcularModelo(); render(); vDatos();
        alert("Cargada la versión "+v+". No se guardó nada: si la quieres fijar, guarda una versión nueva.");
      }catch(e){ alert("No se pudo cargar: "+(e.message||e)); }
    });
  }).catch(e=>{ c.innerHTML=`<div class="note aw">No se pudo leer el historial: ${esc(e.message||String(e))}</div>`; });
}

/* ================= DECISIONES: QUE HACER, CON SU NUMERO =================
   El P&L dice cuanto se pierde. Esto dice que hacer, y en que orden.
   La idea central: los sueldos y el CIF ya estan pagados, asi que en el corto
   plazo lo escaso no es la plata, son los MINUTOS de la estacion mas cargada.
   Entonces lo que manda no es el margen por unidad sino la contribucion por
   minuto del cuello de botella. */
function cuelloBotella(){
  const dem={};
  Object.values(D.matriz_mo[ST.anio]||{}).forEach(pr=>Object.entries(pr).forEach(([e,v])=>{
    dem[e]=(dem[e]||0)+v.min/12; }));
  const filas=D.capacidad.map(c=>({...c, dem:dem[c.id]||0,
    util:c.min_practica?100*(dem[c.id]||0)/c.min_practica:0})).sort((a,b)=>b.util-a.util);
  return {filas, cuello:filas[0]};
}
function mesesCuello(estId){
  const mu={};
  Object.entries(D.matriz_mo[ST.anio]||{}).forEach(([pid,ests])=>{
    const tot=und(pid,ST.anio); if(!tot) return;
    mu[pid]=((ests[estId]||{}).min||0)/tot;
  });
  const c=D.capacidad.find(x=>x.id===estId)||{min_practica:0};
  return Array.from({length:12},(_,i)=>{
    const m=i+1;
    const min=Object.keys(mu).reduce((s,pid)=>s+mu[pid]*und(pid,ST.anio,String(m)),0);
    return {mes:m, min, util:c.min_practica?100*min/c.min_practica:0,
            falta:Math.max(0,min-c.min_practica)};
  });
}
/* contribucion de corto plazo: lo que entra menos lo que se gasta SOLO por hacer
   esa unidad (materia prima, costo del canal, regalia y provision de merma).
   La mano de obra y el CIF no entran: se pagan igual. */
function contribPorMinuto(estId){
  return TODOS().map(p=>{
    const u=und(p.id,ST.anio); if(!u) return null;
    let venta=0, canal=0;
    D.canales.forEach(c=>{
      const q=undCanal(p.id,ST.anio,c.id); if(!q) return;
      const neto=p.neto*(FPREC[c.id]!=null?FPREC[c.id]:1);
      venta+=neto*q;
      canal+=neto*q*((c.comision_pct||0)/100)
           + neto*q*((c.pct_con_tarjeta||0)/100)*((c.comision_pos_pct!=null?c.comision_pos_pct:3.5)/100)
           + q*(c.costo_empaque_extra||0);
    });
    const reg=venta*(((D.regalias||{}).pct||0)/100);
    const merma=p.cuf*u*0.05;
    const contrib=venta-p.mp*u-canal-reg-merma;
    const min=(minPorEstacion(p)[estId]||0)*u;
    return {p, u, venta, netoReal:u?venta/u:0, canalU:u?canal/u:0,
            contrib, contribU:u?contrib/u:0, min, porMin:min?contrib/min:null};
  }).filter(Boolean);
}
function cardDecisiones(){
  const CB=cuelloBotella(), cu=CB.cuello;
  const MS=mesesCuello(cu.id);
  const F=contribPorMinuto(cu.id).sort((a,b)=>(b.porMin==null?-1:b.porMin)-(a.porMin==null?-1:a.porMin));
  const V=F.reduce((s,x)=>s+x.venta,0), C=F.reduce((s,x)=>s+x.contrib,0);
  const MIN=F.reduce((s,x)=>s+x.min,0);
  const prom=MIN?C/MIN:0;
  const mcPct=V?100*C/V:0;
  // fijos
  const ESTRa=D.gastos.reduce((s,g)=>s+g.monto_mensual,0)*12;
  const PLANFa=Math.max(0,((D.planilla||{}).pool_directo_mensual||0)-D.capacidad.reduce((s,c)=>s+c.pool,0))*12;
  const OCIOa=D.capacidad.reduce((s,c)=>s+Math.max(0,c.min_practica-((CB.filas.find(f=>f.id===c.id)||{}).dem||0))*c.tarifa,0)*12;
  const GFa=((D.deuda||{}).lineas||[]).reduce((s,l)=>s+(l.interes_mes||0),0)*12;
  const FIJO=ESTRa+PLANFa+OCIOa+GFa;
  const BE=mcPct?FIJO/(mcPct/100):0;
  // setup
  let setup=0, proceso=0;
  D.productos.forEach(p=>{ const L=p.unidades_lote||1, t=und(p.id,ST.anio)/L;
    (p.pasos||[]).forEach(x=>{ setup+=(x.min_setup||0)*t; proceso+=(x.min_proceso||0)*t; }); });
  // palanca Rappi
  const rap=D.canales.find(c=>(c.comision_pct||0)>0);
  const palancaRappi=(alza,caida)=>{
    if(!rap) return 0;
    let g=0;
    D.productos.forEach(p=>{
      const q=undCanal(p.id,ST.anio,rap.id); if(!q) return;
      const n0=p.neto*(FPREC[rap.id]!=null?FPREC[rap.id]:1), n1=n0*(1+alza);
      const k=1-((rap.comision_pct||0)/100)-(((D.regalias||{}).pct||0)/100);
      const emp=rap.costo_empaque_extra||0;
      const hoy=q*(n0*k-emp-p.mp-p.cuf*0.05);
      const nue=q*(1-caida)*(n1*k-emp-p.mp-p.cuf*0.05);
      g+=nue-hoy;
    });
    return g;
  };
  // peor por minuto, que es donde el precio rinde mas
  const peores=F.filter(x=>x.porMin!=null&&x.min>MIN*0.02).slice(-3).reverse();
  const alzaPrecio=(x,alza)=>{
    let inc=0;
    D.canales.forEach(c=>{
      const q=undCanal(x.p.id,ST.anio,c.id); if(!q) return;
      const n=x.p.neto*(FPREC[c.id]!=null?FPREC[c.id]:1)*alza;
      inc+=q*n*(1-((c.comision_pct||0)/100)-(((D.regalias||{}).pct||0)/100));
    });
    return inc;
  };
  const fteCosto=(()=>{const e=D.estaciones.find(x=>x.id===cu.id)||{};
    const f=Object.values(e.dotacion_fte||{}).reduce((s,v)=>s+v,0)||1;
    return cu.pool/f;})();
  const minPersona=(D.planilla||{}).minutos_disponibles_por_persona_mes||8985.6;
  const faltaTot=MS.reduce((s,m)=>s+m.falta,0);
  const mesesFalta=MS.filter(m=>m.falta>0).map(m=>MES[m.mes]);

  const pal=[
    {n:"Juntar tandas: dejar de hornear a medio llenar", g:setup/2*prom, c:0,
     cap:"+"+N(setup/2)+" min", nota:"La preparación es el "+P(100*setup/(setup+proceso),1)+" del trabajo y no produce nada. Hacer la mitad de arranques libera esos minutos sin contratar a nadie. El límite es la vida útil: se agrupan días contiguos, no la semana."},
    rap?(()=>{
      /* La elasticidad de la demanda no la sabe nadie acá, asi que no se inventa:
         se busca el punto donde la decision se da vuelta. Es la pregunta que si
         tiene respuesta — "cuanto volumen puedo perder antes de que deje de
         convenir" — y se contesta con la misma aritmetica. */
      let lo=0, hi=0.95;
      for(let i=0;i<40;i++){ const m=(lo+hi)/2; if(palancaRappi(0.25,m)>0) lo=m; else hi=m; }
      return {n:"Lista de precios propia para "+rap.nombre+" (+25%)", g:palancaRappi(0.25,0), c:0,
       cap:"libera minutos",
       nota:rap.nombre+" cobra hoy el mismo precio que la vitrina y la panadería paga el "+P(rap.comision_pct,0)+
        " de comisión. Lo que gana depende de cuánto volumen se pierda, y eso no está medido: "+
        "la cifra de al lado supone que no se pierde nada. Lo que sí se puede calcular es el punto de quiebre — "+
        "conviene mientras el volumen no caiga más de "+P(100*lo,1)+" — y además, si cae, esos minutos los vende "+
        "la vitrina con mejor margen."};
    })():null,
    {n:"Bajar 10% la estructura", g:ESTRa*0.10, c:0, cap:"—",
     nota:"La estructura es "+P(100*ESTRa/V,2)+" de la venta. La línea más grande es la planilla de administración."},
    ...peores.map(x=>({n:"Subir 15% el precio de "+x.p.nombre, g:alzaPrecio(x,0.15), c:0, cap:"—",
      nota:"Deja "+S(x.porMin)+" por minuto del cuello contra un promedio de "+S(prom)+", y se lleva "+P(100*x.min/MIN,1)+" de la estación. Un alza de precio cae casi entera a contribución."})),
    faltaTot>0?{n:"Un temporal en "+mesesFalta.join(" y "), g:faltaTot*prom, c:fteCosto*mesesFalta.length,
     cap:"+"+N(minPersona*mesesFalta.length)+" min", nota:"Diez de los doce meses caben. Faltan "+N(faltaTot)+" minutos y están todos ahí. Es un temporal, no una plaza."}:null,
    {n:"Contratar una plaza fija en "+cu.nombre, g:0, c:fteCosto*12,
     cap:"+"+N(minPersona*12)+" min",
     nota:"Cuesta "+S0(fteCosto*12)+" al año de costo fijo. Para pagarla con un margen de contribución de "+P(mcPct,2)+" hay que vender "+S0(mcPct?fteCosto*12/(mcPct/100):0)+" más, que es "+P(100*(mcPct?fteCosto*12/(mcPct/100):0)/V,1)+" de la venta. La estación está al "+P(cu.util,1)+": no te frena la capacidad, te frena la demanda."}
  ].filter(Boolean).sort((a,b)=>(b.g-b.c)-(a.g-a.c));

  return `<div class="card"><div class="ch"><div><h2 class="ct">Qué hacer, y en qué orden</h2>
    <p class="cs">El P&L dice cuánto se pierde. Esto dice qué mover. Lo escaso no es la plata — los sueldos ya están pagados —: son los minutos de la estación más cargada.</p></div>
    <span class="bd ${BE>V?'ba':'ok'}">equilibrio ${BE>V?"a "+P(100*(BE/V-1),2)+" de distancia":"ya superado"}</span></div>

   <div class="kpis">
    <div class="kpi"><span class="kl">Cuello de botella</span><div class="kv" style="font-size:19px">${esc(cu.nombre)}</div>
      <div class="kf"><span>${P(cu.util,1)} en el mes promedio</span></div></div>
    <div class="kpi c"><span class="kl">Margen de contribución</span><div class="kv">${P(mcPct,2)}</div>
      <div class="kf"><span>por cada sol de venta</span></div></div>
    <div class="kpi"><span class="kl">Punto de equilibrio</span><div class="kv">${S0(BE)}</div>
      <div class="kf"><span>venta de hoy ${S0(V)}</span><span class="bd ${BE>V?'ba':'ok'}">${BE>V?"falta "+S0(BE-V):"holgura "+S0(V-BE)}</span></div></div>
    <div class="kpi"><span class="kl">Contribución por minuto</span><div class="kv">${S(prom)}</div>
      <div class="kf"><span>promedio del negocio</span></div></div>
   </div>

   <h3 style="font-family:var(--fd);font-size:16px;margin:20px 0 3px">1 · Las palancas, con su número</h3>
   <p class="cs" style="margin:0 0 9px">Ordenadas por lo que dejan menos lo que cuestan. Cualquiera de las primeras tapa el déficit sin contratar a nadie.</p>
   <div class="tw"><table><thead><tr><th>Palanca</th><th class="n">Gana al año</th><th class="n">Cuesta</th>
     <th class="n">Neto</th><th class="n">Capacidad</th></tr></thead>
    <tbody>${pal.map((x,k)=>`<tr><td><b>${esc(x.n)}</b>
      <div style="font-size:11.5px;color:var(--ink5);margin-top:2px">${esc(x.nota)}</div></td>
      <td class="n" style="font-weight:600;color:${x.g>0?'var(--ok)':'var(--ink5)'}">${x.g?S0(x.g):"—"}</td>
      <td class="n" style="color:${x.c?'var(--ba)':'var(--ink5)'}">${x.c?"−"+S0(x.c):"0"}</td>
      <td class="n" style="font-weight:700;color:${(x.g-x.c)>0?'var(--ok)':'var(--ba)'}">${(x.g-x.c)>0?"+":"−"}${S0(Math.abs(x.g-x.c))}</td>
      <td class="n" style="font-size:12px;color:var(--ink5)">${esc(x.cap)}</td></tr>`).join("")}</tbody>
   </table></div>

   <h3 style="font-family:var(--fd);font-size:16px;margin:22px 0 3px">2 · Contribución por minuto de ${esc(cu.nombre)}</h3>
   <p class="cs" style="margin:0 0 9px">Lo que deja cada producto por cada minuto de la estación que no da más. Es la tabla que contesta qué hornear primero.</p>
   <div class="tw"><table><thead><tr><th>Producto</th><th class="n">Unidades</th><th class="n">Neto real</th>
     <th class="n">MP</th><th class="n">Canal</th><th class="n">Contribución</th>
     <th class="n">Min del cuello</th><th class="n">% de la estación</th><th class="n">S/ por minuto</th></tr></thead>
    <tbody>${F.map(x=>`<tr class="clic" data-p="${x.p.id}">
      <td style="font-weight:600">${esc(x.p.nombre)}</td>
      <td class="n">${N(x.u)}</td><td class="n">${S(x.netoReal)}</td>
      <td class="n" style="color:var(--ink5)">${S(x.p.mp)}</td>
      <td class="n" style="color:var(--ink5)">${S(x.canalU)}</td>
      <td class="n">${S(x.contribU)}</td>
      <td class="n">${x.min?N(x.min):"—"}</td>
      <td class="n" style="color:var(--ink5)">${x.min?P(100*x.min/MIN,1):"—"}</td>
      <td class="n"><span class="bd ${x.porMin==null?'nt':x.porMin>=prom?'ok':x.porMin>=prom*0.6?'wa':'ba'}">${x.porMin==null?"no la usa":S(x.porMin)}</span></td></tr>`).join("")}</tbody>
    <tfoot><tr><td>TOTAL</td><td class="n">${N(F.reduce((s,x)=>s+x.u,0))}</td><td class="n"></td>
     <td class="n"></td><td class="n"></td><td class="n">${S0(C)}</td><td class="n">${N(MIN)}</td>
     <td class="n">100%</td><td class="n">${S(prom)}</td></tr></tfoot></table></div>
   <div class="note" style="margin:11px 0 0">Esta contribución no es la utilidad bruta: deja fuera la mano de obra y el
    CIF a propósito, porque esos se pagan igual se hornee o no. Para decidir <b>qué</b> producir con la planta llena,
    la pregunta es cuánto deja cada minuto. Para decidir <b>a qué precio</b> vender, la pregunta sigue siendo el CUF
    y los pisos de costo.</div>

   <h3 style="font-family:var(--fd);font-size:16px;margin:22px 0 3px">3 · Los doce meses del cuello</h3>
   <p class="cs" style="margin:0 0 9px">El promedio del año esconde los meses que no caben.</p>
   <div class="tw"><table><thead><tr><th>Mes</th><th class="n">Minutos pedidos</th><th class="n">Capacidad práctica</th>
     <th class="n">Uso</th><th class="n">Faltan</th></tr></thead>
    <tbody>${MS.map(m=>`<tr><td style="font-weight:600">${MES[m.mes]}</td>
      <td class="n">${N(m.min)}</td><td class="n" style="color:var(--ink5)">${N(cu.min_practica)}</td>
      <td class="n"><span class="bd ${m.util>=100?'ba':m.util>=95?'aw':'ok'}">${P(m.util,1)}</span></td>
      <td class="n" style="color:${m.falta?'var(--ba)':'var(--ink5)'}">${m.falta?N(m.falta):"—"}</td></tr>`).join("")}</tbody>
   </table></div>

   <h3 style="font-family:var(--fd);font-size:16px;margin:22px 0 3px">4 · Todas las estaciones</h3>
   <div class="tw"><table><thead><tr><th>Estación</th><th class="n">Minutos pedidos</th>
     <th class="n">Capacidad práctica</th><th class="n">Uso</th><th class="n">Holgura</th></tr></thead>
    <tbody>${CB.filas.map(f=>`<tr class="clic" data-e="${f.id}"><td style="font-weight:600">${esc(f.nombre)}</td>
      <td class="n">${N(f.dem)}</td><td class="n">${N(f.min_practica)}</td>
      <td class="n"><span class="bd ${f.util>=95?'ba':f.util>=85?'aw':'ok'}">${P(f.util,1)}</span></td>
      <td class="n" style="color:var(--ink5)">${N(f.min_practica-f.dem)} min</td></tr>`).join("")}</tbody>
   </table></div>
  </div>`;
}

/* ================= CUADRES (B1 de la revision del Motor V4) =================
   Los costos derivados vienen guardados en el dataset. Nadie los recalculaba, y
   por eso pasaron tres errores: un rinde_g mayor que sus insumos, una planilla
   que no entraba a ninguna linea y un CIF que decia repartirse por tres drivers
   y usaba uno. Esto corre el mismo calculo al reves y AVISA. No corrige nada:
   un cuadre que arregla en silencio esconde el error. */
function cuadres(){
  const R=[], tol=(a,b,t)=>Math.abs(a-b)<=(t||0.01);
  const add=(nombre,ok,esperado,hallado,nota)=>R.push({nombre,ok,esperado,hallado,nota});

  let mal=[];
  D.insumos.forEach(i=>{
    const ce=(i.costo_compra/(1-(i.merma_pct||0)))/(i.factor_conversion_compra_receta||1);
    if(!tol(ce,i.costo_efectivo,1e-6)) mal.push(i.id);
  });
  add("Costo efectivo de cada insumo", !mal.length, "costo_compra / (1−merma) / factor",
      mal.length?mal.length+" insumos fuera: "+mal.slice(0,3).join(", "):"46 de 46 calzan","");

  mal=[];
  (D.semielaborados||[]).concat(D.rellenos||[]).forEach(s=>{
    const g=(s.receta||s.insumos||[]).reduce((a,x)=>a+(x.gramos||0),0);
    if(s.rinde_g>g*1.001) mal.push(s.id+" ("+N(s.rinde_g)+" g de "+N(g)+" g)");
  });
  add("El rendimiento no supera a sus insumos", !mal.length, "rinde_g ≤ Σ gramos",
      mal.length?mal.join(" · "):"10 de 10 calzan",
      "Sin agua ni otro liquido, una preparacion no gana peso: si rinde mas, el gramo sale barato.");

  mal=[];
  let np=0;
  const revPasos=(dueno,pasos)=>(pasos||[]).forEach(x=>{ np++;
    if(x.min_setup!=null&&x.min_proceso!=null&&!tol((x.min_setup||0)+(x.min_proceso||0),x.minh_lote||0,0.005))
      mal.push(dueno+"/"+x.nombre); });
  D.productos.forEach(p=>revPasos(p.id,p.pasos));
  (D.semielaborados||[]).forEach(s=>revPasos(s.id,s.pasos));
  (D.rellenos||[]).forEach(r=>revPasos(r.id,r.pasos));
  add("Preparacion + proceso = minutos del paso", !mal.length, "min_setup + min_proceso = minh_lote",
      mal.length?mal.length+" pasos fuera":np+" de "+np+" calzan","");

  mal=[];
  D.productos.forEach(p=>{
    const s=(p.receta||[]).reduce((a,r)=>a+(r.costo_por_unidad||0),0);
    if(!tol(s,p.mp,0.01)) mal.push(p.id+" ("+S3(s)+" vs "+S3(p.mp)+")");
  });
  add("La receta suma la materia prima del producto", !mal.length, "Σ receta = mp",
      mal.length?mal.join(" · "):"19 de 19 calzan","");

  mal=[];
  D.productos.forEach(p=>{
    if(!(p.pasos||[]).length) return;
    const mo=Object.values(moPorEstacion(p)).reduce((a,v)=>a+v,0);
    const mn=Object.values(minPorEstacion(p)).reduce((a,v)=>a+v,0);
    if(!tol(mo,p.mod,0.002)||!tol(mn,p.min_hombre,0.002)) mal.push(p.id);
  });
  add("Los minutos por estacion suman la mano de obra", !mal.length,
      "Σ moPorEstacion = mod · Σ minPorEstacion = min_hombre",
      mal.length?mal.join(", "):"los 19 calzan","");

  try{
    let m=0; for(let k=1;k<=12;k++) m+=consumoMO(ST.anio,k).min;
    const mz=Object.values(D.matriz_mo[ST.anio]||{}).reduce((a,pr)=>a+Object.values(pr).reduce((b,x)=>b+x.min,0),0);
    add("Los doce meses suman el año", tol(m,mz,Math.max(1,mz*1e-6)),
        N(mz)+" minutos en la matriz", N(m)+" minutos sumando mes a mes",
        "Si no calza, el acumulador mensual y el anual cuentan distinto.");
  }catch(e){ add("Los doce meses suman el año", false, "—", "no se pudo calcular: "+e.message,""); }

  try{
    const pool=D.cif.reduce((a,c)=>a+c.monto_mensual,0)*12;
    const abs=D.productos.reduce((a,p)=>a+(p.cif||0)*und(p.id,ST.anio),0);
    add("El CIF absorbido iguala al pool", tol(abs,pool,Math.max(5,pool*1e-4)),
        S0(pool)+" de pools al año", S0(abs)+" repartido a los productos",
        "Se reparte por los drivers que declara cada pool: minutos de horno y minutos de persona.");
  }catch(e){}

  const pools=D.capacidad.reduce((a,c)=>a+c.pool,0);
  const dir=(D.planilla||{}).pool_directo_mensual||0;
  add("La planilla directa cae entera en alguna estacion", Math.abs(dir-pools)<1,
      S0(dir)+" de planilla directa", S0(pools)+" repartido en estaciones",
      Math.abs(dir-pools)>=1?("La diferencia de "+S0(dir-pools)+" al mes se declara como linea propia del P&L. "+
        "No esta perdida, pero tampoco esta en el costo del producto: hay que decidir si debe ser pool de estacion."):"");
  return R;
}

/* ================= MOTOR DE RECALCULO =================
   Hasta ahora los costos derivados venian precalculados en el JSON por scripts de
   Python: el navegador solo los leia y les aplicaba los deslizadores. Eso hacia
   imposible editar una receta desde la aplicacion, porque cambiar un gramo no
   movia nada.
   Esto recalcula la cadena de materia prima desde las primitivas, en el navegador:
      insumo.costo_compra, merma  ->  costo_efectivo
      gramos de la masa           ->  costo_tanda, costo_por_g
      gramos del relleno          ->  idem
      gramos por unidad del L1    ->  costo heredado por unidad
      lineas de la receta         ->  costo_lote, costo_por_unidad
      subtotales                  ->  mp
      mp + mod + cif              ->  cuf, ub, porcentajes
   NO toca mano de obra ni CIF: nada de lo que se puede editar en esta fase los
   mueve. Los tiempos quedan fuera a proposito hasta que el Motor V4 conteste si
   falta la cadena OIT.
   El redondeo imita al de los scripts que generaron el dataset, porque la prueba
   de cierre compara campo por campo contra lo guardado. */
const R4=x=>Math.round(x*1e4)/1e4, R8=x=>Math.round(x*1e8)/1e8,
      R2=x=>Math.round(x*100)/100, R6=x=>Math.round(x*1e6)/1e6;

function recalcularModelo(){
  const porId={}, porNombre={};
  D.insumos.forEach(i=>{
    i.costo_efectivo=R8((i.costo_compra/(1-(i.merma_pct||0)))/(i.factor_conversion_compra_receta||1));
    porId[i.id]=i; porNombre[i.nombre]=i;
  });
  const ins=(id,nombre)=>porId[id]||porNombre[nombre]||{costo_efectivo:0};

  /* --- L1: masas --- */
  (D.semielaborados||[]).forEach(s=>{
    let t=0;
    (s.receta||[]).forEach(r=>{
      const I=ins(r.insumo_id,r.nombre), ce=I.costo_efectivo||0;
      r.costo_unit=R8(ce); r.costo=R4((r.gramos||0)*ce); t+=(r.gramos||0)*ce;
    });
    s.costo_tanda=R4(t);
    s.costo_por_g=R8(s.rinde_g?t/s.rinde_g:0);
    s.costo_por_kg=R4(s.rinde_g?1000*t/s.rinde_g:0);
    (s.receta||[]).forEach(r=>{ r.pct_costo=R2(s.costo_tanda?100*r.costo/s.costo_tanda:0); });
    const h=(s.receta||[]).find(r=>/harina/i.test(r.nombre||""));
    if(h&&h.gramos)(s.receta||[]).forEach(r=>{ if(r.pct_panadero!=null) r.pct_panadero=R2(100*(r.gramos||0)/h.gramos); });
    // minutos y costo de mano de obra por kilo de la tanda
    const kg=(s.rinde_g||0)/1000;
    s.minh_tanda=R4((s.pasos||[]).reduce((a,x)=>a+(x.minh_lote||0),0));
    s.mo_tanda=R4((s.pasos||[]).reduce((a,x)=>a+(x.minh_lote||0)*(x.tarifa||0),0));
    s.minm_tanda=R4((s.pasos||[]).reduce((a,x)=>a+(x.minm_lote||0),0));
    s.minh_por_kg=kg?R6(s.minh_tanda/kg):0;
    s.mo_por_kg=kg?R6(s.mo_tanda/kg):0;
    s.minm_por_kg=kg?R6(s.minm_tanda/kg):0;
    const pe={};
    (s.pasos||[]).forEach(x=>{ pe[x.estacion]=pe[x.estacion]||{minh:0,mo:0};
      pe[x.estacion].minh+=(x.minh_lote||0); pe[x.estacion].mo+=(x.minh_lote||0)*(x.tarifa||0); });
    s.por_estacion={}; Object.entries(pe).forEach(([e,v])=>{
      s.por_estacion[e]={minh:kg?R6(v.minh/kg):0, mo:kg?R6(v.mo/kg):0}; });
  });

  /* --- L1: rellenos, mezclas y baños --- */
  (D.rellenos||[]).forEach(R=>{
    let t=0;
    (R.insumos||[]).forEach(x=>{
      const I=ins(x.insumo_id,null), ce=I.costo_efectivo||0;
      x.costo=R2((x.gramos||0)*ce); t+=(x.gramos||0)*ce;
    });
    R.costo_tanda=R4(t);
    R.costo_por_g=R8(R.rinde_g?t/R.rinde_g:0);
    const kg=(R.rinde_g||0)/1000;
    R.minh_tanda=R4((R.pasos||[]).reduce((a,x)=>a+(x.minh_lote||0),0));
    R.mo_tanda=R4((R.pasos||[]).reduce((a,x)=>a+(x.minh_lote||0)*(x.tarifa||0),0));
    R.minm_tanda=R4((R.pasos||[]).reduce((a,x)=>a+(x.minm_lote||0),0));
    R.minh_por_kg=kg?R6(R.minh_tanda/kg):0;
    R.mo_por_kg=kg?R6(R.mo_tanda/kg):0;
    R.minm_por_kg=kg?R6(R.minm_tanda/kg):0;
    const pe={};
    (R.pasos||[]).forEach(x=>{ pe[x.estacion]=pe[x.estacion]||{minh:0,mo:0};
      pe[x.estacion].minh+=(x.minh_lote||0); pe[x.estacion].mo+=(x.minh_lote||0)*(x.tarifa||0); });
    R.por_estacion={}; Object.entries(pe).forEach(([e,v])=>{
      R.por_estacion[e]={minh:kg?R6(v.minh/kg):0, mo:kg?R6(v.mo/kg):0}; });
  });

  /* --- L2: productos --- */
  /* D.meta.igv viene como 18, no como 0.18. Se acepta cualquiera de las dos
     convenciones: lo que importa es no dividir el precio entre 19. */
  const igv0=(D.meta||{}).igv;
  const IGV=(igv0==null)?0.18:(igv0>1?igv0/100:igv0);
  D.productos.forEach(p=>{
    const L=p.unidades_lote||1, N0=p.niveles;
    (p.receta||[]).forEach(r=>{
      if(r.tipo==="relleno"){
        const R=(D.rellenos||[]).find(q=>q.nombre===r.nombre);
        if(R){ r.costo_unit_ins=R8(R.costo_por_g); r.costo_lote=R4((r.cant_lote||0)*R.costo_por_g);
               r.costo_por_unidad=R4(r.costo_lote/L); }
        return;
      }
      const I=ins(r.insumo_id,r.nombre), ce=I.costo_efectivo||0;
      r.costo_unit_ins=R8(ce);
      r.costo_lote=R4((r.cant_lote||0)*ce);
      r.costo_por_unidad=R4(r.costo_lote/L);
      if(I.merma_pct!=null) r.merma=I.merma_pct;
    });
    let mnS=0,mnR=0,moS=0,moR=0,mqS=0,mqR=0;
    if(N0){
      const s=(D.semielaborados||[]).find(x=>x.id===((N0.semielaborado||{}).id));
      if(s&&N0.semielaborado){
        const g=(N0.semielaborado.gramos_por_unidad||0);
        N0.semielaborado.costo_por_g=R8(s.costo_por_g);
        N0.semielaborado.costo_por_unidad=R4(g*s.costo_por_g);
        mnS=(g/1000)*(s.minh_por_kg||0); moS=(g/1000)*(s.mo_por_kg||0);
        mqS=(g/1000)*(s.minm_por_kg||0);
      }
      (N0.rellenos||[]).forEach(rl=>{
        const R=(D.rellenos||[]).find(x=>x.id===rl.id);
        if(!R) return;
        rl.costo_por_g=R8(R.costo_por_g);
        rl.costo_por_unidad=R4((rl.gramos_por_unidad||0)*R.costo_por_g);
        mnR+=((rl.gramos_por_unidad||0)/1000)*(R.minh_por_kg||0);
        moR+=((rl.gramos_por_unidad||0)/1000)*(R.mo_por_kg||0);
        mqR+=((rl.gramos_por_unidad||0)/1000)*(R.minm_por_kg||0);
      });
      (N0.directos||[]).forEach(x=>{ const I=ins(x.insumo_id,x.nombre);
        x.costo_por_unidad=R4((x.gramos_por_unidad||0)*(I.costo_efectivo||0)); });
      (N0.empaque||[]).forEach(x=>{ const I=ins(x.insumo_id,x.nombre);
        x.costo_por_unidad=R4((x.cantidad||0)*(I.costo_efectivo||0)); });
      const semi=(N0.semielaborado||{}).costo_por_unidad||0;
      const rell=(N0.rellenos||[]).reduce((a,x)=>a+(x.costo_por_unidad||0),0);
      const dir=(N0.directos||[]).reduce((a,x)=>a+(x.costo_por_unidad||0),0);
      const emp=(N0.empaque||[]).reduce((a,x)=>a+(x.costo_por_unidad||0),0);
      N0.subtotales={semielaborado:R4(semi),rellenos:R4(rell),directos:R4(dir),
                     empaque:R4(emp),total:R4(semi+rell+dir+emp)};
      p.mp=R4(N0.subtotales.total);
    }
    if((p.pasos||[]).length){
      const mnP=(p.pasos||[]).reduce((a,x)=>a+(x.minh_lote||0),0)/L;
      const moP=(p.pasos||[]).reduce((a,x)=>a+(x.minh_lote||0)*(x.tarifa||0),0)/L;
      (p.pasos||[]).forEach(x=>{ x.minh_unid=R6((x.minh_lote||0)/L);
        x.costo_unid=R6((x.minh_lote||0)*(x.tarifa||0)/L); });
      p.min_niveles={semi:R6(mnS),relleno:R6(mnR),producto:R6(mnP)};
      p.mo_niveles={semi:R4(moS),relleno:R4(moR),producto:R4(moP)};
      p.min_hombre=R4(mnS+mnR+mnP);
      p.mod=R4(moS+moR+moP);
      /* Los minutos de maquina tambien se heredan: la amasadora y la camara
         trabajan en la tanda de masa, no en el pan. Y min_horno es tiempo de
         HORNO ocupado (minutos de maquina de esa estacion), que es el driver
         con el que se reparte el gas y la energia: no es el tiempo de la
         persona parada frente al horno. */
      p.min_maquina=R4((p.pasos||[]).reduce((a,x)=>a+(x.minm_lote||0),0)/L+mqS+mqR);
      p.min_horno=R4((p.pasos||[]).filter(x=>x.estacion==="horno")
        .reduce((a,x)=>a+(x.minm_lote||0),0)/L);
      p.min_setup_lote=R4((p.pasos||[]).reduce((a,x)=>a+(x.min_setup||0),0));
    }
  });

  /* --- CIF por el driver que declara cada pool --- */
  const anios=Object.keys(D.matriz_mo||{});
  const aRef=(D.pnl&&String(D.pnl.anio))||anios[anios.length-1]||"2026";
  const demH=D.productos.reduce((s,p)=>s+(p.min_horno||0)*und(p.id,aRef),0)/12;
  const demP=D.productos.reduce((s,p)=>s+(p.min_hombre||0)*und(p.id,aRef),0)/12;
  const mH=(D.cif||[]).filter(c=>c.driver==="min_horno").reduce((s,c)=>s+c.monto_mensual,0);
  const mP=(D.cif||[]).filter(c=>c.driver!=="min_horno").reduce((s,c)=>s+c.monto_mensual,0);
  const tH=demH?mH/demH:0, tP=demP?mP/demP:0;
  (D.cif||[]).forEach(c=>{ const b=c.driver==="min_horno"?demH:demP;
    c.tasa_driver=R6(b?c.monto_mensual/b:0); c.base_driver_mensual=R2(b);
    c.driver_aplicado=c.driver==="min_horno"?"min_horno":"min_hombre"; });
  D.productos.forEach(p=>{
    p.cif=R4(tH*(p.min_horno||0)+tP*(p.min_hombre||0));
    p.neto=R4(p.precio/(1+IGV));
    p.cuf=R4((p.mp||0)+(p.mod||0)+(p.cif||0));
    p.ub=R4(p.neto-p.cuf);
    p.ub_pct=R2(p.neto?100*p.ub/p.neto:0);
    p.fc_pct=R2(p.neto?100*(p.mp||0)/p.neto:0);
    p.mod_pct=R2(p.neto?100*(p.mod||0)/p.neto:0);
    p.cif_pct=R2(p.neto?100*(p.cif||0)/p.neto:0);
    p.lotes_semana=Math.round(und(p.id,aRef)/52/(p.unidades_lote||1)*10)/10;
  });

  /* --- matriz de minutos por estacion, por año --- */
  anios.forEach(anio=>{
    const MZ={};
    D.productos.forEach(p=>{
      if(!(p.pasos||[]).length) return;
      const u=und(p.id,anio); if(!u) return;
      const L=p.unidades_lote||1, est={};
      const add=(e,mn,co,cual)=>{ const d=est[e]=est[e]||{min:0,min_producto:0,min_semi:0,min_relleno:0,costo:0};
        d.min+=mn; d["min_"+cual]+=mn; d.costo+=co; };
      (p.pasos||[]).forEach(x=>add(x.estacion,(x.minh_lote||0)/L*u,(x.minh_lote||0)*(x.tarifa||0)/L*u,"producto"));
      const N0=p.niveles||{};
      const s=(D.semielaborados||[]).find(x=>x.id===((N0.semielaborado||{}).id));
      if(s&&s.por_estacion){ const g=((N0.semielaborado||{}).gramos_por_unidad||0)/1000;
        Object.entries(s.por_estacion).forEach(([e,v])=>add(e,g*v.minh*u,g*v.mo*u,"semi")); }
      (N0.rellenos||[]).forEach(rl=>{ const R=(D.rellenos||[]).find(x=>x.id===rl.id);
        if(R&&R.por_estacion){ const g=(rl.gramos_por_unidad||0)/1000;
          Object.entries(R.por_estacion).forEach(([e,v])=>add(e,g*v.minh*u,g*v.mo*u,"relleno")); } });
      MZ[p.id]={}; Object.entries(est).forEach(([e,v])=>{
        MZ[p.id][e]={min:R4(v.min),min_producto:R4(v.min_producto),min_semi:R4(v.min_semi),
                     min_relleno:R4(v.min_relleno),costo:R4(v.costo)}; });
    });
    D.matriz_mo[anio]=MZ;
  });

  /* --- rentabilidad por canal --- */
  Object.keys(D.rentabilidad_canal||{}).forEach(anio=>{
    const out={};
    (D.canales||[]).forEach(c=>{
      let u=0,venta=0,mp=0,mod=0,cif=0;
      D.productos.forEach(p=>{
        const q=undCanal(p.id,anio,c.id); if(!q) return;
        const f=(c.factor_precio!=null?c.factor_precio:1);
        u+=q; venta+=p.neto*f*q; mp+=(p.mp||0)*q; mod+=(p.mod||0)*q; cif+=(p.cif||0)*q;
      });
      const com=venta*((c.comision_pct||0)/100), emp=u*(c.costo_empaque_extra||0);
      const ub=venta-mp-mod-cif;
      out[c.id]={u,venta:R2(venta),mp:R2(mp),mod:R2(mod),cif:R2(cif),comision:R2(com),
        empaque:R2(emp),ub:R2(ub),mc:R2(ub-com-emp),
        ub_pct:R2(venta?100*ub/venta:0),mc_pct:R2(venta?100*(ub-com-emp)/venta:0),
        ticket:R2(u?venta/u:0)};
    });
    D.rentabilidad_canal[anio]=out;
  });

  /* --- demanda y utilizacion por estacion, y el pnl --- */
  const dm={};
  Object.values(D.matriz_mo[aRef]||{}).forEach(pr=>Object.entries(pr).forEach(([e,v])=>{
    dm[e]=(dm[e]||0)+v.min/12; }));
  (D.estaciones||[]).forEach(e=>{
    e.minutos_hombre_demandados_mes=R2(dm[e.id]||0);
    e.utilizacion_pct=R2(e.minutos_hombre_disponibles_mes?100*(dm[e.id]||0)/e.minutos_hombre_disponibles_mes:0);
  });
  const RR=D.rentabilidad_canal[aRef]||{};
  const V=Object.values(RR).reduce((s,x)=>s+x.venta,0);
  const MPt=Object.values(RR).reduce((s,x)=>s+x.mp,0);
  const MOt=Object.values(RR).reduce((s,x)=>s+x.mod,0);
  const CIt=Object.values(RR).reduce((s,x)=>s+x.cif,0);
  if(D.pnl){
    D.pnl.venta_neta_mes=R2(V/12); D.pnl.materia_prima_mes=R2(MPt/12);
    D.pnl.mano_obra_directa_mes=R2(MOt/12); D.pnl.cif_mes=R2(CIt/12);
    D.pnl.utilidad_bruta_mes=R2((V-MPt-MOt-CIt)/12);
    D.pnl.gastos_operativos_mes=R2((D.gastos||[]).reduce((s,g)=>s+g.monto_mensual,0));
    D.pnl.minutos_hombre_aplicados_mes=R2(D.productos.reduce((s,p)=>s+(p.min_hombre||0)*und(p.id,aRef),0)/12);
    D.pnl.minutos_horno_mes=R2(D.productos.reduce((s,p)=>s+(p.min_horno||0)*und(p.id,aRef),0)/12);
  }
  return D;
}

/* ---------------- PROCESO PASO A PASO ----------------
   Los pasos y los tiempos ya existian, pero vivian dentro de la tarjeta de mano de
   obra, que habla de costo. Esto los muestra como lo que son para quien hornea: una
   secuencia con reloj. Ojo con la diferencia que mas se confunde:
     - minutos de PERSONA  = lo que se le paga a alguien (es lo que entra al costo)
     - RELOJ               = tiempo de calendario, que incluye las esperas
   La camara fermenta 90 minutos y al panadero le ocupa 2: el costo usa los 2, pero la
   hora a la que hay que empezar la manda el reloj. */
function relojFmt(m){ return m<90 ? N(m,0)+" min" : N(m/60,1)+" h"; }
function hhmm(min){ const t=((min%1440)+1440)%1440; const h=Math.floor(t/60), m=Math.round(t%60);
  return (h<10?"0":"")+h+":"+(m<10?"0":"")+m; }
function pasosFilas(pasos, r0){
  let r=r0||0, filas="";
  (pasos||[]).slice().sort((a,b)=>(a.orden||0)-(b.orden||0)).forEach(x=>{
    r+=(x.min_setup||0)+(x.min_proceso||0)+(x.min_espera||0);
    filas+=`<tr><td class="n" style="color:var(--ink5)">${x.orden||""}</td>
      <td><b>${esc(x.nombre||"")}</b>${x.desc?`<div style="font-size:11.5px;color:var(--ink5);margin-top:2px">${esc(x.desc)}</div>`:""}</td>
      <td><span class="bd nt">${esc(x.est_nombre||x.estacion||"")}</span></td>
      <td class="n" style="font-weight:600">${N(x.minh_lote,1)}</td>
      <td class="n" style="color:var(--ink5)">${x.min_setup!=null?N(x.min_setup,1):"—"}</td>
      <td class="n">${x.minm_lote?N(x.minm_lote,1):"—"}</td>
      <td class="n" style="color:var(--ink5)">${x.min_espera?N(x.min_espera,0):"—"}</td>
      <td class="n" style="font-family:var(--fm);font-weight:700">${relojFmt(r)}</td></tr>`;
  });
  return {filas, reloj:r};
}
function tablaPasos(pasos, r0){
  const R=pasosFilas(pasos,r0);
  const minh=(pasos||[]).reduce((s,x)=>s+(x.minh_lote||0),0);
  return {html:`<div class="tw"><table><thead><tr><th>#</th><th>Paso</th><th>Estación</th>
     <th class="n">Min persona</th><th class="n">De los cuales preparación</th><th class="n">Min máquina</th>
     <th class="n">Espera</th><th class="n">Reloj</th></tr></thead>
    <tbody>${R.filas}</tbody>
    <tfoot><tr><td></td><td>Suma de la etapa</td><td></td><td class="n">${N(minh,1)}</td>
     <td class="n"></td><td class="n"></td><td class="n"></td><td class="n">${relojFmt(R.reloj)}</td></tr></tfoot>
    </table></div>`, reloj:R.reloj, minh};
}
/* devuelve las etapas y el tiempo total de calendario de una tanda */
function procesoEtapas(p){
  const L=p.niveles||{};
  const semi=(D.semielaborados||[]).find(s=>s.id===((L.semielaborado||{}).id));
  const et=[]; let reloj=0;
  if(semi&&(semi.pasos||[]).length){

       <tbody>
        ${MN.semi?`<tr><td>Masa heredada</td><td class="n">${N(MN.semi,3)}</td><td class="n">${P(tm?100*MN.semi/tm:0,1)}</td><td class="n">${S3(MO.semi)}</td></tr>`:""}
        ${MN.relleno?`<tr><td>Relleno heredado</td><td class="n">${N(MN.relleno,3)}</td><td class="n">${P(tm?100*MN.relleno/tm:0,1)}</td><td class="n">${S3(MO.relleno)}</td></tr>`:""}

/* ---------- FICHA DE ESTACION: quien la carga y por que no cuadra ----------
   Una estacion saturada no es culpa de "la panaderia": son unos pocos productos
   que piden casi todos los minutos. Esto los ordena de mayor a menor y dice
   cuantos hacen el 80%, y cuantas unidades habria que mover para que quepa. */
function abrirEst(cid){
  const c=D.capacidad.find(x=>x.id===cid); if(!c) return;
  const MZ=D.matriz_mo[ST.anio]||{};
  const filas=D.productos.map(p=>{
    const m=(((MZ[p.id]||{})[cid])||{}).min||0, uA=und(p.id,ST.anio);
    const ps=(p.pasos||[]).filter(x=>x.estacion===cid);
    return {id:p.id, nombre:p.nombre, lote:p.unidades_lote||0,
      min:m/12, u:uA/12, minU:uA?m/uA:0, pasos:ps};
  }).filter(f=>f.min>0.4).sort((a,b)=>b.min-a.min);
  const dem=filas.reduce((s,f)=>s+f.min,0);
  const falta=dem-c.min_practica;
  // cuantos productos hacen el 80%
  let ac=0, n80=0; filas.forEach(f=>{ if(ac<80){n80++;} ac+=100*f.min/dem; });
  const SEM=4.345, perV=(D.perfil_dia||{}).viernes||0;
  const capDia=c.min_practica/SEM/6, demV=dem/SEM*perV;
  const ptos=[]; let acu=0;
  $(".mtop b").textContent="Estación · "+c.nombre;
  $("#modalBody").innerHTML=`
  <div class="kpis" style="margin-bottom:15px">
   <div class="kpi"><span class="kl">Capacidad práctica</span><div class="kv">${N(c.min_practica/60)} h</div>
     <div class="kf"><span>${N(c.min_practica)} min/mes · ${P(c.factor*100,0)} de la contratada</span></div></div>
   <div class="kpi c"><span class="kl">Lo que piden las ventas</span><div class="kv">${N(dem/60)} h</div>
     <div class="kf"><span>${N(dem)} min/mes</span></div></div>
   <div class="kpi ${falta>0?'ba':dem/c.min_practica>0.9?'wa':'ok'}"><span class="kl">Utilización</span>
     <div class="kv">${P(100*dem/c.min_practica,1)}</div>
     <div class="kf"><span>${falta>0?"faltan "+N(falta)+" min":"sobran "+N(-falta)+" min"}</span></div></div>
   <div class="kpi"><span class="kl">Productos que la usan</span><div class="kv">${filas.length}</div>
     <div class="kf"><span>${n80} hacen el 80% de la carga</span></div></div>
  </div>

  <div class="note ${falta>0?'bad':'warn'}"><b>Por qué no cuadra.</b>
   ${filas.length} productos pasan por ${esc(c.nombre)}. Entre todos piden <b>${N(dem)} minutos al mes</b>
   y la estación da <b>${N(c.min_practica)}</b>.
   ${falta>0?`Faltan <b>${N(falta)} minutos</b> (${N(falta/60,1)} horas). No es que falte un poco en todos:
     <b>${esc(filas[0].nombre)}</b> solo ya pide ${N(filas[0].min)} min (${P(100*filas[0].min/dem,0)} de la estación),
     y los ${n80} primeros se llevan el 80%. Mover esos ${n80} es lo único que cambia el número.`
    :`Queda holgura de ${N(-falta)} minutos, pero el reparto de la semana es lo que importa: ver la fila del viernes abajo.`}</div>

  <div class="card"><div class="ch"><div><h2 class="ct">Quién carga la estación</h2>
    <p class="cs">Minutos de persona al mes, de mayor a menor. La columna acumulada dice dónde está el 80%.</p></div></div>
   <div class="tw"><table><thead><tr><th>Producto</th><th class="n">Unid./mes</th><th class="n">Min. por unidad</th>
     <th class="n">Min./mes</th><th class="n">Horas/mes</th><th class="n">% estación</th><th class="n">Acumulado</th>
     <th style="width:120px">Peso</th></tr></thead>
    <tbody>${filas.map((f,i)=>{const pc=100*f.min/dem; acu+=pc;
      return `<tr class="clic" data-p="${f.id}"${acu<=80.5?' style="background:var(--g50)"':''}>
       <td style="font-weight:600">${i+1}. ${esc(f.nombre)}</td>
       <td class="n">${N(f.u)}</td><td class="n">${N(f.minU,2)}</td>
       <td class="n" style="font-weight:700">${N(f.min)}</td>
       <td class="n">${N(f.min/60,1)}</td>
       <td class="n">${P(pc,1)}</td>
       <td class="n" style="font-family:var(--fm);color:var(--ink7)">${P(acu,1)}</td>
       <td><div class="ptr" style="height:14px"><div class="pfl" style="width:${pc.toFixed(1)}%;
        background:linear-gradient(90deg,#22c55e,var(--okbar))"></div></div></td></tr>`}).join("")}</tbody>
    <tfoot><tr><td>TOTAL</td><td class="n">—</td><td class="n">—</td><td class="n">${N(dem)}</td>
      <td class="n">${N(dem/60,1)}</td><td class="n">100%</td><td class="n"></td><td></td></tr></tfoot></table></div>
   <div class="note" style="margin:12px 0 0">Clic en una fila abre la ficha del producto con sus pasos.</div></div>

  ${filas[0]&&filas[0].pasos.length?`<div class="card"><div class="ch"><div><h2 class="ct">Qué se hace acá</h2>
    <p class="cs">Los pasos de ${esc(filas[0].nombre)} que caen en esta estación, con sus minutos por lote.</p></div></div>
   <div class="tw"><table><thead><tr><th>Paso</th><th class="n">Min. persona/lote</th><th class="n">Min. máquina/lote</th>
     <th class="n">Min. persona/unidad</th></tr></thead>
    <tbody>${filas[0].pasos.map(x=>`<tr><td>${esc(x.nombre||x.paso||"—")}</td>
     <td class="n">${N(x.minh_lote,1)}</td><td class="n">${N(x.minm_lote,1)}</td>
     <td class="n">${N(x.minh_lote/(filas[0].lote||1),2)}</td></tr>`).join("")}</tbody></table></div></div>`:""}

  <div class="card"><div class="ch"><div><h2 class="ct">Qué hacer con los minutos que faltan</h2>
    <p class="cs">Tres salidas, con su número al lado. No son excluyentes.</p></div></div>
   <div class="tw"><table><thead><tr><th>Salida</th><th class="n">Cuánto</th><th>Qué significa</th></tr></thead>
    <tbody>
     <tr><td style="font-weight:600">Sumar gente</td>
      <td class="n">${falta>0?N(falta/((D.planilla||{}).minutos_disponibles_por_persona_mes||2995),2)+" FTE":"—"}</td>
      <td>${falta>0?`A ${N((D.planilla||{}).minutos_disponibles_por_persona_mes||2995)} minutos útiles por persona al mes,
       ya con el ${P(c.factor*100,0)} de capacidad práctica aplicado.`:"No hace falta."}</td></tr>
     <tr><td style="font-weight:600">Bajar el minuto por unidad</td>
      <td class="n">${falta>0?P(100*falta/dem,1):"—"}</td>
      <td>${falta>0?`Habría que recortar ese % de minuto en toda la estación. En ${esc(filas[0].nombre)}
       son ${N(filas[0].minU*falta/dem,2)} min menos por unidad.`:"—"}</td></tr>
     <tr><td style="font-weight:600">Mover volumen</td>
      <td class="n">${falta>0&&filas[0].minU?N(falta/filas[0].minU)+" u":"—"}</td>
      <td>${falta>0&&filas[0].minU?`Unidades de ${esc(filas[0].nombre)} que habría que dejar de producir al mes
       (${N(falta/filas[0].minU/SEM)} por semana) para que la estación quepa sin tocar nada más.`:"—"}</td></tr>
    </tbody></table></div>
   <div class="note ${demV>capDia?'bad':'warn'}" style="margin:12px 0 0"><b>Ojo con el viernes.</b>
    El día da ${N(capDia)} minutos y el viernes pide ${N(demV)} (${P(perV*100,0)} de la semana).
    ${demV>capDia?`<b>Ese día no cabe</b>: faltan ${N(demV-capDia)} minutos aunque el mes cierre con holgura.
      Es el día que hay que resolver, no el promedio.`:"Ese día sí cabe."}</div></div>`;
  $$("#modalBody .clic").forEach(t=>t.onclick=()=>abrir(t.dataset.p));
  $("#modal").classList.add("on"); document.body.style.overflow="hidden";
}
