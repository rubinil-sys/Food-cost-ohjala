<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Costeo · oh-jalá</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
 --g950:#102e24; --g900:#174133; --g800:#1e5442; --g700:#276953; --g100:#e3f1ec; --g50:#f2f8f5;
 --c600:#c96b2c; --c500:#e8803a; --c100:#fcecd9; --s200:#e5dfd0; --s100:#f5f1e7;
 --bg:#faf7f0; --sf:#fff; --sf2:#fcfaf5;
 --ink:#1c2421; --ink7:#3b4742; --ink5:#66736d; --line:#e4dfd3; --lineS:#cfc7b6;
 --ok:#166534; --okbg:#dcfce7; --okbar:#1f8f52; --okbd:#86efac;
 --wa:#92400e; --wabg:#fef3c7; --wabar:#d97706; --wabd:#fcd34d;
 --ba:#991b1b; --babg:#fee2e2; --babar:#dc2626; --babd:#fca5a5;
 --teal:#3f9099;
 --fs:"Plus Jakarta Sans",system-ui,sans-serif; --fd:"Fraunces",Georgia,serif; --fm:"JetBrains Mono",monospace;
 --r:14px; --rm:10px; --sh:0 2px 8px rgba(28,36,33,.06); --shm:0 8px 24px rgba(28,36,33,.09);
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--fs);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5}
button,input,select{font:inherit;color:inherit} button{cursor:pointer}
.hd{background:linear-gradient(135deg,var(--g950),var(--g900) 55%,var(--g800));color:#fff;border-top:4px solid var(--c500);box-shadow:0 4px 18px rgba(16,46,36,.22);position:sticky;top:0;z-index:40}
.hdi{max-width:1440px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.logo{width:48px;height:48px;border-radius:13px;background:linear-gradient(145deg,#f7efe2,#eadbc3);border:2px solid rgba(232,128,58,.65);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.bt{display:flex;flex-direction:column;gap:1px;min-width:0}
.bn{font-family:var(--fd);font-size:21px;font-weight:700;color:#ffeed6;letter-spacing:-.01em}
.bs{font-size:12.5px;color:rgba(255,255,255,.72)}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:rgba(232,128,58,.22);color:#ffd5b5;border:1px solid rgba(232,128,58,.45);margin-left:9px}
.hc{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cfg{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:10px}
.cfg label{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.92);white-space:nowrap}
.cfg select,.cfg input{background:#fff;color:var(--ink);border:1px solid rgba(0,0,0,.12);border-radius:7px;padding:4px 8px;font-size:13px;font-weight:600;outline:none}
.cfg input{width:62px;text-align:right;font-family:var(--fm)}
.hbtn{border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.09);color:#fff;padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.18)} .hbtn.ac{background:var(--c500);border-color:var(--c500)} .hbtn.ac:hover{background:var(--c600)}
.tabs{background:var(--sf);border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(28,36,33,.03);position:sticky;top:74px;z-index:30}
.ti{max-width:1440px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:4px;overflow-x:auto}
.tb{border:none;background:transparent;padding:13px 16px 11px;font-size:14px;font-weight:600;color:var(--ink5);border-bottom:3px solid transparent;white-space:nowrap}
.tb:hover{color:var(--g900);background:var(--sf2)} .tb.on{color:var(--g900);border-bottom-color:var(--c500);font-weight:700}
.cnt{font-family:var(--fm);font-size:11px;font-weight:700;padding:2px 6px;border-radius:999px;background:var(--s100);color:var(--ink7);margin-left:6px}
.tb.on .cnt{background:var(--c100);color:var(--c600)}
.src{margin-left:auto;font-size:11.5px;color:var(--ink5);white-space:nowrap;padding-left:12px;font-family:var(--fm)}
.wrap{max-width:1440px;margin:0 auto;padding:20px 22px 60px}
.pane{display:none} .pane.on{display:block;animation:fi .16s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:19px;margin-bottom:17px;box-shadow:var(--sh)}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:15px}
.ct{margin:0;font-family:var(--fd);font-size:19px;font-weight:700;color:var(--g950);letter-spacing:-.01em}
.cs{margin:3px 0 0;font-size:13px;color:var(--ink5);max-width:72ch}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin-bottom:17px}
@media(max-width:1120px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--sf);border:1px solid var(--line);border-top:4px solid var(--g800);border-radius:var(--rm);padding:14px 15px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:5px}
.kpi.c{border-top-color:var(--c500)} .kpi.ok{border-top-color:var(--okbar)} .kpi.wa{border-top-color:var(--wabar)} .kpi.ba{border-top-color:var(--babar)}
.kl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink5)}
.kv{font-family:var(--fm);font-size:23px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kf{font-size:12px;color:var(--ink5);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.bd{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.bd.ok{background:var(--okbg);color:var(--ok);border-color:var(--okbd)}
.bd.wa{background:var(--wabg);color:var(--wa);border-color:var(--wabd)}
.bd.ba{background:var(--babg);color:var(--ba);border-color:var(--babd)}
.bd.nt{background:var(--s100);color:var(--ink7);border-color:var(--line)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rm);background:var(--sf)}
table{width:100%;border-collapse:collapse;font-size:13.6px}
thead th{background:var(--s100);color:var(--ink7);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:10px 11px;text-align:left;border-bottom:1px solid var(--lineS);white-space:nowrap}
tbody td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none} tbody tr:hover td{background:var(--sf2)}
tfoot td{background:var(--s100);font-weight:700;padding:10px 11px;border-top:2px solid var(--lineS)}
.n{text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap} thead th.n{text-align:right}
/* Pareto */
.pb{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.pr{display:grid;grid-template-columns:30px 230px 1fr 120px;align-items:center;gap:12px}
@media(max-width:760px){.pr{grid-template-columns:28px 1fr;gap:5px}}
.pn{width:24px;height:24px;border-radius:50%;background:var(--g800);color:#fff;font-family:var(--fm);font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.pnm{font-weight:700;display:flex;flex-direction:column}
.psb{font-size:11.5px;font-weight:500;color:var(--ink5)}
.ptr{position:relative;height:26px;background:var(--s100);border-radius:7px;border:1px solid var(--line);overflow:hidden}
.pfl{height:100%;background:linear-gradient(90deg,var(--c500),var(--c600));border-radius:6px;transition:width .3s}
.pac{position:absolute;top:0;bottom:0;border-left:2px dashed var(--g950);opacity:.45}
.pmt{display:flex;align-items:center;justify-content:flex-end;gap:7px;font-family:var(--fm);font-size:13px;font-weight:700}
/* cascada */
.casc{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.cr{display:grid;grid-template-columns:250px 1fr 108px 74px;align-items:center;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
@media(max-width:860px){.cr{grid-template-columns:1fr 100px;gap:4px}.cr .cbar{display:none}}
.clb{font-weight:600;display:flex;flex-direction:column}
.cnt2{font-size:11.5px;color:var(--ink5);font-weight:400;max-width:46ch}
.cbar{height:22px;background:var(--s100);border-radius:5px;overflow:hidden;display:flex}
.cseg{height:100%}
.cseg.costo{background:linear-gradient(90deg,#f0a868,var(--c600))}
.cseg.gap{background:repeating-linear-gradient(45deg,var(--babar),var(--babar) 6px,#e46a6a 6px,#e46a6a 12px)}
.cseg.gasto{background:linear-gradient(90deg,#7fa8a0,#4a7f73)}
.cseg.rest{background:var(--g100)}
/* productos */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:15px}
.pc{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:0;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.pci{height:104px;background:linear-gradient(160deg,var(--s100),#efe7d4);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.pci svg{width:118px;height:78px}
.pcb{padding:14px 15px 15px;display:flex;flex-direction:column;gap:9px;flex:1}
.pcn{font-family:var(--fd);font-size:16px;font-weight:700;color:var(--g950);line-height:1.25}
.stk{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--s200)}
.stk i{display:block;height:100%}
.lg{display:flex;gap:11px;flex-wrap:wrap;font-size:11px;color:var(--ink7)}
.lg i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
.mrow{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0}
.mrow b{font-family:var(--fm)}
.note{font-size:12.5px;color:var(--ink7);background:var(--s100);border:1px dashed var(--lineS);border-radius:9px;padding:10px 13px;margin-bottom:14px}
.note.warn{background:#fffaf0;border-color:var(--wabd);color:var(--wa)}
.note.bad{background:#fff5f5;border-color:var(--babd);color:var(--ba)}
.btn{border:1px solid var(--lineS);background:var(--sf);color:var(--ink);padding:7px 13px;border-radius:9px;font-size:13.2px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--s100);border-color:var(--ink5)}
.btn.pri{background:var(--g800);border-color:var(--g800);color:#fff} .btn.pri:hover{background:var(--g900)}
.btn.cr{background:var(--c500);border-color:var(--c500);color:#fff} .btn.cr:hover{background:var(--c600)}
.btn.sm{padding:4px 9px;font-size:12.2px;border-radius:7px}
.sl{width:100%;accent-color:var(--c500)}
.simg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}
.fg{display:flex;flex-direction:column;gap:5px}
.inp{width:100%;padding:8px 11px;border:1px solid var(--lineS);border-radius:8px;background:#fff;
 font-family:var(--fm);font-size:14px;font-weight:700;text-align:right;outline:none;color:var(--ink)}
.inp:focus{border-color:var(--c600)}
.fg label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink7)}
.spark{display:flex;align-items:flex-end;gap:3px;height:48px}
.spark i{flex:1;background:linear-gradient(180deg,var(--g700),var(--g900));border-radius:2px 2px 0 0;min-height:2px;display:block}
.spark i.hl{background:linear-gradient(180deg,var(--c500),var(--c600))}
.mlab{display:flex;gap:3px;font-size:9.5px;color:var(--ink5);font-family:var(--fm);margin-top:3px}
.mlab span{flex:1;text-align:center}

.clic{cursor:pointer}
tr.clic:hover td{background:var(--g50)!important}
.pci.clic:hover{background:linear-gradient(160deg,#efe7d4,#e6dcc6)}
.modal{position:fixed;inset:0;background:rgba(16,46,36,.55);z-index:90;display:none;overflow-y:auto;padding:26px 16px}
.modal.on{display:block}
.mbox{max-width:1040px;margin:0 auto;background:var(--bg);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.mtop{position:sticky;top:0;background:var(--g900);color:#fff;padding:11px 18px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.mtop b{font-family:var(--fd);font-size:15px}
.mclose{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;width:30px;height:30px;border-radius:8px;font-size:17px;line-height:1}
.mclose:hover{background:rgba(255,255,255,.3)}
.mbody{padding:18px}
.dhead{display:flex;gap:18px;align-items:center;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:16px;box-shadow:var(--sh);flex-wrap:wrap}
.dill{width:150px;height:96px;background:linear-gradient(160deg,var(--s100),#efe7d4);border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dill svg{width:124px;height:80px}
.dhead>div:nth-child(2){flex:1;min-width:230px}
.dkpi{text-align:center;padding:11px 17px;background:var(--g50);border:1px solid #b7dfd0;border-radius:11px}
.dkpi .kv{font-size:27px}

#gate{display:none;position:fixed;inset:0;z-index:200;background:linear-gradient(140deg,var(--g950),var(--g800) 60%,#2b6b55);
 align-items:center;justify-content:center;padding:24px;overflow-y:auto}
#gate.on{display:flex}
.gbox{background:var(--bg);border-radius:18px;padding:34px 30px;max-width:390px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.35);text-align:center}
.glogo{width:62px;height:62px;margin:0 auto 12px;border-radius:16px;background:linear-gradient(145deg,#f7efe2,#eadbc3);
 border:2px solid rgba(232,128,58,.6);display:flex;align-items:center;justify-content:center}
.gtit{font-family:var(--fd);font-size:30px;margin:0;color:var(--g950);letter-spacing:-.02em}
.gsub{margin:2px 0 20px;color:var(--ink5);font-size:13.5px}
.gcampo{text-align:left;margin-bottom:12px}
.gcampo label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink7);margin-bottom:4px}
.gcampo input{width:100%;padding:10px 12px;border:1px solid var(--lineS);border-radius:9px;background:#fff;font-size:14.5px;outline:none}
.gcampo input:focus{border-color:var(--g700);box-shadow:0 0 0 3px rgba(39,105,83,.15)}
.gbtn{width:100%;padding:11px;border-radius:10px;border:none;background:var(--g800);color:#fff;font-weight:700;font-size:14.5px;margin-top:8px}
.gbtn:hover{background:var(--g900)} .gbtn:disabled{opacity:.6}
.gbtn.sec{background:transparent;color:var(--g800);border:1px solid var(--lineS)} .gbtn.sec:hover{background:var(--s100)}
.gerr{background:var(--babg);color:var(--ba);border:1px solid var(--babd);border-radius:9px;padding:9px 12px;font-size:13px;margin:4px 0 2px;text-align:left}
.gok{background:var(--okbg);color:var(--ok);border:1px solid var(--okbd);border-radius:9px;padding:9px 12px;font-size:13px;margin:4px 0 2px;text-align:left}
.gpie{margin-top:16px;font-size:12px;color:var(--ink5);border-top:1px solid var(--line);padding-top:12px}
.gestado{font-size:42px;margin:6px 0 10px}
.gtxt{font-size:14px;color:var(--ink7);line-height:1.55;margin:0 0 14px}
.usr{display:flex;align-items:center;gap:9px}
.uav{width:33px;height:33px;border-radius:50%;background:var(--c500);color:#fff;display:flex;align-items:center;
 justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.uinfo{display:flex;flex-direction:column;line-height:1.2;margin-right:4px}
.uinfo b{font-size:13px;color:#fff} .uinfo span{font-size:11px;color:rgba(255,255,255,.7)}
.cell-sel{width:100%;border:1px solid var(--lineS);border-radius:7px;padding:5px 8px;font-size:13px;background:#fff}
body.solo-lectura .sl,body.solo-lectura #bReset,body.solo-lectura #bSave{pointer-events:none;opacity:.45}
body.solo-lectura #p-esc .btn.cr::after{content:" (solo lectura)";font-weight:400}
.niv{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:11px;background:var(--sf)}
.nivh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.nivn{font-family:var(--fm);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
 background:var(--c600);color:#fff;padding:2px 8px;border-radius:999px}
#bandaVista{position:fixed;top:0;left:0;right:0;z-index:9000}
body.en-prueba{padding-top:42px}
#salidaFija{position:fixed;right:20px;bottom:20px;z-index:9001;background:var(--g900);color:#fff;
 border:2px solid #fff;border-radius:13px;padding:11px 17px;font-family:inherit;font-size:14px;font-weight:700;
 cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:flex-start;gap:2px}
#salidaFija small{font-size:11px;font-weight:500;opacity:.8}
#salidaFija:hover{background:#000}
.bv{background:linear-gradient(90deg,var(--c600),var(--c500));color:#fff;padding:9px 18px;font-size:13px;
 display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.bv b{font-weight:800}
.bv button{margin-left:auto;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.45);
 border-radius:7px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.bv button:hover{background:rgba(255,255,255,.32)}
.paso{display:flex;gap:14px;align-items:flex-start;padding:17px 0;border-top:1px solid var(--line)}
.paso:first-of-type{border-top:none}
.pn{width:27px;height:27px;border-radius:50%;background:var(--g900);color:#fff;display:flex;align-items:center;
 justify-content:center;font-family:var(--fm);font-size:13px;font-weight:700;flex:0 0 27px}
.paso h3{margin:0 0 3px;font-size:15.5px;font-weight:700;color:var(--ink)}
.paso p{margin:0 0 10px;font-size:13px;color:var(--ink5)}
.paqs{display:flex;gap:10px;flex-wrap:wrap}
.paq{text-align:left;background:#fff;border:1.5px solid var(--lineS);border-radius:11px;padding:11px 13px;
 cursor:pointer;font-family:inherit;min-width:190px;max-width:260px;flex:1 1 190px;transition:border-color .12s,background .12s}
.paq:hover{border-color:var(--c500)}
.paq.on{border-color:var(--c600);background:#fff7ef;box-shadow:0 0 0 2px rgba(201,107,44,.14)}
.paq b{display:block;font-size:14px;color:var(--ink)}
.paq span{display:block;font-family:var(--fm);font-size:11px;color:var(--c600);font-weight:700;margin:1px 0 5px}
.paq em{display:block;font-style:normal;font-size:12px;color:var(--ink5);line-height:1.4}
.paq.ch{min-width:220px}
.paqt{margin-top:7px;font-size:11px;color:var(--ink7);border-top:1px solid var(--line);padding-top:6px;line-height:1.45}
details summary{font-weight:700;color:var(--ink);outline:none}
details summary::marker{color:var(--c600)}
.clicd:hover{background:var(--s100)}
.tfil{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.tfil input[type=search]{flex:1 1 180px;min-width:150px;max-width:280px;padding:7px 11px;border:1px solid var(--lineS);
 border-radius:8px;background:#fff;font-size:13px;font-family:inherit;outline:none}
.tfil input[type=search]:focus{border-color:var(--c600)}
.tfil select{padding:7px 9px;border:1px solid var(--lineS);border-radius:8px;background:#fff;font-size:12.5px;
 font-weight:600;font-family:inherit;outline:none;max-width:200px}
.tcount{font-family:var(--fm);font-size:11.5px;color:var(--ink5);margin-left:auto}
th.ord{color:var(--c600)}
th.ord::after{content:" \2195";font-size:10px}
.gi{display:flex;gap:6px;padding:0 0 9px;flex-wrap:wrap}
.gb{background:transparent;border:1.5px solid var(--lineS);color:var(--ink7);padding:6px 15px;border-radius:999px;
 font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .12s}
.gb:hover{border-color:var(--c500);color:var(--ink)}
.gb.on{background:var(--g900);border-color:var(--g900);color:#fff}
.flujo{display:flex;align-items:stretch;gap:5px;flex-wrap:wrap;margin-top:6px}
.fcaja{flex:1 1 140px;min-width:132px;text-align:left;background:#fff;border:1.5px solid var(--lineS);border-radius:11px;
 padding:11px 12px;cursor:pointer;font-family:inherit;transition:border-color .12s,transform .12s}
.fcaja:hover{border-color:var(--c600);transform:translateY(-1px)}
.fcaja b{display:block;font-size:14px;color:var(--ink)}
.fcaja em{display:block;font-style:normal;font-family:var(--fm);font-size:10.5px;color:var(--c600);font-weight:700;margin:2px 0 5px}
.fcaja span{display:block;font-size:11.5px;color:var(--ink5);line-height:1.4}
.fflecha{display:flex;align-items:center;color:var(--c500);font-size:21px;font-weight:700}
.mruta{border-top:1px solid var(--line);padding:14px 0}
.mruta:first-of-type{border-top:none}
.mq{font-family:var(--fd);font-size:15.5px;font-weight:700;color:var(--ink);margin-bottom:9px}
.mpasos{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.mpaso{text-align:left;background:var(--s100);border:1px solid var(--lineS);border-radius:9px;padding:8px 11px;
 cursor:pointer;font-family:inherit;flex:1 1 150px;min-width:140px;transition:all .12s}
.mpaso:hover{background:#fff;border-color:var(--c600)}
.mpaso b{display:block;font-size:12.5px;color:var(--ink)}
.mpaso span{display:block;font-size:11px;color:var(--ink5);margin-top:2px;line-height:1.35}
.mflecha{display:flex;align-items:center;color:var(--c500);font-weight:700}
.mr{font-size:12.5px;color:var(--ink7);margin-top:9px;padding-left:11px;border-left:2.5px solid var(--c500);line-height:1.5}
.msec{margin-top:15px}
.msec:first-of-type{margin-top:4px}
.msh{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:7px}
.msh b{font-family:var(--fd);font-size:16px;color:var(--g900)}
.msh span{font-size:12.5px;color:var(--ink5)}
.mfila{cursor:pointer}
.mfila:hover{background:var(--s100)}
</style>

try{const g=localStorage.getItem("ohjala_v2");if(g){const o=JSON.parse(g);
  if(o.esc)ST.esc=o.esc; if(o.aj)Object.assign(ST.aj,o.aj); if(o.igv)ST.igv=o.igv; if(o.insumos)Object.assign(ST.insumos,o.insumos); if(o.estaciones)Object.assign(ST.estaciones,o.estaciones); if(o.stock)Object.assign(ST.stock,o.stock); if(o.inv)ST.inv=o.inv; if(o.invHist)ST.invHist=o.invHist;}}catch(e){}

function factorMP(p){
  // la variacion de cada familia pesa segun cuanto aporta esa familia al costo del producto
  if(!p.receta||!p.receta.length) return 1;
  const tot=p.receta.reduce((s,r)=>s+r.costo_por_unidad,0);
  if(!tot) return 1;
  let f=0;
  p.receta.forEach(r=>{
    const fam=r.familia==='relleno'?'relleno':(INS_FAM[r.nombre]||r.familia||'otros');
    const v=(ST.insumos[fam]!=null?ST.insumos[fam]:0)/100;
    f += (r.costo_por_unidad/tot)*(1+v);
  });
  return f;
}
function factorMOD(p){
  if(!p.pasos||!p.pasos.length) return 1;
  const tot=p.pasos.reduce((s,x)=>s+x.costo_unid,0);
  if(!tot) return 1;
  let f=0;
  p.pasos.forEach(x=>{ const v=(ST.estaciones[x.estacion]||0)/100; f += (x.costo_unid/tot)*(1+v); });
  return f;
}
function calc(p){
  const a=ST.aj[p.id]||{precio:0,mp:0,mod:0,manual:null};
  // si hay precio escrito a mano, ese manda sobre el deslizador
  const neto = (a.manual!=null && a.manual>0) ? a.manual/(1+ST.igv/100) : p.neto*(1+a.precio/100);
  const mp=p.mp*factorMP(p), mod=p.mod*factorMOD(p), cif=p.cif;
  const cuf=mp+mod+cif;
  return {...p, neto, mp, mod, cif, cuf, ub:neto-cuf,
    ub_pct:neto?100*(neto-cuf)/neto:0, fc_pct:neto?100*mp/neto:0,
    mod_pct:neto?100*mod/neto:0, cif_pct:neto?100*cif/neto:0,
    precio:neto*(1+ST.igv/100),
    sugerido:(mp+mod+cif)/(1-UMB.ub_min/100)*(1+ST.igv/100)};
}
const TODOS=()=>D.productos.map(calc);
const FPREC={}; D.canales.forEach(c=>FPREC[c.id]=(c.factor_precio!=null?c.factor_precio:1));
/* venta neta de un producto: cada canal tiene su propio precio, el corporativo compra con descuento */
function vta(p,anio,mes){
  const v=D.ventas[p.id]?.[anio]; if(!v) return 0;
  const ms=mes?[String(mes)]:Object.keys(v);
  let s=0; ms.forEach(m=>Object.entries(v[m]||{}).forEach(([ca,u])=>{s+=p.neto*(FPREC[ca]!=null?FPREC[ca]:1)*u;}));
  return s;
}
/* precio medio realmente cobrado, mezclando canales */
function netoPond(p,anio){const u=und(p.id,anio); return u?vta(p,anio)/u:p.neto;}
function und(pid,anio,mes){
  const v=D.ventas[pid]?.[anio]; if(!v) return 0;
  if(mes) return Object.values(v[mes]||{}).reduce((s,x)=>s+x,0);
  return Object.values(v).reduce((s,m)=>s+Object.values(m).reduce((a,b)=>a+b,0),0);
}
function canales(pid,anio,mes){
  const v=D.ventas[pid]?.[anio]?.[mes]||{}; return v;
}

/* ---------------- RECARGO AL CONSUMO ----------------
   DL 25988, 5a disp. complementaria: hasta 13% del valor del servicio, acordado con los
   trabajadores. No es remuneracion, no es base del IGV y no es ingreso de la empresa:
   se recauda del cliente y se reparte entre el personal. Lo que SI mueve la utilidad es
   (a) la demanda, porque el cliente paga mas, (b) la planilla de atencion que se puede
   financiar con el recargo, y (c) la comision del POS, que cobra sobre el total cargado. */
let RCG={pct:0, canales:{tienda:true,pedidos:false,rappi:false}, cobertura:0, elast:-0.6, reparto:'todos', regla:'igual'};
const ATENCION=["vendedora_mostrador_1","vendedora_mostrador_2","barista_barra"];

/* la bolsa: como se reparte lo recaudado entre el personal */
function repartoRC(recaudado){
  const q=(D.planilla.puestos||[]).filter(x=>RCG.reparto==='todos'?true:ATENCION.indexOf(x.id)>=0);
  if(!q.length||!recaudado) return {q:[],filas:[]};
  let pesos;
  if(RCG.regla==='igual')      pesos=q.map(()=>1);
  else if(RCG.regla==='sueldo')pesos=q.map(x=>x.sueldo_bruto);
  else                         pesos=q.map(x=>RCG.reparto==='todos'?(ATENCION.indexOf(x.id)>=0?2:1):1);
  const tot=pesos.reduce((a,b)=>a+b,0);
  const filas=q.map((x,i)=>{const mes=recaudado/12*pesos[i]/tot;
    return {...x, mes, pct:100*mes/x.sueldo_bruto};});
  return {q,filas};
}

function calcRC(){
  const ps=TODOS().map(p=>({...p,u:und(p.id,ST.anio)}));
  const U0=ps.reduce((s,p)=>s+p.u,0);
  // todo sale de la misma fuente que UB1: la rentabilidad por canal, que ya usa el precio de cada canal
  const RC0=D.rentabilidad_canal[ST.anio]||{};
  const V0=D.canales.reduce((s,c)=>s+((RC0[c.id]||{}).venta||0),0);
  const UB0=D.canales.reduce((s,c)=>s+((RC0[c.id]||{}).ub||0),0);
  const CUF0=D.canales.reduce((s,c)=>s+((RC0[c.id]||{}).mp||0)+((RC0[c.id]||{}).mod||0)+((RC0[c.id]||{}).cif||0),0);
  // misma definicion de resultado operativo que la pestana del EBITDA: mermas y capacidad ociosa incluidas
  const MZrc=D.matriz_mo[ST.anio]||{};
  const OCIOrc=D.capacidad.reduce((s,c)=>{
    const dem=D.productos.reduce((a,p)=>a+((MZrc[p.id]||{})[c.id]?.min||0),0)/12;
    return s+Math.max(0,c.min_practica-dem)*c.tarifa;},0)*12;
  const MERMArc=CUF0*0.05;
  const G=D.gastos.reduce((s,g)=>s+g.monto_mensual,0)*12+OCIOrc+MERMArc;
  const rc=RCG.pct/100;
  // el recargo sube el precio final en rc/(1+igv): no paga IGV
  const dPrecio=rc/(1+ST.igv/100);
  const plAt=(D.planilla.puestos||[]).filter(q=>ATENCION.indexOf(q.id)>=0)
    .reduce((s,q)=>s+q.costo_cargado_mes,0)*12;

  const cs=D.canales.map(c=>{
    const R=(D.rentabilidad_canal[ST.anio]||{})[c.id]||{};
    const aplica=!!RCG.canales[c.id];
    const v0=R.venta||0, u0=R.u||0, ub0=R.ub||0;
    const caida=aplica?RCG.elast*dPrecio:0;          // negativo
    const u1=u0*(1+caida), v1=v0*(1+caida), ub1=ub0*(1+caida);
    const recaudado=aplica?v1*rc:0;
    const posExtra=aplica?recaudado*(c.pct_con_tarjeta/100)*((c.comision_pos_pct||0)/100):0;
    return {id:c.id, nombre:c.nombre, aplica, v0, u0, ub0, v1, u1, ub1,
      ticket0:R.ticket||0, ticketCliente:(R.ticket||0)*(1+ST.igv/100)*(1+(aplica?rc/(1+ST.igv/100)*(1+ST.igv/100)/(1+ST.igv/100):0)),
      recaudado, posExtra, caida};
  });
  const V1=cs.reduce((s,c)=>s+c.v1,0), U1=cs.reduce((s,c)=>s+c.u1,0);
  const UB1=cs.reduce((s,c)=>s+c.ub1,0);
  const recaudado=cs.reduce((s,c)=>s+c.recaudado,0);
  const posExtra=cs.reduce((s,c)=>s+c.posExtra,0);
  const ahorro=Math.min(recaudado, plAt*RCG.cobertura/100);
  const UO0=UB0-G, UO1=UB1-G+ahorro-posExtra;
  return {ps,cs,V0,V1,U0,U1,UB0,UB1,UO0,UO1,G,rc,dPrecio,recaudado,posExtra,ahorro,plAt};
}

/* ---------------- FILTRAR Y ORDENAR CUALQUIER TABLA ----------------
   Se aplica sola a toda tabla con mas de 5 filas: una caja de busqueda,
   un selector por cada columna que se repite, y orden al tocar la cabecera. */
function numCel(t){
  const s=String(t).replace(/\s/g,"").replace(/S\/|%|u$/g,"").replace(/,/g,"");
  const n=parseFloat(s.replace(/[^\d.,-]/g,""));
  return Number.isFinite(n)?n:null;
}
function tablasFiltrables(raiz){
  (raiz||document).querySelectorAll(".tw > table").forEach(tb=>{
    if(tb.dataset.f) return;
    const tbody=tb.querySelector("tbody"); if(!tbody) return;
    const filas=[...tbody.querySelectorAll("tr")].filter(r=>!r.querySelector("td[colspan]"));
    if(filas.length<6) return;
    tb.dataset.f="1";
    const ths=[...tb.querySelectorAll("thead th")];
    const tw=tb.parentElement;
    // columnas que se repiten -> se vuelven selector
    const cands=[];
    ths.forEach((th,i)=>{
      if(th.classList.contains("n")) return;
      const vals=filas.map(r=>(r.children[i]?.textContent||"").trim().split("\n")[0].trim()).filter(Boolean);
      const uniq=[...new Set(vals)];
      if(uniq.length>1 && uniq.length<=14 && uniq.length<=vals.length*0.7) cands.push({i,n:th.textContent.trim(),uniq});
    });
    const bar=document.createElement("div"); bar.className="tfil";
    bar.innerHTML=`<input type="search" placeholder="Buscar en la tabla..."/>
      ${cands.slice(0,3).map(c=>`<select data-c="${c.i}"><option value="">${esc(c.n)}: todos</option>
        ${c.uniq.sort().map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("")}</select>`).join("")}
      <span class="tcount"></span>
      <button class="btn sm" data-reset>Limpiar</button>`;
    tw.parentElement.insertBefore(bar,tw);
    const cuenta=bar.querySelector(".tcount");
    const aplicar=()=>{
      const q=(bar.querySelector("input").value||"").toLowerCase().trim();
      const sel=[...bar.querySelectorAll("select")].map(s=>({i:+s.dataset.c,v:s.value}));
      let n=0;
      filas.forEach(r=>{
        let ok=!q || r.textContent.toLowerCase().includes(q);
        sel.forEach(s=>{ if(ok&&s.v){ const t=(r.children[s.i]?.textContent||"").trim().split("\n")[0].trim();
          if(t!==s.v) ok=false; }});
        r.style.display=ok?"":"none"; if(ok)n++;
      });
      cuenta.textContent=n===filas.length?`${filas.length} filas`:`${n} de ${filas.length}`;
      cuenta.style.color=n===filas.length?"var(--ink5)":"var(--c600)";
    };
    bar.querySelector("input").oninput=aplicar;
    bar.querySelectorAll("select").forEach(s=>s.onchange=aplicar);
    bar.querySelector("[data-reset]").onclick=()=>{bar.querySelector("input").value="";
      bar.querySelectorAll("select").forEach(s=>s.value=""); aplicar();};
    // ordenar al tocar la cabecera
    ths.forEach((th,i)=>{
      th.style.cursor="pointer"; th.title="Ordenar por "+th.textContent.trim();
      th.onclick=()=>{
        const asc=th.dataset.o!=="asc"; ths.forEach(x=>{x.dataset.o="";x.classList.remove("ord");});
        th.dataset.o=asc?"asc":"desc"; th.classList.add("ord");
        const orden=filas.slice().sort((a,b)=>{
          const ta=(a.children[i]?.textContent||"").trim(), tb2=(b.children[i]?.textContent||"").trim();
          const na=numCel(ta), nb=numCel(tb2);
          if(na!==null&&nb!==null) return asc?na-nb:nb-na;
          return asc?ta.localeCompare(tb2,"es"):tb2.localeCompare(ta,"es");
        });
        orden.forEach(r=>tbody.appendChild(r));
      };
    });
    aplicar();
  });
}

function refrescarTarjeta(pid){
  const c=document.querySelector(`.pc[data-card="${pid}"]`); if(!c) return;
  const p=calc(D.productos.find(x=>x.id===pid));
  const a=ST.aj[pid], w=x=>Math.max(0,100*x/p.neto).toFixed(2);
  const set=(k,v)=>{const el=c.querySelector(`[data-k="${k}"]`); if(el) el.innerHTML=v;};
  set("precio",S(p.precio));
  set("mp",`${S(p.mp)} · ${P(p.fc_pct,1)}`);
  set("mod",`${S(p.mod)} · ${p.min_hombre?N(p.min_hombre,1)+" min":"—"}`);
  set("ub",`${S(p.ub)} <span class="bd ${p.ub_pct>=48?'ok':p.ub_pct>=42?'wa':'ba'}">${P(p.ub_pct,1)}</span>`);
  const b1=c.querySelector('[data-k="bmp"]'), b2=c.querySelector('[data-k="bmod"]'), b3=c.querySelector('[data-k="bcif"]');
  if(b1)b1.style.width=w(p.mp)+"%"; if(b2)b2.style.width=w(p.mod)+"%"; if(b3)b3.style.width=w(p.cif)+"%";
  ["precio","mp","mod"].forEach(k=>{const e=c.querySelector(`[data-sl="${k}"]`);
    if(e) e.textContent=(a[k]>0?"+":"")+a[k]+"%";});
  set("sug",S(p.sugerido));
  const d=c.querySelector('[data-k="dif"]');
  if(d){ const bajo=p.precio<p.sugerido;
    d.style.color=bajo?"var(--ba)":"var(--ok)";
    d.textContent=bajo?`Está ${S(p.sugerido-p.precio)} por debajo (${P(100*(p.sugerido/p.precio-1),1)})`
                      :`Tiene ${S(p.precio-p.sugerido)} de holgura sobre el objetivo`; }
  const ip=c.querySelector('input[data-precio]');
  if(ip && document.activeElement!==ip) ip.value=p.precio.toFixed(2);
}

/* ---------- FICHA DE ESTACION: quien la carga y por que no cuadra ----------
   Una estacion saturada no es culpa de "la panaderia": son unos pocos productos
   que piden casi todos los minutos. Esto los ordena de mayor a menor y dice
   cuantos hacen el 80%, y cuantas unidades habria que mover para que quepa. */
function abrirEst(cid){
  const c=D.capacidad.find(x=>x.id===cid); if(!c) return;
  const MZ=D.matriz_mo[ST.anio]||{};
  const filas=D.productos.map(p=>{
    const m=(((MZ[p.id]||{})[cid])||{}).min||0, uA=und(p.id,ST.anio);
    const ps=(p.pasos||[]).filter(x=>x.estacion===cid);
    return {id:p.id, nombre:p.nombre, lote:p.unidades_lote||0,
      min:m/12, u:uA/12, minU:uA?m/uA:0, pasos:ps};
  }).filter(f=>f.min>0.4).sort((a,b)=>b.min-a.min);
  const dem=filas.reduce((s,f)=>s+f.min,0);
  const falta=dem-c.min_practica;
  // cuantos productos hacen el 80%
  let ac=0, n80=0; filas.forEach(f=>{ if(ac<80){n80++;} ac+=100*f.min/dem; });
  const SEM=4.345, perV=(D.perfil_dia||{}).viernes||0;
  const capDia=c.min_practica/SEM/6, demV=dem/SEM*perV;
  const ptos=[]; let acu=0;
  $(".mtop b").textContent="Estación · "+c.nombre;
  $("#modalBody").innerHTML=`
  <div class="kpis" style="margin-bottom:15px">
   <div class="kpi"><span class="kl">Capacidad práctica</span><div class="kv">${N(c.min_practica/60)} h</div>
     <div class="kf"><span>${N(c.min_practica)} min/mes · ${P(c.factor*100,0)} de la contratada</span></div></div>
   <div class="kpi c"><span class="kl">Lo que piden las ventas</span><div class="kv">${N(dem/60)} h</div>
     <div class="kf"><span>${N(dem)} min/mes</span></div></div>
   <div class="kpi ${falta>0?'ba':dem/c.min_practica>0.9?'wa':'ok'}"><span class="kl">Utilización</span>
     <div class="kv">${P(100*dem/c.min_practica,1)}</div>
     <div class="kf"><span>${falta>0?"faltan "+N(falta)+" min":"sobran "+N(-falta)+" min"}</span></div></div>
   <div class="kpi"><span class="kl">Productos que la usan</span><div class="kv">${filas.length}</div>
     <div class="kf"><span>${n80} hacen el 80% de la carga</span></div></div>
  </div>

  <div class="note ${falta>0?'bad':'warn'}"><b>Por qué no cuadra.</b>
   ${filas.length} productos pasan por ${esc(c.nombre)}. Entre todos piden <b>${N(dem)} minutos al mes</b>
   y la estación da <b>${N(c.min_practica)}</b>.
   ${falta>0?`Faltan <b>${N(falta)} minutos</b> (${N(falta/60,1)} horas). No es que falte un poco en todos:
     <b>${esc(filas[0].nombre)}</b> solo ya pide ${N(filas[0].min)} min (${P(100*filas[0].min/dem,0)} de la estación),
     y los ${n80} primeros se llevan el 80%. Mover esos ${n80} es lo único que cambia el número.`
    :`Queda holgura de ${N(-falta)} minutos, pero el reparto de la semana es lo que importa: ver la fila del viernes abajo.`}</div>

  <div class="card"><div class="ch"><div><h2 class="ct">Quién carga la estación</h2>
    <p class="cs">Minutos de persona al mes, de mayor a menor. La columna acumulada dice dónde está el 80%.</p></div></div>
   <div class="tw"><table><thead><tr><th>Producto</th><th class="n">Unid./mes</th><th class="n">Min. por unidad</th>
     <th class="n">Min./mes</th><th class="n">Horas/mes</th><th class="n">% estación</th><th class="n">Acumulado</th>
     <th style="width:120px">Peso</th></tr></thead>
    <tbody>${filas.map((f,i)=>{const pc=100*f.min/dem; acu+=pc;
      return `<tr class="clic" data-p="${f.id}"${acu<=80.5?' style="background:var(--g50)"':''}>
       <td style="font-weight:600">${i+1}. ${esc(f.nombre)}</td>
       <td class="n">${N(f.u)}</td><td class="n">${N(f.minU,2)}</td>
       <td class="n" style="font-weight:700">${N(f.min)}</td>
       <td class="n">${N(f.min/60,1)}</td>
       <td class="n">${P(pc,1)}</td>
       <td class="n" style="font-family:var(--fm);color:var(--ink7)">${P(acu,1)}</td>
       <td><div class="ptr" style="height:14px"><div class="pfl" style="width:${pc.toFixed(1)}%;
        background:linear-gradient(90deg,#22c55e,var(--okbar))"></div></div></td></tr>`}).join("")}</tbody>
    <tfoot><tr><td>TOTAL</td><td class="n">—</td><td class="n">—</td><td class="n">${N(dem)}</td>
      <td class="n">${N(dem/60,1)}</td><td class="n">100%</td><td class="n"></td><td></td></tr></tfoot></table></div>
   <div class="note" style="margin:12px 0 0">Clic en una fila abre la ficha del producto con sus pasos.</div></div>

  ${filas[0]&&filas[0].pasos.length?`<div class="card"><div class="ch"><div><h2 class="ct">Qué se hace acá</h2>
    <p class="cs">Los pasos de ${esc(filas[0].nombre)} que caen en esta estación, con sus minutos por lote.</p></div></div>
   <div class="tw"><table><thead><tr><th>Paso</th><th class="n">Min. persona/lote</th><th class="n">Min. máquina/lote</th>
     <th class="n">Min. persona/unidad</th></tr></thead>
    <tbody>${filas[0].pasos.map(x=>`<tr><td>${esc(x.nombre||x.paso||"—")}</td>
     <td class="n">${N(x.minh_lote,1)}</td><td class="n">${N(x.minm_lote,1)}</td>
     <td class="n">${N(x.minh_lote/(filas[0].lote||1),2)}</td></tr>`).join("")}</tbody></table></div></div>`:""}

  <div class="card"><div class="ch"><div><h2 class="ct">Qué hacer con los minutos que faltan</h2>
    <p class="cs">Tres salidas, con su número al lado. No son excluyentes.</p></div></div>
   <div class="tw"><table><thead><tr><th>Salida</th><th class="n">Cuánto</th><th>Qué significa</th></tr></thead>
    <tbody>
     <tr><td style="font-weight:600">Sumar gente</td>
      <td class="n">${falta>0?N(falta/((D.planilla||{}).minutos_disponibles_por_persona_mes||2995),2)+" FTE":"—"}</td>
      <td>${falta>0?`A ${N((D.planilla||{}).minutos_disponibles_por_persona_mes||2995)} minutos útiles por persona al mes,
       ya con el ${P(c.factor*100,0)} de capacidad práctica aplicado.`:"No hace falta."}</td></tr>
     <tr><td style="font-weight:600">Bajar el minuto por unidad</td>
      <td class="n">${falta>0?P(100*falta/dem,1):"—"}</td>
      <td>${falta>0?`Habría que recortar ese % de minuto en toda la estación. En ${esc(filas[0].nombre)}
       son ${N(filas[0].minU*falta/dem,2)} min menos por unidad.`:"—"}</td></tr>
     <tr><td style="font-weight:600">Mover volumen</td>
      <td class="n">${falta>0&&filas[0].minU?N(falta/filas[0].minU)+" u":"—"}</td>
      <td>${falta>0&&filas[0].minU?`Unidades de ${esc(filas[0].nombre)} que habría que dejar de producir al mes
       (${N(falta/filas[0].minU/SEM)} por semana) para que la estación quepa sin tocar nada más.`:"—"}</td></tr>
    </tbody></table></div>
   <div class="note ${demV>capDia?'bad':'warn'}" style="margin:12px 0 0"><b>Ojo con el viernes.</b>
    El día da ${N(capDia)} minutos y el viernes pide ${N(demV)} (${P(perV*100,0)} de la semana).
    ${demV>capDia?`<b>Ese día no cabe</b>: faltan ${N(demV-capDia)} minutos aunque el mes cierre con holgura.
      Es el día que hay que resolver, no el promedio.`:"Ese día sí cabe."}</div></div>`;
  $$("#modalBody .clic").forEach(t=>t.onclick=()=>abrir(t.dataset.p));
  $("#modal").classList.add("on"); document.body.style.overflow="hidden";
}

    const m=Object.values(MZ[p.id]||{}).reduce((s,x)=>s+x.min,0)/12;
    const c=Object.values(MZ[p.id]||{}).reduce((s,x)=>s+x.costo,0)/12;
    return {...p, u:und(p.id,ST.anio), minMes:m, costoMes:c};
  });
  const totDem=ps.reduce((s,p)=>s+p.minMes,0);
  const cap=D.capacidad.map(c=>{
    const dem=ps.reduce((s,p)=>s+((MZ[p.id]||{})[c.id]?.min||0),0)/12;
    return {...c, dem, util:c.min_practica?100*dem/c.min_practica:0,
            holgura:c.min_practica-dem, utilTeo:c.min_teorica?100*dem/c.min_teorica:0};
  });
  const totPrac=cap.reduce((s,c)=>s+c.min_practica,0), totTeo=cap.reduce((s,c)=>s+c.min_teorica,0);
  const totHolg=totPrac-totDem;

/* desglose de una linea del P&L */
function verDesglose(key){
  const box=$("#desgl"); if(!box) return;
  if(box.dataset.k===key){ box.innerHTML=""; box.dataset.k=""; return; }
  box.dataset.k=key;
  const ps=TODOS().map(p=>({...p,u:und(p.id,ST.anio)/12}));
  const V=ps.reduce((s,p)=>s+vta(p,ST.anio)/12,0);
  const fila=(c,m,n)=>`<tr><td style="font-weight:600">${esc(c)}</td>
    <td class="n" style="font-weight:600">${S0(m)}</td><td class="n">${P(100*m/V,2)}</td>
    <td style="font-size:12.5px;color:var(--ink7)">${esc(n||"")}</td></tr>`;
  const caja=(tit,sub,filas,total)=>`<div class="card" style="margin:9px 0 0;background:var(--s100);border-color:var(--c600)">
    <div class="ch"><div><h2 class="ct" style="font-size:16px">${esc(tit)}</h2><p class="cs">${sub}</p></div>
     <button class="btn sm" id="cerrarD">Cerrar</button></div>
    <div class="tw"><table><thead><tr><th>Concepto</th><th class="n">S/ al mes</th><th class="n">% venta</th><th>Nota</th></tr></thead>
     <tbody>${filas}</tbody><tfoot><tr><td>TOTAL</td><td class="n">${S0(total)}</td>
      <td class="n">${P(100*total/V,2)}</td><td></td></tr></tfoot></table></div></div>`;
  let html="";
  if(key==="cuf"){
    const MP=ps.reduce((s,p)=>s+p.mp*p.u,0), MO=ps.reduce((s,p)=>s+p.mod*p.u,0);
    const CI=ps.reduce((s,p)=>s+p.cif*p.u,0);
    const pl=D.planilla.puestos||[];
    const dir=pl.filter(q=>q.clase==="MOD_PROD"||q.clase==="MOD_FOH").reduce((s,q)=>s+q.costo_cargado_mes,0);
    html=caja("Qué hay dentro del costo de ventas",
      "Los tres elementos del costeo: lo que se compra, lo que se trabaja y lo que cuesta tener la planta andando.",
      fila("Materia prima y empaque",MP,"Insumos valorizados con merma, rellenos y empaque")+
      fila("Mano de obra directa",MO,"Minutos cronometrados × tarifa de cada estación. Planilla directa disponible: "+S0(dir))+
      D.cif.map(c=>fila("CIF · "+c.concepto,c.monto_mensual,"Driver: "+c.driver)).join(""),
      MP+MO+D.cif.reduce((s,c)=>s+c.monto_mensual,0));
  } else if(key==="canal"){
    const E={}; D.canales.forEach(c=>E[c.id]=econCanal(c,ST.anio));
    html=caja("Comisiones por canal","Lo que se lleva cada plataforma. No depende del pan sino de por dónde salió.",
      D.canales.map(c=>fila(c.nombre,E[c.id].com/12,
        c.comision_pct?P(c.comision_pct,0)+" de su venta bruta · ticket "+S((E[c.id].ticket||0)):"Sin comisión de plataforma")).join(""),
      D.canales.reduce((s,c)=>s+E[c.id].com/12,0));
  } else if(key==="ocio"){
    const MZ=D.matriz_mo[ST.anio]||{};
    const pools=D.capacidad.map(c=>{
      const dem=ps.reduce((s,p)=>s+((MZ[p.id]||{})[c.id]?.min||0),0)/12;
      return {...c, holg:Math.max(0,c.min_practica-dem), ocio:Math.max(0,c.min_practica-dem)*c.tarifa};});
    html=caja("Capacidad pagada y no usada, estación por estación",
      "Minutos que están en la planilla y no los pidió ningún producto. NIC 2 párr. 13: gasto del periodo, no costo del pan.",
      pools.map(c=>fila(c.nombre,c.ocio,N(c.holg)+" minutos libres × S/ "+N(c.tarifa,4)+" por minuto")).join(""),
      pools.reduce((s,c)=>s+c.ocio,0));
  } else if(key==="deuda"){
    html=caja("Gastos financieros","Solo el interés. La amortización baja deuda y no pasa por el resultado.",
      (D.deuda.lineas||[]).map(l=>fila(l.nombre,l.interes_mes,l.para)).join(""),
      (D.deuda.lineas||[]).reduce((s,l)=>s+l.interes_mes,0));
  } else if(key==="ir"){
    html=`<div class="note" style="margin:9px 0 0"><b>El impuesto está desglosado en su propia tarjeta más abajo</b>,
      con los dos tramos del régimen MYPE y cuánto falta para pasarse al régimen general.</div>`;
    box.innerHTML=html; return;
  } else if(key.startsWith("g:")){
    const id=key.slice(2), g=D.gastos.find(x=>x.id===id);
    const det=(D.detalle_gastos||{})[id];
    if(det==="planilla"){
      const pl=(D.planilla.puestos||[]).filter(q=>q.clase==="GA_PLANILLA"||q.clase==="GV_PLANILLA");
      html=caja("Planilla de estructura, persona por persona",
        "Administración, comercial y tienda. Ninguno de estos sueldos entra al costo del pan.",
        pl.map(q=>fila(q.puesto,q.costo_cargado_mes,q.area+" · sueldo "+S0(q.sueldo_bruto)+" + cargas y movilidad")).join(""),
        pl.reduce((s,q)=>s+q.costo_cargado_mes,0));
    } else if(Array.isArray(det)){
      html=caja(g.concepto,"Desglose de la línea.",det.map(x=>fila(x.c,x.m,x.n)).join(""),
        det.reduce((s,x)=>s+x.m,0));
    } else {
      html=`<div class="note" style="margin:9px 0 0">Esta línea no tiene desglose cargado todavía.</div>`;
    }
  }
  box.innerHTML=html;
  if($("#cerrarD")) $("#cerrarD").onclick=()=>{box.innerHTML="";box.dataset.k="";};
  box.scrollIntoView({block:"nearest",behavior:"smooth"});
}

function vUtil(){
  const ps=TODOS().map(p=>({...p,u:und(p.id,ST.anio)/12}));
  const MZ=D.matriz_mo[ST.anio]||{};
  const V=ps.reduce((s,p)=>s+vta(p,ST.anio)/12,0);
  const MP=ps.reduce((s,p)=>s+p.mp*p.u,0);
  const MO=ps.reduce((s,p)=>s+p.mod*p.u,0), CI=ps.reduce((s,p)=>s+p.cif*p.u,0);
  const CUF=MP+MO+CI, MB=V-CUF;                    // piso 1 y margen bruto

  // linea 7: capacidad pagada y no usada, por pool. NO se reparte a productos (NIC 2, parr. 13)
  const pools=D.capacidad.map(c=>{
    const dem=ps.reduce((s,p)=>s+((MZ[p.id]||{})[c.id]?.min||0),0)/12;
    return {...c, dem, holg:Math.max(0,c.min_practica-dem), ocio:Math.max(0,c.min_practica-dem)*c.tarifa};
  });
  const OCIO=pools.reduce((s,c)=>s+c.ocio,0);
  const MERMA=CUF*0.05;                            // provision de mermas, 5% del costo de ventas

  // la bolsa que no se reparte al producto: estructura + periodo
  const gl=id=>(D.gastos.find(g=>g.id===id)||{}).monto_mensual||0;
  const ADM=gl("go_administracion"), ALQ=gl("go_alquiler_tienda"), SER=gl("go_servicios");
  const MKT=gl("go_marketing"), CON=gl("go_contabilidad");
  const COMD=gl("go_comisiones_delivery");
  const DEP=(D.cif.find(c=>/depreciac/i.test(c.concepto))||{}).monto_mensual||0;
  const PEAJE=OCIO+D.gastos.filter(g=>g.id!=="go_comisiones_delivery").reduce((s,g)=>s+g.monto_mensual,0);
  // la estructura ya no es una lista fija: sale de los gastos, menos las comisiones del canal
  const GEST=D.gastos.filter(g=>g.id!=="go_comisiones_delivery");
  const ESTR=GEST.reduce((s,g)=>s+g.monto_mensual,0);
  const PEAJE2=OCIO+ESTR;
  const EBIT=MB-MERMA-COMD-OCIO-ESTR;
  const DEPREP=(((D.detalle_gastos||{}).go_reparto)||[]).filter(x=>/epreciac/i.test(x.c)).reduce((s,x)=>s+x.m,0);
  const DEPT=DEP+DEPREP;
  const EBITDA=EBIT+DEPT;                          // se devuelve la depreciacion ya cargada arriba
  const GF=(D.deuda||{}).gasto_financiero_mes||0;
  const UAI=EBIT-GF;
  const TOPE=(D.impuestos||{}).uit*((D.impuestos||{}).tramo_1_uit||15);
  const uaiA=UAI*12;
  const IR=UAI>0?(Math.min(uaiA,TOPE)*D.impuestos.tasa_tramo_1/100+Math.max(0,uaiA-TOPE)*D.impuestos.tasa_exceso/100)/12:0;
  const NETO=UAI-IR;

  // reparto del peaje POR RECURSOS (minutos), no por venta
  const minProd=p=>Object.values(MZ[p.id]||{}).reduce((s,x)=>s+x.min,0)/12;
  const totMin=ps.reduce((s,p)=>s+minProd(p),0);
  const pr=ps.map(p=>{
    const m=minProd(p), vP=vta(p,ST.anio)/12, uP=p.u||0;
    const nt=uP?vP/uP:p.neto;
    const peaje=totMin?PEAJE*m/totMin:0;           // su parte de la bolsa, por recursos
    const merma=p.cuf*0.05*uP;
    const piso1=p.cuf;
    const piso2=uP?piso1+(totMin?OCIO*m/totMin:0)/uP:piso1;
    const piso3=uP?piso2+(merma+peaje)/uP:piso2;
    return {...p, m, vP, nt, uP, peaje, peajeU:uP?peaje/uP:0, piso1, piso2, piso3,
      mcU:nt-p.mp, mc:(nt-p.mp)*uP, aporte:(nt-piso1)*uP,
      pagaPeaje:nt>=piso3, pierde:nt<p.mp,
      pctMin:totMin?100*m/totMin:0, pctVta:V?100*vP/V:0};
  }).sort((a,b)=>b.aporte-a.aporte);

  const f=(lb,v,nota,t)=>`<div class="cr"><div class="clb"><span>${lb}</span><span class="cnt2">${nota}</span></div>
    <div class="cbar"><div class="cseg ${t}" style="width:${(100*v/V).toFixed(2)}%"></div>
     <div class="cseg rest" style="width:${(100-100*v/V).toFixed(2)}%"></div></div>
    <div class="n" style="color:var(--ba)">−${S0(v)}</div><div class="n">${P(100*v/V,1)}</div></div>`;
  const fd=(lb,v,nota,t,key)=>`<div class="cr clicd" data-d="${key}" style="cursor:pointer">
    <div class="clb"><span>${lb} <span style="color:var(--c600);font-size:11px">ver detalle ›</span></span><span class="cnt2">${nota}</span></div>
    <div class="cbar"><div class="cseg ${t}" style="width:${(100*v/V).toFixed(2)}%"></div>
     <div class="cseg rest" style="width:${(100-100*v/V).toFixed(2)}%"></div></div>
    <div class="n" style="color:var(--ba)">−${S0(v)}</div><div class="n">${P(100*v/V,1)}</div></div>`;
  const h=(lb,v,nota,fuerte)=>`<div class="cr" style="border-top:2px solid var(--lineS);border-bottom:none;padding:11px 0;${fuerte?'background:var(--g50)':''}">
    <div class="clb"><span style="font-family:var(--fd);font-weight:700;font-size:${fuerte?'17px':'15px'}">${lb}</span><span class="cnt2">${nota}</span></div>

    <div class="n" style="font-weight:700;font-size:${fuerte?'17px':'15px'}">${S0(v)}</div>
    <div class="n"><span class="bd ${v>0?(fuerte?'ok':'wa'):'ba'}">${P(100*v/V,1)}</span></div></div>`;

  $("#p-util").innerHTML=`
  <div class="note"><b>Dónde para el costo del producto y dónde empieza la bolsa.</b>
   Materia prima, mano de obra y CIF son el <b>piso del producto</b>: lo que cuesta fabricarlo.

   <div class="kpi ok"><span class="kl">Margen bruto</span><div class="kv">${P(100*MB/V,1)}</div>
     <div class="kf"><span>${S0(MB)}</span></div></div>
   <div class="kpi wa"><span class="kl">Peaje (bolsa no repartible)</span><div class="kv">${P(100*PEAJE/V,1)}</div>
     <div class="kf"><span>${S0(PEAJE)}</span></div></div>
   <div class="kpi ${NETO>0?'ok':'ba'}"><span class="kl">Resultado neto</span><div class="kv">${P(100*NETO/V,1)}</div>
     <div class="kf"><span>${S0(NETO)} · EBITDA ${P(100*EBITDA/V,1)}</span></div></div>
  </div>

  <div class="card"><div class="ch"><div><h2 class="ct">El P&amp;L por líneas, hasta el resultado neto</h2>
    <p class="cs">La misma escalera que usa el motor de costeo: primero lo que es del producto, después lo que es del periodo.
     <b>Haz clic en cualquier línea con flecha para ver qué hay dentro.</b></p></div>
   <span class="bd nt">mes promedio</span></div>
   <div class="casc">
    ${h("1 · Venta neta sin IGV",V,"Cada canal a su propio precio",false)}
    ${fd("2 · Costo de ventas (CUF)",CUF,"Materia prima + minutos cronometrados × tarifa + CIF por driver","costo","cuf")}
    ${h("3 · MARGEN BRUTO",MB,"Hasta acá llega el costo del producto",true)}
    ${f("4 · Provisión de mermas",MERMA,"5% del costo de ventas: lo que se rompe, se pasa o se regala","costo")}
    ${fd("5 · Comisiones de plataforma",COMD,"Rappi. No es costo del pan: es costo del canal","gasto","canal")}
    ${fd("6 · Capacidad pagada y no usada",OCIO,"Línea 7 del motor. NO se reparte a productos (NIC 2, párr. 13)","gasto","ocio")}
    ${GEST.map((g,k)=>fd((7+k)+" · "+esc(g.concepto),g.monto_mensual,"","gasto","g:"+g.id)).join("")}
    ${h((7+GEST.length)+" · RESULTADO OPERATIVO (EBIT)",EBIT,"Antes de intereses e impuestos",false)}
    ${fd((8+GEST.length)+" · Gastos financieros",GF,"Intereses de la línea de capital de trabajo y del leasing","gasto","deuda")}
    ${h((9+GEST.length)+" · UTILIDAD ANTES DE IMPUESTOS",UAI,"",false)}
    ${fd((10+GEST.length)+" · Impuesto a la renta",IR,esc(D.impuestos.regimen),"gasto","ir")}
    ${h((11+GEST.length)+" · RESULTADO NETO",NETO,"Lo que de verdad queda para el dueño",true)}
   </div>
   <div id="desgl" style="margin-top:4px"></div>
   <div class="kpis" style="margin-top:17px">
    <div class="kpi ${EBITDA>0?'ok':'ba'}"><span class="kl">EBITDA</span><div class="kv">${P(100*EBITDA/V,1)}</div>
      <div class="kf"><span>${S0(EBITDA)} = EBIT + ${S0(DEPT)} de depreciación</span></div></div>

      <td>Materia prima real + minutos cronometrados × tarifa de mano de obra + minutos × tarifa de cada pool de CIF.</td>
      <td>Valorizar inventario, el costo de ventas del P&amp;L, y ver si una receta se encareció. Es lo único <b>medido</b>.</td>
      <td>No dice si el precio es suficiente: todavía no tiene nada del negocio.</td></tr>
     <tr><td style="font-weight:700">2 · Costo de producción pleno</td>
      <td>CUF + la capacidad pagada que no se usó.</td>
      <td>Decisiones de precio de largo plazo: si la planta está a media máquina, el pan "verdadero" cuesta más.</td>
      <td><b>No valoriza inventario ni entra al costo de ventas.</b> La NIC 2 párr. 13 lo prohíbe expresamente.</td></tr>
     <tr><td style="font-weight:700">3 · Costo pleno</td>
      <td>Piso 2 + mermas + gastos de operación, repartidos <b>por capas separadas</b> (tienda / servir / estructura).</td>
      <td>Una venta corporativa al costo. Es el número de "cuánto me cuesta de verdad atender a este cliente".</td>
      <td>No se construye con un solo porcentaje sobre el precio: eso esconde quién consume qué.</td></tr>
     <tr style="background:var(--g50)"><td style="font-weight:700">4 · Precio piso<div style="font-size:11px;font-weight:400;color:var(--ink5)">hay dos, no uno</div></td>

      <td>El incremental es el mínimo para llenar capacidad ociosa (un pedido puntual). El pleno es el mínimo para un negocio permanente.</td>
      <td>Vender siempre al incremental quiebra la empresa: nadie estaría pagando los fijos.</td></tr>
    </tbody></table></div>
   <div class="note warn" style="margin:13px 0 0"><b>La regla que ordena todo esto.</b>
    NIC 2, párrafo 13: el costo indirecto fijo se distribuye según la <b>capacidad normal</b>, y
    "el importe de costos indirectos fijos distribuido a cada unidad de producción no se incrementará como consecuencia
    de un nivel bajo de producción, ni por la existencia de capacidad ociosa.
    Los costos indirectos no distribuidos se reconocerán como gastos del periodo en que han sido incurridos".
    Traducido: <b>la capacidad que pagaste y no usaste es gasto del mes, no costo del pan</b>. Por eso la línea 6 de arriba

  <div class="card"><div class="ch"><div><h2 class="ct">La bolsa en acción: cuánto aporta cada producto al peaje</h2>

    <tfoot><tr><td>TOTAL</td><td class="n">${N(pr.reduce((s,p)=>s+p.uP,0))}</td><td class="n">100%</td><td class="n">100%</td>
      <td class="n">${S0(pr.reduce((s,p)=>s+p.aporte,0))}</td>

   <div class="note" style="margin:13px 0 0"><b>Cómo se lee esta tabla.</b>
    Las tres columnas que importan son <b>% de la venta</b>, <b>% de los minutos</b> y <b>sobra/falta</b>.
    Cuando un producto pesa más en minutos que en venta, está consumiendo más planta de la que paga: ese es el subsidio cruzado
    que el reparto por ventas esconde y el reparto por recursos destapa.
    ${(()=>{const sub=pr.filter(p=>p.pctMin>p.pctVta*1.2).sort((a,b)=>(b.pctMin-b.pctVta)-(a.pctMin-a.pctVta));

      <td class="n">${S0(CON)}</td><td class="n">${P(100*CON/V,1)}</td>

function vVta(){
  const ps=TODOS();
  const mesSel=+ST.mes;
  const porMes={}; for(let m=1;m<=12;m++){porMes[m]=ps.reduce((s,p)=>s+vta(p,ST.anio,m),0);}
  const maxM=Math.max(...Object.values(porMes));
  // consumo de materia prima del mes elegido
  const cons={};
  ps.forEach(p=>{const u=und(p.id,ST.anio,String(mesSel));
    p.receta.forEach(r=>{const k=r.nombre;
      cons[k]=cons[k]||{nombre:r.nombre,familia:r.familia,cant:0,costo:0,unidad:r.unidad,prods:new Set()};
      const porU = r.cant_lote && p.unidades_lote && r.tipo==='masa' ? r.cant_lote/p.unidades_lote : r.cant_lote;
      cons[k].cant += (porU||0)*u; cons[k].costo += r.costo_por_unidad*u; cons[k].prods.add(p.nombre);});});
  const lista=Object.values(cons).sort((a,b)=>b.costo-a.costo);
  const totMP=lista.reduce((s,x)=>s+x.costo,0);
  const per=D.perfil, dias=["lunes","martes","miercoles","jueves","viernes","sabado","domingo"];
  const nom=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  const ventaMes=porMes[mesSel]||0, sem=ventaMes/4.345;
  $("#p-vta").innerHTML=`
  <div class="note">Ventas del año ${ST.anio}. Elige un mes para ver exactamente cuánta materia prima consumió.</div>
  <div class="card"><div class="ch"><div><h2 class="ct">Venta mes a mes</h2>
    <p class="cs">Clic en una barra para cambiar el mes del análisis.</p></div>
    <div class="cfg" style="background:var(--s100);border-color:var(--line)">
     <label style="color:var(--ink7)">Mes</label>
     <select id="selMes">${[...Array(12)].map((_,i)=>`<option value="${i+1}" ${i+1===mesSel?"selected":""}>${MES[i+1]}</option>`).join("")}</select></div></div>
   <div class="spark">${Object.entries(porMes).map(([m,v])=>
     `<i class="${+m===mesSel?'hl':''}" data-m="${m}" style="height:${maxM?Math.max(4,100*v/maxM):4}%" title="${MES[+m]}: ${S0(v)}"></i>`).join("")}</div>
   <div class="mlab">${Object.keys(porMes).map(m=>`<span>${MES[+m]}</span>`).join("")}</div>
   <div class="tw" style="margin-top:14px"><table><thead><tr><th>Producto</th>
     ${[...Array(12)].map((_,i)=>`<th class="n">${MES[i+1]}</th>`).join("")}<th class="n">Año</th></tr></thead>
    <tbody>${ps.map(p=>`<tr><td style="font-weight:600">${esc(p.nombre)}</td>
      ${[...Array(12)].map((_,i)=>{const u=und(p.id,ST.anio,String(i+1));
        return `<td class="n" ${i+1===mesSel?'style="background:var(--g50);font-weight:700"':''}>${u?N(u):"—"}</td>`}).join("")}
      <td class="n" style="font-weight:700">${N(und(p.id,ST.anio))}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>VENTA NETA</td>${Object.entries(porMes).map(([m,v])=>
      `<td class="n" ${+m===mesSel?'style="background:var(--g100)"':''}>${S0(v)}</td>`).join("")}
      <td class="n">${S0(Object.values(porMes).reduce((a,b)=>a+b,0))}</td></tr></tfoot></table></div></div>

  <div class="card"><div class="ch"><div><h2 class="ct">Consumo de materia prima · ${MES[mesSel]} ${ST.anio}</h2>
    <p class="cs">Cuánto se compró de cada insumo para producir lo que se vendió ese mes, y qué parte del gasto representa.</p></div>
    <div><span class="bd ok">${S0(totMP)} en insumos</span></div></div>
   <div class="tw"><table><thead><tr><th style="width:34px">#</th><th>Insumo</th><th>Familia</th>
     <th class="n">Cantidad</th><th class="n">Costo</th><th class="n">% del gasto</th><th class="n">Acum.</th><th>Va en</th></tr></thead>
    <tbody>${(()=>{let a=0;return lista.map((x,i)=>{const pc=100*x.costo/totMP;a+=pc;
      return `<tr><td class="n" style="color:var(--ink5)">${i+1}</td>
       <td style="font-weight:600">${esc(x.nombre)}</td><td><span class="bd nt">${esc(x.familia)}</span></td>
       <td class="n">${N(x.cant,x.unidad==='und'?0:0)} ${esc(x.unidad)}</td>
       <td class="n" style="font-weight:600">${S(x.costo)}</td><td class="n">${P(pc,1)}</td>
       <td class="n"><span class="bd ${a<=80?'ok':'nt'}">${P(a,0)}</span></td>
       <td style="font-size:11.5px;color:var(--ink5)">${esc([...x.prods].slice(0,2).join(", "))}${x.prods.size>2?` +${x.prods.size-2}`:""}</td></tr>`}).join("")})()}</tbody>
    <tfoot><tr><td colspan="4">TOTAL MATERIA PRIMA DE ${esc(MES[mesSel].toUpperCase())}</td>
      <td class="n">${S0(totMP)}</td><td class="n">100%</td><td colspan="2"></td></tr></tfoot></table></div></div>

  <div class="card"><div class="ch"><div><h2 class="ct">Reparto por día de semana</h2>
    <p class="cs">Pan de Shabat: viernes y sábado concentran la venta. Aplicado sobre una semana promedio de ${MES[mesSel]}.</p></div>
    <span class="bd wa">estimado</span></div>
   <div class="tw"><table><thead><tr><th>Día</th><th class="n">% de la semana</th><th class="n">Venta neta</th><th class="n">Materia prima</th></tr></thead>
    <tbody>${dias.map((d,i)=>`<tr${i===4||i===5?' style="background:var(--g50)"':''}>

      <td class="n">${S0(sem*(per[d]||0))}</td><td class="n">${S0(totMP/4.345*(per[d]||0))}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>SEMANA</td><td class="n">100%</td><td class="n">${S0(sem)}</td><td class="n">${S0(totMP/4.345)}</td></tr></tfoot></table></div></div>`;
  $("#selMes").onchange=e=>{ST.mes=e.target.value;vVta();};
  $$("#p-vta .spark i").forEach(b=>b.onclick=()=>{ST.mes=b.dataset.m;vVta();});
}

function vTablero(){
  const ps=TODOS(), R=D.rentabilidad_canal[ST.anio]||{};
  const porMes={}, porMesCanal={}, uMes={}, uMesCanal={};
  for(let m=1;m<=12;m++){
    porMes[m]=0; porMesCanal[m]={}; uMes[m]=0; uMesCanal[m]={};
    D.canales.forEach(c=>{porMesCanal[m][c.id]=0; uMesCanal[m][c.id]=0;});
    ps.forEach(p=>{const cs=D.ventas[p.id]?.[ST.anio]?.[String(m)]||{};
      Object.entries(cs).forEach(([ca,u])=>{

    return {venta:v,u};};
  const dat=D.canales.map(c=>{
    const {venta,u}=vC(c);
    const upt=(TC[c.id]||{}).und_por_ticket||1;
    const tx=u/upt;
    const meta=mes?(META[c.id]||{})[mes]||0:Object.values(META[c.id]||{}).reduce((a,b)=>a+b,0);
    const mcPct=E[c.id].mc_pct||0;
    return {...c, venta,u,tx, upt, ticket:tx?venta/tx:0, uxt:upt, meta,
      cumpl:meta?100*venta/meta:0, mc:venta*mcPct/100, mcPct};
  });
  const V=dat.reduce((s,c)=>s+c.venta,0), U=dat.reduce((s,c)=>s+c.u,0);
  const TX=dat.reduce((s,c)=>s+c.tx,0), MT=dat.reduce((s,c)=>s+c.meta,0);

  $("#p-ventas").innerHTML=`

/* ---------------- INVENTARIO Y PEDIDOS ----------------
   Dos cosas distintas que se usan juntas: contar lo que hay, y pedir lo que falta.
   El consumo sale del mismo modelo de recetas, así que lo teórico y lo contado
   se pueden restar y eso es la merma. */
let IV={fam:"", frec:"", q:"", ciego:false, cobertura:7, prov:""};
function consumoDiario(){
  // gramos (o unidades) de cada insumo que se van por día, según las ventas del año
  const porIns={};
  TODOS().forEach(p=>{
    const u=und(p.id,ST.anio)/365;
    (p.receta||[]).forEach(r=>{
      const porU = r.cant_lote && p.unidades_lote && r.tipo!=="empaque" ? r.cant_lote/p.unidades_lote : r.cant_lote;
      porIns[r.nombre]=(porIns[r.nombre]||0)+(porU||0)*u;
    });
  });
  return porIns;
}
function invEstado(){
  const CD=consumoDiario();
  const cont=(ST.inv&&ST.inv.conteos)||{};
  return D.insumos.map(i=>{
    const dia=CD[i.nombre]||0;                       // en unidad de receta
    const diaC=dia/(i.factor_conversion_compra_receta||1);   // en unidad de compra
    const stock=cont[i.id]!=null?+cont[i.id]:null;   // lo que se contó, en unidad de compra
    const dias=stock!=null&&diaC>0?stock/diaC:(diaC>0?null:999);
    const objetivo=(i.lead_time_dias||3)+(+IV.cobertura||7);
    const necesita=diaC*objetivo;
    const falta=stock!=null?Math.max(0,necesita-stock):null;
    const pres=i.presentacion_compra||1;
    const pedir=falta!=null?Math.ceil(falta/pres)*pres:null;
    let sem="nd";
    if(dias!=null){ sem = dias<(i.lead_time_dias||3)?"rojo"
      : dias<((i.lead_time_dias||3)+(i.dias_seguridad||3))?"ambar" : "verde"; }
    if(diaC<=0) sem="nd";
    return {...i, dia, diaC, stock, dias, objetivo, necesita, falta, pedir, pres,
      valor:stock!=null?stock*i.costo_compra:0, costoPedido:pedir?pedir*i.costo_compra:0, sem};
  });
}
function vInv(){
  const E=invEstado();
  const F=E.filter(x=>(!IV.fam||x.familia===IV.fam)&&(!IV.frec||x.frecuencia_conteo===IV.frec)
    &&(!IV.q||(x.nombre+" "+x.id).toLowerCase().includes(IV.q.toLowerCase())));
  const contados=E.filter(x=>x.stock!=null);
  const rojos=E.filter(x=>x.sem==="rojo"), ambar=E.filter(x=>x.sem==="ambar");
  const pedido=E.filter(x=>x.pedir>0);
  const valorInv=contados.reduce((s,x)=>s+x.valor,0);
  const costoPed=pedido.reduce((s,x)=>s+x.costoPedido,0);
  const provs=[...new Set(pedido.map(x=>x.proveedor))].sort();
  const SEM={rojo:["ba","Quiebre"],ambar:["wa","Justo"],verde:["ok","Cubierto"],nd:["nt","Sin dato"]};
  const fams=[...new Set(D.insumos.map(i=>i.familia))].sort();
  const hoy=(ST.inv&&ST.inv.fecha)||new Date().toISOString().slice(0,10);
  const resp=(ST.inv&&ST.inv.responsable)||"";

  $("#p-inv").innerHTML=`
  <div class="note">Dos cosas que se usan juntas: <b>contar lo que hay</b> y <b>pedir lo que falta</b>.
   El consumo por día no se estima a ojo: sale de las mismas recetas con las que se costea, así que lo teórico
   y lo contado se pueden restar — y esa resta es la merma.</div>

  <div class="kpis">
   <div class="kpi"><span class="kl">Insumos contados</span><div class="kv">${contados.length} / ${E.length}</div>
     <div class="kf"><span>${P(100*contados.length/E.length,0)} del almacén</span></div></div>
   <div class="kpi c"><span class="kl">Valor del inventario</span><div class="kv">${S0(valorInv)}</div>
     <div class="kf"><span>a precio de compra</span></div></div>
   <div class="kpi ${rojos.length?'ba':'ok'}"><span class="kl">En quiebre</span><div class="kv">${rojos.length}</div>
     <div class="kf"><span>no alcanzan ni el tiempo del proveedor</span></div></div>
   <div class="kpi ${ambar.length?'wa':'ok'}"><span class="kl">Justos</span><div class="kv">${ambar.length}</div>
     <div class="kf"><span>sin colchón de seguridad</span></div></div>
   <div class="kpi"><span class="kl">Pedido sugerido</span><div class="kv">${S0(costoPed)}</div>
     <div class="kf"><span>${pedido.length} insumos · ${provs.length} proveedores</span></div></div>
  </div>

  ${rojos.length?`<div class="note bad"><b>${rojos.length} ${rojos.length===1?"insumo está":"insumos están"} en quiebre.</b>
   ${rojos.slice(0,4).map(x=>`${esc(x.nombre)} (${x.dias!=null?N(x.dias,1)+" días":"sin stock"})`).join(" · ")}${rojos.length>4?" y "+(rojos.length-4)+" más":""}.
   Quiebre quiere decir que el stock no alcanza para cubrir lo que tarda el proveedor en traerlo:
   si se pide hoy, igual falta.</div>`:""}

  <div class="card"><div class="ch"><div><h2 class="ct">1 · Toma de inventario</h2>
    <p class="cs">Escribe lo que hay en almacén, en unidad de compra. Se guarda solo.</p></div>

    <div class="fg"><label>Familia</label>
     <select class="inp" id="ivFam" style="text-align:left"><option value="">Todas</option>
      ${fams.map(f=>`<option value="${esc(f)}" ${IV.fam===f?"selected":""}>${esc(f)}</option>`).join("")}</select></div>
    <div class="fg"><label>Frecuencia de conteo</label>
     <select class="inp" id="ivFrec" style="text-align:left"><option value="">Todas</option>
      ${["diaria","semanal","mensual"].map(f=>`<option value="${f}" ${IV.frec===f?"selected":""}>${f}</option>`).join("")}</select></div>
    <div class="fg"><label>Buscar</label><input class="inp" type="search" id="ivQ" value="${esc(IV.q)}" placeholder="Nombre del insumo" style="text-align:left"/></div>

     <label style="display:flex;gap:7px;align-items:center;font-size:13px;font-weight:600;cursor:pointer;padding-top:8px">

   </div>
   ${IV.ciego?`<div class="note warn" style="margin:0 0 13px"><b>Conteo a ciegas activado.</b>
    Se ocultan el stock esperado y los días de cobertura mientras se cuenta, para que el número que se escribe
    sea lo que de verdad hay y no lo que debería haber.</div>`:""}
   <div class="tw"><table><thead><tr><th>Insumo</th><th>Familia</th><th class="n">Unidad</th>
     <th class="n">Consumo por día</th>${IV.ciego?"":`<th class="n">Debería haber</th>`}
     <th class="n" style="width:120px">Hay</th>${IV.ciego?"":`<th class="n">Días</th><th>Estado</th>`}</tr></thead>
    <tbody>${F.map(x=>`<tr${x.sem==="rojo"&&!IV.ciego?' style="background:#fff5f5"':''}>
     <td style="font-weight:600">${esc(x.nombre)}
      <div style="font-size:11px;color:var(--ink5);font-weight:400">${esc(x.proveedor)} · llega en ${x.lead_time_dias} d</div></td>
     <td style="font-size:12px;color:var(--ink7)">${esc(x.familia)}
      <div style="font-size:10.5px;color:var(--ink5)">conteo ${esc(x.frecuencia_conteo)}</div></td>
     <td class="n">${esc(x.unidad_compra)}</td>
     <td class="n">${x.diaC>0?N(x.diaC,2):"—"}</td>
     ${IV.ciego?"":`<td class="n" style="color:var(--ink5)">${x.diaC>0?N(x.necesita,1):"—"}</td>`}
     <td class="n"><input class="inp" type="number" min="0" step="0.1" data-inv="${x.id}"
       value="${x.stock!=null?x.stock:""}" placeholder="—" style="padding:5px 8px;font-size:13px"/></td>
     ${IV.ciego?"":`<td class="n" style="font-weight:600">${x.dias!=null?N(x.dias,1):"—"}</td>
      <td><span class="bd ${SEM[x.sem][0]}">${SEM[x.sem][1]}</span></td>`}</tr>`).join("")}</tbody>
   </table></div>
   <div class="note" style="margin:12px 0 0">${F.length} de ${E.length} insumos con los filtros puestos.
    El consumo por día sale de las ventas del año ${ST.anio} repartidas en 365 días: es el promedio, no el viernes.

  </div>

  <div class="card"><div class="ch"><div><h2 class="ct">2 · Semáforo de cobertura</h2>

   ${contados.length?`<div class="tw"><table><thead><tr><th>Insumo</th><th class="n">Hay</th>
     <th class="n">Consumo/día</th><th class="n">Días que aguanta</th><th class="n">Llega en</th>
     <th class="n">Colchón</th><th style="width:150px">Cobertura</th><th>Estado</th></tr></thead>
    <tbody>${contados.slice().sort((a,b)=>(a.dias??999)-(b.dias??999)).map(x=>{
      const max=Math.max(x.objetivo,x.dias||0,1);
      return `<tr>
      <td style="font-weight:600">${esc(x.nombre)}</td>
      <td class="n">${N(x.stock,1)} ${esc(x.unidad_compra)}</td>
      <td class="n">${N(x.diaC,2)}</td>
      <td class="n" style="font-weight:700;color:${x.sem==="rojo"?"var(--ba)":x.sem==="ambar"?"var(--wa)":"var(--ok)"}">${x.dias!=null?N(x.dias,1):"—"}</td>

let CAN={}; D.canales.forEach(c=>CAN[c.id]={com:c.comision_pct, pos:c.comision_pos_pct, dias:c.dias_cobro});
let TASA=D.tasa_capital_mensual;
function econCanal(c, anio){
  const R=(D.rentabilidad_canal[anio]||{})[c.id]||{}, k=CAN[c.id];
  const v=R.venta||0;
  const com=v*k.com/100;
  const pos=v*(c.pct_con_tarjeta/100)*(k.pos/100);
  const fin=v*(TASA/100)*k.dias/30;
  const emp=R.empaque||0;
  const mc=(R.ub||0)-com-pos-fin-emp;
  return {...R, com, pos, fin, emp, mc, mc_pct:v?100*mc/v:0, venta:v};
}
/* ---------------- CANAL B2B (mayorista) ----------------
   No hay historia de B2B, asi que esto es una simulacion, no un reporte.
   La pregunta correcta no es "deja margen", es "deja mas que la unidad de tienda
   que desplaza", porque la planta ya corre al limite. */
let B2={desc:25, und:1500, prod:"mix", dias:30, flete:0.35, minLote:4, mcObj:30};
function calcB2B(){
  const ps=TODOS().map(p=>({...p,u:und(p.id,ST.anio)}));
  const MZ=D.matriz_mo[ST.anio]||{};
  const minU=p=>{const t=Object.values(MZ[p.id]||{}).reduce((s,x)=>s+x.min,0); const uu=und(p.id,ST.anio); return uu?t/uu:0;};
  const vivos=ps.filter(p=>p.u>0 && !p.es_reventa);
  const Utot=vivos.reduce((s,p)=>s+p.u,0);
  const d=B2.desc/100, fin=(TASA/100)*B2.dias/30;
  const linea=p=>{
    const netoB2B=p.neto*(1-d);
    const costoFin=netoB2B*fin;
    const varB2B=p.mp+B2.flete+costoFin;            // lo que solo existe si vendes la unidad
    const mc=netoB2B-varB2B;                        // margen de contribucion B2B
    const mcTienda=p.neto-p.mp;                     // tienda no paga flete ni credito
    const ubB2B=netoB2B-p.cuf-B2.flete-costoFin;    // despues de absorber MOD y CIF
    // descuento al que el MC B2B iguala al MC de tienda (punto de indiferencia con planta llena)
    const dIndif=p.neto?100*(1-(mcTienda+B2.flete)/(p.neto*(1-fin))):0;
    // descuento maximo que aun deja el MC objetivo
    const dMax=p.neto?100*(1-(p.mp+B2.flete)/(p.neto*(1-fin)*(1-B2.mcObj/100))):0;
    return {...p, netoB2B, costoFin, varB2B, mc, mc_pct:netoB2B?100*mc/netoB2B:0, mcTienda,
      mcT_pct:p.neto?100*mcTienda/p.neto:0, ubB2B, ub_pct_b2b:netoB2B?100*ubB2B/netoB2B:0,
      dIndif, dMax, minU:minU(p)};
  };
  const filas=vivos.map(linea);
  // mix: reparte las unidades B2B segun el peso actual de cada producto
  const mezcla=filas.map(f=>({...f, q:B2.prod==="mix"? B2.und*f.u/Utot : (f.id===B2.prod?B2.und:0)}));
  const vta=mezcla.reduce((s,f)=>s+f.netoB2B*f.q,0);
  const mcT=mezcla.reduce((s,f)=>s+f.mc*f.q,0);
  const ubT=mezcla.reduce((s,f)=>s+f.ubB2B*f.q,0);
  const mins=mezcla.reduce((s,f)=>s+f.minU*f.q,0);
  const capPrac=D.capacidad.reduce((s,c)=>s+c.min_practica,0);
  const demAct=vivos.reduce((s,p)=>s+minU(p)*p.u,0)/12;
  const holgura=capPrac-demAct;
  // si no cabe, cuanta venta de tienda desplaza
  const desplaza=Math.max(0,mins-holgura);
  const mcTiendaMin=mezcla.reduce((s,f)=>s+f.mcTienda*f.q,0)/(mins||1);   // S/ de MC tienda por minuto
  const mcPerdido=desplaza*mcTiendaMin;
  return {filas,mezcla,vta,mcT,ubT,mins,capPrac,demAct,holgura,desplaza,mcPerdido,
    neto:mcT-mcPerdido, fin, d};
}

       <input class="sl" type="range" min="0" max="6" step="0.1" value="${k.pos}" data-can="${c.id}" data-f="pos"/></div>`:""}
      <div class="fg"><label>Días en cobrar: <span style="font-family:var(--fm);color:var(--c600)">${k.dias}</span></label>
       <input class="sl" type="range" min="0" max="45" value="${k.dias}" data-can="${c.id}" data-f="dias"/></div>

      <div><div class="pcn" style="font-size:18px">${esc(c.nombre)}</div>

     <div class="mrow"><span>Ticket promedio</span><b>${S(r.ticket||0)}</b></div>
     <div class="mrow" style="border-top:1px dashed var(--line);padding-top:5px"><span>Utilidad bruta</span>
       <b>${S0(r.ub)} · ${P(r.ub_pct,1)}</b></div>
     ${r.com?`<div class="mrow" style="color:var(--ba)"><span>Comisión plataforma ${N(CAN[c.id].com,1)}%</span><b>−${S0(r.com)}</b></div>`:""}
     ${r.pos?`<div class="mrow" style="color:var(--ba)"><span>Comisión POS</span><b>−${S0(r.pos)}</b></div>`:""}
     ${r.emp?`<div class="mrow" style="color:var(--ba)"><span>Empaque extra</span><b>−${S0(r.emp)}</b></div>`:""}
     <div class="mrow" style="color:var(--ba)"><span>Costo financiero (${CAN[c.id].dias} d)</span><b>−${S0(r.fin)}</b></div>
     <div class="mrow" style="border-top:2px solid var(--lineS);padding-top:7px;font-size:14px">
      <span><b>Margen del canal</b></span>
      <b style="color:${r.mc_pct>=40?'var(--ok)':r.mc_pct>=25?'var(--wa)':'var(--ba)'}">${S0(r.mc)}
      <span class="bd ${r.mc_pct>=40?'ok':r.mc_pct>=25?'wa':'ba'}">${P(r.mc_pct,1)}</span></b></div>
    </div></div>`}).join("")}</div>

  ${(()=>{const t=E.tienda,r=E.rappi; if(!t||!r) return "";
   const brecha=t.mc_pct-r.mc_pct;
   const subir = r.venta? (brecha/100)/(1-CAN.rappi.com/100)*100 : 0;
   return `<div class="note bad" style="margin-top:16px"><b>Lo que cuesta vender por plataforma.</b>
    Rappi tiene mejor ticket que tienda (${S(r.ticket||0)} contra ${S(t.ticket||0)}) y una utilidad bruta casi igual,
    pero entre la comisión de ${N(CAN.rappi.com,1)}% (${S0(r.com)}), el empaque reforzado (${S0(r.emp)}) y
    ${CAN.rappi.dias} días esperando el pago (${S0(r.fin)}), su margen queda en <b>${P(r.mc_pct,1)}</b> contra
    <b>${P(t.mc_pct,1)}</b> de tienda. Son <b>${N(brecha,1)} puntos</b> de diferencia.
    Para igualar habría que subir el precio de carta del canal cerca de <b>${N(subir,0)}%</b>.</div>`})()}

  <div class="card"><div class="ch"><div><h2 class="ct">Comparación directa</h2></div></div>
   <div class="tw"><table><thead><tr><th>Concepto</th>
     ${D.canales.map(c=>`<th class="n">${c.icono} ${esc(c.nombre)}</th>`).join("")}</tr></thead>
    <tbody>
     ${[["Unidades",c=>N(E[c].u||0)],["Venta neta",c=>S0(E[c].venta)],["Ticket promedio",c=>S(E[c].ticket||0)],
        ["Materia prima",c=>S0(E[c].mp||0)],["Mano de obra",c=>S0(E[c].mod||0)],["CIF",c=>S0(E[c].cif||0)],
        ["Utilidad bruta",c=>S0(E[c].ub)],["Utilidad bruta %",c=>P(E[c].ub_pct,1)],
        ["Comisión plataforma",c=>E[c].com?"−"+S0(E[c].com):"—"],
        ["Comisión POS",c=>E[c].pos?"−"+S0(E[c].pos):"—"],
        ["Empaque extra",c=>E[c].emp?"−"+S0(E[c].emp):"—"],
        ["Días en cobrar",c=>N(CAN[c].dias)+" d"],
        ["Costo financiero",c=>"−"+S0(E[c].fin)]].map(([lb,fn])=>
       `<tr><td style="font-weight:600">${lb}</td>${D.canales.map(c=>`<td class="n">${fn(c.id)}</td>`).join("")}</tr>`).join("")}
    </tbody>
    <tfoot><tr><td>MARGEN DEL CANAL</td>${D.canales.map(c=>
      `<td class="n">${S0(E[c.id].mc)}<div><span class="bd ${E[c.id].mc_pct>=40?'ok':E[c.id].mc_pct>=25?'wa':'ba'}">${P(E[c.id].mc_pct,1)}</span></div></td>`).join("")}</tr></tfoot>

    CAN[e.target.dataset.can][e.target.dataset.f]=+e.target.value; vCanales(); vPron();});
