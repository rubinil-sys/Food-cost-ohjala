/* ---------------- PRONÓSTICO ---------------- */
let PR={crec:10, precio:0, insumos:0, rappi:0, base:'mes'};
const DIAS=[["lunes","Lun"],["martes","Mar"],["miercoles","Mié"],["jueves","Jue"],["viernes","Vie"],["sabado","Sáb"],["domingo","Dom"]];
function vPron(){
  const ps=TODOS(), MZ=D.matriz_mo[ST.anio]||{}, cap=D.capacidad;
  const g=1+PR.crec/100, fp=1+PR.precio/100, fi=1+PR.insumos/100;
  const mesSel=+ST.mes;
  const estac=(D["perfil_mes_"+ST.anio]&&D["perfil_mes_"+ST.anio][String(mesSel)])||(100/12);
  const prev=ST.anio==="2026"?"2025":"2026";
  // de dónde sale el punto de partida
  function baseUnid(pid){
    switch(PR.base){
      case "mes":      return und(pid,ST.anio,String(mesSel));
      case "promedio": return und(pid,ST.anio)/12;
      case "trim":     { let s=0,n=0; for(let k=0;k<3;k++){const m=mesSel-k; if(m>=1){s+=und(pid,ST.anio,String(m));n++;} }
                         return n?s/n:0; }
      case "anterior": return und(pid,prev,String(mesSel));
      default:         return und(pid,ST.anio,String(mesSel));
    }
  }
  const BASES={mes:`${MES[mesSel]} de ${ST.anio}`, promedio:`promedio mensual de ${ST.anio}`,
    trim:`promedio de los últimos 3 meses hasta ${MES[mesSel]}`, anterior:`${MES[mesSel]} de ${prev}`};

  let V=0,MP=0,MO=0,CI=0,MIN=0,U=0;
  const porProd=[];
  ps.forEach(p=>{
    const u=baseUnid(p.id);
    const uP=u*g;
    const minU=Object.values(MZ[p.id]||{}).reduce((s,x)=>s+x.min,0)/und(p.id,ST.anio)||0;
    U+=uP; V+=p.neto*fp*uP; MP+=p.mp*fi*uP; MO+=p.mod*uP; CI+=p.cif*uP; MIN+=minU*uP;
    if(uP>0.5) porProd.push({...p, u:uP, minU, lote:p.unidades_lote});
  });
  const SEM=4.345, dSem=V/SEM, uSem=U/SEM, minSem=MIN/SEM;
  const capPrac=cap.reduce((s,c)=>s+c.min_practica,0), capSem=capPrac/SEM;
  const util=100*MIN/capPrac;

  // comisiones y costo financiero proyectados
  const EC={}; D.canales.forEach(c=>EC[c.id]=econCanal(c,ST.anio));
  const Vanio=D.canales.reduce((s,c)=>s+EC[c.id].venta,0);
  const factorMes=V/(Vanio/12||1);
  const com=D.canales.reduce((s,c)=>s+EC[c.id].com,0)/12*factorMes*g;
  const pos=D.canales.reduce((s,c)=>s+EC[c.id].pos,0)/12*factorMes*g;
  const fin=D.canales.reduce((s,c)=>s+EC[c.id].fin,0)/12*factorMes*g;
  const G=D.gastos.filter(x=>x.id!=='go_comisiones_delivery').reduce((s,x)=>s+x.monto_mensual,0);
  const UB=V-MP-MO-CI, UO=UB-G-com-pos-fin;

  const sl=(k,lb,min,max,suf)=>`<div class="fg"><label>${lb}: <span style="font-family:var(--fm);color:var(--c600)">${PR[k]>0?"+":""}${PR[k]}${suf}</span></label>
    <input class="sl" type="range" min="${min}" max="${max}" value="${PR[k]}" data-pr="${k}"/></div>`;

  $("#p-pron").innerHTML=`
  <div class="note">Elige de dónde partir y qué supuestos aplicar. De ahí sale cuánto producir <b>cada día y cada semana</b>,
   si la cocina da abasto y qué queda después de comisiones y del costo de esperar la plata.</div>
  ${(()=>{const otras=Object.keys(BASES).filter(k=>k!==PR.base);
    const val=k=>{let t=0; ps.forEach(p=>{const u=(k==="mes"?und(p.id,ST.anio,String(mesSel)):
      k==="promedio"?und(p.id,ST.anio)/12:
      k==="trim"?(()=>{let s=0,n=0;for(let j=0;j<3;j++){const m=mesSel-j;if(m>=1){s+=und(p.id,ST.anio,String(m));n++;}}return n?s/n:0;})():
      und(p.id,prev,String(mesSel))); t+=p.neto*u;}); return t;};
    const actual=val(PR.base);
    return `<div class="note"><b>Comparación de bases.</b> Con <b>${esc(BASES[PR.base])}</b> partes de ${S0(actual)}.
      ${otras.map(k=>`Con ${esc(BASES[k])}: ${S0(val(k))} (${val(k)>actual?"+":""}${P(100*(val(k)/actual-1),1)})`).join(" · ")}.
      Elegir la base cambia el pronóstico antes de mover un solo supuesto.</div>`})()}

  <div class="card"><div class="ch"><div><h2 class="ct">Supuestos</h2>
    <p class="cs">Punto de partida: <b>${BASES[PR.base]}</b>. Ese mes pesa ${P(estac,1)} del año.</p></div>
    <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
     <div class="cfg" style="background:var(--s100);border-color:var(--line)">
      <label style="color:var(--ink7)">Base</label>
      <select id="pBase">
       <option value="mes" ${PR.base==="mes"?"selected":""}>Ese mes</option>
       <option value="trim" ${PR.base==="trim"?"selected":""}>Últimos 3 meses</option>
       <option value="promedio" ${PR.base==="promedio"?"selected":""}>Promedio del año</option>
       <option value="anterior" ${PR.base==="anterior"?"selected":""}>Mismo mes, año anterior</option></select></div>
     <div class="cfg" style="background:var(--s100);border-color:var(--line)">
      <label style="color:var(--ink7)">Mes</label>
      <select id="pMes">${[...Array(12)].map((_,i)=>`<option value="${i+1}" ${i+1===mesSel?"selected":""}>${MES[i+1]}</option>`).join("")}</select></div>
     <button class="btn" id="bPr">Volver a cero</button></div></div>
   <div class="simg">
    ${sl("crec","1 · Crecimiento en unidades",-30,60,"%")}
    ${sl("precio","2 · Ajuste de precios",-20,30,"%")}
    ${sl("insumos","3 · Variación costo de insumos",-20,40,"%")}
    ${sl("rappi","4 · Puntos de mix hacia delivery",-15,30," pp")}
   </div></div>

  <div class="kpis">
   <div class="kpi"><span class="kl">Venta del mes</span><div class="kv">${S0(V)}</div>
     <div class="kf"><span>${N(U)} unidades</span></div></div>
   <div class="kpi c"><span class="kl">Por semana</span><div class="kv">${S0(dSem)}</div>
     <div class="kf"><span>${N(uSem)} unidades</span></div></div>
   <div class="kpi ok"><span class="kl">Utilidad bruta</span><div class="kv">${P(100*UB/V,1)}</div>
     <div class="kf"><span>${S0(UB)}</span></div></div>
   <div class="kpi ${UO>0?'ok':'ba'}"><span class="kl">Utilidad operativa</span><div class="kv">${P(100*UO/V,1)}</div>
     <div class="kf"><span>${S0(UO)}</span></div></div>
   <div class="kpi ${util>100?'ba':util>95?'wa':'ok'}"><span class="kl">Uso de capacidad</span><div class="kv">${P(util,1)}</div>
     <div class="kf"><span>${N(MIN)} de ${N(capPrac)} min</span></div></div>
  </div>

  ${util>100?`<div class="note bad"><b>No alcanza la gente.</b> Faltan ${N(MIN-capPrac)} minutos al mes
    (${N((MIN-capPrac)/60)} horas). Son cerca de <b>${N((MIN-capPrac)/60/((D.planilla||{}).horas_mes||192)/0.78,1)} personas</b> más,
    o recortar el formado de los productos más pesados.</div>`
   :util>95?`<div class="note warn"><b>Al límite.</b> Quedan ${N(capPrac-MIN)} minutos de holgura al mes.
    Sin margen para un feriado ni un pedido grande de última hora.</div>`
   :`<div class="note"><b>Cabe.</b> Quedan ${N(capPrac-MIN)} minutos libres (${N((capPrac-MIN)/60)} horas), ${P(100-util,0)} de holgura.</div>`}

  <div class="card"><div class="ch"><div><h2 class="ct">Qué se vende cada día</h2>
    <p class="cs">La semana no es pareja: viernes y sábado son pan de Shabat y concentran la mayor parte.</p></div>
    <span class="bd wa">reparto estimado</span></div>
   <div class="tw"><table><thead><tr><th>Día</th><th class="n">% semana</th><th class="n">Unidades</th>
     <th class="n">Venta</th><th class="n">Materia prima</th><th class="n">Min. de persona</th><th style="width:130px">Carga del día</th></tr></thead>
    <tbody>${DIAS.map(([k,nm])=>{const f=(D.perfil_dia||{})[k]||0;
      const capDia=capSem/6;  // se produce 6 días
      const minDia=minSem*f, uso=capDia?100*minDia/capDia:0;
      return `<tr${k==='viernes'||k==='sabado'?' style="background:var(--g50)"':''}>
       <td style="font-weight:600">${nm}</td><td class="n">${P(f*100,0)}</td>
       <td class="n" style="font-weight:700">${N(uSem*f)}</td>
       <td class="n">${S0(dSem*f)}</td><td class="n">${S0(MP/SEM*f)}</td>
       <td class="n">${N(minDia)}</td>

/* ---------------- PLAN DE PRODUCCION ----------------
   Del pronostico sale cuanto se VENDE. Lo que hay que PRODUCIR es otra cosa:
     produccion = demanda del dia + lo que se quiere dejar en vitrina - lo que ya hay
   y redondeado hacia arriba al tamano del lote, porque no se hornea media tanda.
   El domingo no se produce: lo que se venda ese dia sale del horno del sabado. */
let PL={cob:30, dia:"viernes", prodDom:false};
const ORD=["lunes","martes","miercoles","jueves","viernes","sabado","domingo"];
const NOMD={lunes:"Lunes",martes:"Martes",miercoles:"Miércoles",jueves:"Jueves",viernes:"Viernes",sabado:"Sábado",domingo:"Domingo"};

function basePron(pid){
  const mesSel=+ST.mes, prev=ST.anio==="2026"?"2025":"2026";
  switch(PR.base){
    case "promedio": return und(pid,ST.anio)/12;
    case "trim":{let s=0,n=0;for(let k=0;k<3;k++){const m=mesSel-k;if(m>=1){s+=und(pid,ST.anio,String(m));n++;}}return n?s/n:0;}
    case "anterior": return und(pid,prev,String(mesSel));
    default: return und(pid,ST.anio,String(mesSel));
  }
}
function calcPlan(){
  const SEM=4.345, g=1+PR.crec/100, per=D.perfil_dia||{}, MZ=D.matriz_mo[ST.anio]||{};
  const prodDias=PL.prodDom?ORD:ORD.filter(d=>d!=="domingo");
  const items=D.productos.filter(p=>!p.es_reventa && (p.pasos||[]).length).map(p=>{
    const uMes=basePron(p.id)*g, uSem=uMes/SEM;
    const minU=Object.values(MZ[p.id]||{}).reduce((s,x)=>s+x.min,0)/(und(p.id,ST.anio)||1);
    const dias={}; let stock=ST.stock[p.id]||0; let prodTot=0, sobra=0, falt=0;
    ORD.forEach((d,i)=>{
      const dem=uSem*(per[d]||0);
      const sig=ORD[(i+1)%7], demSig=uSem*(per[sig]||0);
      // si manana no se produce, hoy hay que dejar tambien su demanda
      const puente=prodDias.indexOf(sig)<0?demSig:0;
      const obj=demSig*(PL.cob/100)+puente;
      const apertura=stock;
      let prod=0, lotes=0;
      if(prodDias.indexOf(d)>=0){
        const neto=dem+obj-apertura;
        if(neto>0){ const L=p.unidades_lote||1; lotes=Math.ceil(neto/L); prod=lotes*L; }
      }
      const cubierto=Math.min(dem,apertura+prod);
      if(cubierto<dem-0.5) falt+=dem-cubierto;
      stock=apertura+prod-cubierto;
      prodTot+=prod;
      dias[d]={dem,apertura,prod,lotes,cierre:stock,obj,min:minU*prod};
    });
    sobra=stock;
    return {...calc(p), uSem, minU, dias, prodTot, sobra, falt, lote:p.unidades_lote||1};
  }).filter(x=>x.uSem>0.5);
  // reventa: no se produce, se repone
  const rev=D.productos.filter(p=>p.es_reventa||!(p.pasos||[]).length).map(p=>{
    const uSem=basePron(p.id)*g/SEM; return {...calc(p), uSem, stock:ST.stock[p.id]||0};
  }).filter(x=>x.uSem>0.5);
  const porDia={}; ORD.forEach(d=>{
    porDia[d]={dem:0,prod:0,lotes:0,min:0,cierre:0,
      prodHoy:prodDias.indexOf(d)>=0};
    items.forEach(it=>{const x=it.dias[d];
      porDia[d].dem+=x.dem; porDia[d].prod+=x.prod; porDia[d].lotes+=x.lotes;
      porDia[d].min+=x.min; porDia[d].cierre+=x.cierre;});
  });
  const capPrac=D.capacidad.reduce((s,c)=>s+c.min_practica,0);
  const capDia=capPrac/SEM/prodDias.length;
  return {items,rev,porDia,prodDias,capDia,capSem:capPrac/SEM,SEM};
}
function vPlan(){

    trim:`promedio de los últimos 3 meses hasta ${MES[mesSel]}`, anterior:`${MES[mesSel]} de ${prev}`};
  const totProd=K.items.reduce((s,x)=>s+x.prodTot,0);

  ${usoPico>100?`<div class="note bad"><b>El ${NOMD[pico].toLowerCase()} no cabe.</b> Pide ${N(K.porDia[pico].min)} minutos

/* ---------- PUNTO DE EQUILIBRIO ----------
   Variable = lo que solo existe si vendes una unidad más: insumos, comisiones, empaque.
   Fijo = lo que pagas igual aunque no vendas nada: planilla, alquiler, CIF, estructura. */
function calcEquilibrio(){
  // todo en un mes promedio: la venta tambien, si no el margen de seguridad sale absurdo
  const ps=TODOS().map(p=>({...p,u:und(p.id,ST.anio)/12}));
  const V=ps.reduce((s,p)=>s+vta(p,ST.anio)/12,0), U=ps.reduce((s,p)=>s+p.u,0);
  const MP=ps.reduce((s,p)=>s+p.mp*p.u,0);
  let com=0,pos=0,empq=0;
  D.canales.forEach(c=>{const e=econCanal(c,ST.anio); com+=e.com/12; pos+=e.pos/12; empq+=(e.emp||0)/12;});
  const VAR=MP+com+pos+empq;
  // Fijo: solo la planilla DIRECTA de produccion. La de mostrador y administracion
  // ya viene dentro de los gastos de estructura, y contarla dos veces inflaba el equilibrio.
  const puestos=D.planilla?.puestos||[];
  const plProd=puestos.filter(x=>x.es_directo).reduce((s,x)=>s+(x.costo_cargado_mes||0),0);
  const plIndir=puestos.filter(x=>!x.es_directo).reduce((s,x)=>s+(x.costo_cargado_mes||0),0);
  const modAbsorbida=ps.reduce((s,p)=>s+p.mod*p.u,0);
  const ociosa=Math.max(0,plProd-modAbsorbida);
  const cif=D.cif.reduce((s,x)=>s+x.monto_mensual,0);
  const gastos=D.gastos.filter(x=>x.id!=='go_comisiones_delivery').reduce((s,x)=>s+x.monto_mensual,0);
  const FIJO=plProd+cif+gastos;
  const mcTot=V-VAR, ratio=V?mcTot/V:0, mcUnit=U?mcTot/U:0;
  const peSoles=ratio>0?FIJO/ratio:0, peUnid=mcUnit>0?FIJO/mcUnit:0;
  const util=mcTot-FIJO;
  const seguridad=V>0?100*(V-peSoles)/V:0;
  const diaria=V/30, diaPE=diaria>0?peSoles/diaria:0;
  return {V,U,MP,com,pos,empq,VAR,plProd,plIndir,modAbsorbida,ociosa,cif,gastos,FIJO,
          mcTot,ratio,mcUnit,peSoles,peUnid,util,seguridad,diaPE,diaria};
}

/* ---------------- ALERTAS ---------------- */
let UMB={ub_min:42, fc_max:35, util_max:95, canal_min:25, mo_max:15, insumo_max:20};
function calcAlertas(){
  const A=[], ps=TODOS().map(p=>({...p,u:und(p.id,ST.anio)}));
  const MZ=D.matriz_mo[ST.anio]||{}, cap=D.capacidad;
  const V=ps.reduce((s,p)=>s+vta(p,ST.anio),0);
  const add=(sev,tipo,titulo,detalle,accion,ir,est)=>A.push({sev,tipo,titulo,detalle,accion,ir,est});

  // 1. margen por debajo del objetivo
  ps.filter(p=>p.u>0).forEach(p=>{
    if(p.ub_pct<0) add("alta","margen",`${p.nombre} pierde plata`,
      `Su utilidad bruta es ${P(p.ub_pct,1)}: el costo total (${S(p.cuf)}) supera al precio neto (${S(p.neto)}).`,
      `Subir precio a ${S(p.cuf/(1-UMB.ub_min/100))} o sacarlo de la carta.`, "prod");
    else if(p.ub_pct<UMB.ub_min) add("media","margen",`${p.nombre} bajo el objetivo`,
      `Utilidad bruta de ${P(p.ub_pct,1)}, contra el objetivo de ${P(UMB.ub_min,0)}. Deja ${S(p.ub)} por unidad.`,
      `Para llegar al objetivo: precio de ${S(p.cuf/(1-UMB.ub_min/100))} (+${P(100*(p.cuf/(1-UMB.ub_min/100)/p.neto-1),1)}).`, "prod");
  });

  // 2. food cost alto
  ps.filter(p=>p.u>0 && !p.es_reventa && p.fc_pct>UMB.fc_max).forEach(p=>
    add("media","costo",`${p.nombre} con food cost alto`,
      `${P(p.fc_pct,1)} de materia prima sobre el precio neto, contra el techo de ${P(UMB.fc_max,0)}.`,
      `Revisar gramajes o negociar el insumo que más pesa en su receta.`, "prod"));

  // 3. mano de obra desproporcionada
  const totMin=ps.reduce((s,p)=>s+Object.values(MZ[p.id]||{}).reduce((a,x)=>a+x.min,0),0);
  ps.filter(p=>p.u>0).forEach(p=>{
    const m=Object.values(MZ[p.id]||{}).reduce((a,x)=>a+x.min,0);
    const pctMin=totMin?100*m/totMin:0, pctVta=V?100*vta(p,ST.anio)/V:0;
    if(pctMin>UMB.mo_max && pctMin>pctVta*1.4) add("media","trabajo",
      `${p.nombre} consume más trabajo del que aporta`,
      `Se lleva ${P(pctMin,1)} de la mano de obra y aporta ${P(pctVta,1)} de la venta. Son ${N(p.min_hombre,2)} minutos por unidad.`,
      `Revisar el paso más largo de su proceso, o subir el precio para que el tiempo se pague.`, "mo");
  });

  // 4. estaciones saturadas
  cap.forEach(c=>{
    const dem=ps.reduce((s,p)=>s+((MZ[p.id]||{})[c.id]?.min||0),0)/12;
    const u=c.min_practica?100*dem/c.min_practica:0;
    if(u>100) add("alta","capacidad",`${c.nombre} sin capacidad`,
      `Pide ${N(dem)} minutos al mes y solo hay ${N(c.min_practica)}. Faltan ${N(dem-c.min_practica)}.`,
      `Contratar, redistribuir carga o bajar volumen de los productos más pesados de esa estación.`, "mo", c.id);
    else if(u>UMB.util_max) add("media","capacidad",`${c.nombre} al límite`,
      `Utilización de ${P(u,1)}, sobre el umbral de ${P(UMB.util_max,0)}. Holgura: ${N(c.min_practica-dem)} minutos.`,
      `Sin margen para un feriado o una máquina parada. Vigilar antes de aceptar pedidos grandes.`, "mo", c.id);
  });

  // 5. viernes: el día que revienta
  const perV=(D.perfil_dia||{}).viernes||0;
  cap.forEach(c=>{
    const demSem=ps.reduce((s,p)=>s+((MZ[p.id]||{})[c.id]?.min||0),0)/52;
    const capDia=c.min_practica/4.345/6, demV=demSem*perV;
    if(capDia && demV/capDia>1.1) add("alta","capacidad",`El viernes satura ${c.nombre}`,
      `Ese día pide ${N(demV)} minutos y la capacidad diaria es ${N(capDia)}: ${P(100*demV/capDia,0)} de uso.`,
      `El pan de Shabat no se adelanta. Hay que sumar gente el viernes o adelantar lo que aguante frío.`, "plan", c.id);
  });

  // 6. canales
  D.canales.forEach(c=>{
    const e=econCanal(c,ST.anio);
    if(e.venta>0 && e.mc_pct<UMB.canal_min) add("media","canal",`${c.nombre} deja poco margen`,
      `Margen del canal: ${P(e.mc_pct,1)}. Comisión ${S0(e.com)}, POS ${S0(e.pos)}, costo financiero ${S0(e.fin)} por ${CAN[c.id].dias} días de cobro.`,
      `Subir precio del canal o renegociar la comisión. Vender más por acá baja la utilidad total.`, "can");
    if(CAN[c.id].dias>=20) add("baja","canal",`${c.nombre} tarda en pagar`,
      `${CAN[c.id].dias} días de cobro inmovilizan ${S0(e.fin)} al año en costo financiero.`,
      `Negociar liquidación más frecuente.`, "can");
  });

  // 7. concentración de insumos
  const gasto={};
  ps.forEach(p=>p.receta.forEach(r=>{gasto[r.nombre]=(gasto[r.nombre]||0)+r.costo_por_unidad*p.u;}));
  const TG=Object.values(gasto).reduce((a,b)=>a+b,0);
  Object.entries(gasto).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(([n,g])=>{
    if(100*g/TG>UMB.insumo_max) add("baja","insumo",`${n} concentra el gasto`,
      `Es ${P(100*g/TG,1)} de toda la materia prima: ${S0(g)} al año.`,
      `Un alza de 10% en ese insumo cuesta ${S0(g*0.1)}. Conviene tener un segundo proveedor.`, "ins");
  });

  // 8. concentración de ventas
  const orden=[...ps].sort((a,b)=>b.neto*b.u-a.neto*a.u);
  if(orden.length && V){
    const top=100*orden[0].neto*orden[0].u/V;
    if(top>30) add("baja","venta",`La venta depende de ${orden[0].nombre}`,
      `Un solo producto es ${P(top,1)} de la facturación.`,
      `Si ese producto falla una semana, el impacto es directo. Vale desarrollar el segundo.`, "tab");
  }
  const sev={alta:0,media:1,baja:2};
  return A.sort((a,b)=>sev[a.sev]-sev[b.sev]);
}
function vAlertas(){
  const A=calcAlertas();
  const n=s=>A.filter(x=>x.sev===s).length;
  const ICO={margen:"📉",costo:"🧾",trabajo:"⏱",capacidad:"🏭",canal:"🛵",insumo:"📦",venta:"🎯"};
  const COL={alta:"ba",media:"wa",baja:"nt"};
  const TXT={alta:"Crítica",media:"Atención",baja:"Para mirar"};
  const sl=(k,lb,min,max,suf)=>`<div class="fg"><label>${lb}: <span style="font-family:var(--fm);color:var(--c600)">${UMB[k]}${suf}</span></label>

/* ---------------- ESCENARIOS ---------------- */
function snap(){
  const ps=TODOS().map(p=>({...p,u:und(p.id,ST.anio)/12}));
  const V=ps.reduce((s,p)=>s+vta(p,ST.anio),0), MP=ps.reduce((s,p)=>s+p.mp*p.u,0);
  const MO=ps.reduce((s,p)=>s+p.mod*p.u,0), CI=ps.reduce((s,p)=>s+p.cif*p.u,0);
  const G=D.gastos.reduce((s,g)=>s+g.monto_mensual,0);
  return {venta:V, mp:MP, ub:V-MP-MO-CI, ub_pct:V?100*(V-MP-MO-CI)/V:0,
          fc:V?100*MP/V:0, uo:V-MP-MO-CI-G, uo_pct:V?100*(V-MP-MO-CI-G)/V:0};
}

  const r=snap(), cam=Object.entries(ST.aj).filter(([,a])=>a.precio||a.mp||a.mod);

function vBloqueado(){
  pantalla(CAJA("Acceso retirado", `
   <div class="gestado">🚫</div>
   <p class="gtxt">Esta cuenta tiene el acceso retirado. Habla con un administrador si crees que es un error.</p>
   <button class="gbtn sec" id="gSalir3">Cerrar sesión</button>`));
  $("#gSalir3").onclick=salir;
}

async function login(){
  const email=$("#gEmail").value.trim(), pass=$("#gPass").value;
  if(!email||!pass) return vLogin("Escribe tu correo y tu contraseña.");
  $("#gEntrar").disabled=true; $("#gEntrar").textContent="Entrando...";
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error) return vLogin(error.message.includes("Invalid")?"Correo o contraseña incorrectos.":error.message);
  arrancarSesion();
}
async function registrar(){
  const nom=$("#rNom").value.trim(), email=$("#rEmail").value.trim(), pass=$("#rPass").value;
  if(!email||pass.length<6) return vRegistro("Pon un correo válido y una contraseña de al menos 6 caracteres.");
  $("#rCrear").disabled=true; $("#rCrear").textContent="Creando...";
  const {error}=await sb.auth.signUp({email,password:pass,options:{data:{nombre:nom}}});
  if(error) return vRegistro(error.message);
  vRegistro(null,"Cuenta creada. Ahora inicia sesión; vas a quedar en espera de aprobación.");
  setTimeout(()=>vLogin(),2200);
}
async function salir(){ await sb.auth.signOut(); PERFIL=null; SESION=null; vLogin(); }

async function arrancarSesion(){
  const limite=(p,ms,q)=>Promise.race([p,new Promise((_,x)=>setTimeout(()=>x(new Error("La base no respondió ("+q+")")),ms))]);
  try{
    const {data:{session}}=await limite(sb.auth.getSession(),12000,"sesión");
    SESION=session;
    if(!session) return vLogin();
    const {data,error}=await limite(
      sb.from("perfiles").select("*").eq("id",session.user.id).maybeSingle(),12000,"perfil");
    if(error) return vLogin("No se pudo leer tu perfil: "+error.message);
    PERFIL=data;
    if(!PERFIL) return vPendiente();
    if(PERFIL.estado==="bloqueado") return vBloqueado();
    if(PERFIL.estado!=="aprobado") return vPendiente();
    entrar(); pintarSesion();
    try{ await limite(cargarEscenarios(),12000,"escenarios"); }catch(e){ ST.esc=[]; }
    render();
  }catch(e){
    vLogin((e&&e.message)||"No se pudo conectar. Revisa tu internet y vuelve a intentar.");
  }
}

function pintarSesion(){
  const r=VISTA.activa
    ? ({lectura:"Lectura",edicion:"Edición",admin:"Administrador"}[VISTA.rol]||VISTA.rol)+" · prueba"
    : ({lectura:"Lectura",edicion:"Edición",admin:"Administrador"}[PERFIL.rol]||PERFIL.rol);
  $("#usrBox").innerHTML=`<div class="usr">
    <div class="uav">${esc((PERFIL.nombre||PERFIL.email)[0].toUpperCase())}</div>
    <div class="uinfo"><b>${esc(PERFIL.nombre||PERFIL.email)}</b><span>${r}</span></div>
    <button class="hbtn" id="bMapa" title="Dónde está cada cosa">Mapa</button>
    ${esAdminReal()?(VISTA.activa
      ?'<button class="hbtn ac" id="bFinVista">Volver a mi perfil</button>'
      :'<button class="hbtn ac" id="bVerComo">Ver como…</button>'):""}
    <button class="hbtn" id="bSalir">Salir</button></div>`;
  $("#bSalir").onclick=salir;
  if($("#bMapa")) $("#bMapa").onclick=()=>abrirMapa();
  if($("#bVerComo")) $("#bVerComo").onclick=()=>abrirPrueba();
  if($("#bFinVista")) $("#bFinVista").onclick=salirVista;
  if(!puedeEditar()) document.body.classList.add("solo-lectura");
  else document.body.classList.remove("solo-lectura");
  aplicarPermisos();
}

/* ---------- escenarios contra la base ---------- */
async function cargarEscenarios(){
  const {data,error}=await sb.from("escenarios").select("*").order("creado_en",{ascending:false});
  if(error){ ST.esc=[]; return; }
  ST.esc=(data||[]).map(e=>({id:e.id,nombre:e.nombre,fecha:new Date(e.creado_en).toLocaleString("es-PE",{dateStyle:"short",timeStyle:"short"}),
    aj:e.ajustes,igv:e.igv,r:e.resultados}));
}
async function guardar(){
  if(!puedeEditar()) return alert("Tu perfil es de solo lectura: no puedes guardar escenarios.");
  const n=($("#nom")?.value||"").trim()||("Escenario "+(ST.esc.length+1));
  const paq={productos:ST.aj, insumos:ST.insumos, estaciones:ST.estaciones};
  const {error}=await sb.from("escenarios").insert({nombre:n,ajustes:paq,resultados:snap(),igv:ST.igv,anio:ST.anio});
  if(error) return alert("No se pudo guardar: "+error.message);
  await cargarEscenarios(); $("#cEsc").textContent=ST.esc.length; vEsc();
}
async function borrarEscenario(id){
  if(!puedeEditar()) return;
  const {error}=await sb.from("escenarios").delete().eq("id",id);
  if(error) return alert("No se pudo borrar: "+error.message);
  await cargarEscenarios(); $("#cEsc").textContent=ST.esc.length; vEsc();
}

/* ---------- administración de usuarios ---------- */
async function vUsuarios(){
  if(!esAdmin()) return;
  const {data,error}=await sb.from("v_usuarios").select("*");
  if(error){ $("#p-usr").innerHTML=`<div class="note bad">No se pudo leer la lista: ${esc(error.message)}</div>`; return; }
  const us=data||[], pend=us.filter(u=>u.estado==="pendiente");
  const chip=u=>({pendiente:'<span class="bd wa">pendiente</span>',aprobado:'<span class="bd ok">aprobado</span>',
                  bloqueado:'<span class="bd ba">bloqueado</span>'})[u.estado]||"";
  const sens=s=>({baja:'<span class="bd ok">baja</span>',media:'<span class="bd nt">media</span>',
    alta:'<span class="bd wa">alta</span>',"crítica":'<span class="bd ba">crítica</span>'})[s]||s;
  const listaPest=u=>{const p=u.pestanas; return (!p||!Array.isArray(p)||!p.length)?"todas":
    PESTANAS.filter(x=>p.indexOf(x.k)>=0).map(x=>x.n).join(", ");};
  $("#p-usr").innerHTML=`
  ${pend.length?`<div class="note warn"><b>${pend.length} ${pend.length===1?"cuenta espera":"cuentas esperan"} aprobación.</b></div>`:""}

  <div class="card"><div class="ch"><div><h2 class="ct">Usuarios</h2>
    <p class="cs">Apruebas el acceso, eliges si solo mira o también edita, y a qué pestañas entra.</p></div>
    <button class="btn pri" id="bProbar">Ver la app como otra persona</button></div>
   <div class="tw"><table><thead><tr><th>Persona</th><th>Estado</th>
     <th style="width:150px">Puede</th><th>Entra a</th><th style="width:180px"></th></tr></thead>
    <tbody>${us.map(u=>`<tr ${u.estado==="pendiente"?'style="background:#fffaf0"':''}>
      <td style="font-weight:600">${esc(u.nombre||"—")} ${u.soy_yo?'<span class="bd nt">tú</span>':''}
       <div style="font-size:12px;color:var(--ink5);font-weight:400">${esc(u.email)}</div></td>
      <td>${chip(u)}</td>
      <td>${u.soy_yo?'<span style="color:var(--ink5);font-size:12.5px">—</span>':
        `<select class="cell-sel" data-rol="${u.id}">
          <option value="lectura" ${u.rol==="lectura"?"selected":""}>Solo mirar</option>
          <option value="edicion" ${u.rol==="edicion"?"selected":""}>Mirar y simular</option>
          <option value="admin" ${u.rol==="admin"?"selected":""}>Administrador</option></select>`}</td>
      <td style="font-size:12.5px;color:var(--ink7);max-width:260px">${u.soy_yo?"todas":esc(listaPest(u))}</td>
      <td>${u.soy_yo?"":`<button class="btn sm" data-pest="${u.id}">Pestañas</button>
        ${u.estado!=="aprobado"?`<button class="btn sm pri" data-ap="${u.id}">Aprobar</button>`:""}
        ${u.estado==="aprobado"?`<button class="btn sm" data-bl="${u.id}">Retirar</button>`:""}`}</td></tr>`).join("")}</tbody>
   </table></div>
   <div class="note" style="margin:13px 0 0"><b>Probar antes de dar.</b> El botón de arriba —y el de
    <b>Ver como…</b> en la cabecera, que está siempre a la mano— te mete en la piel de esa persona sin cerrar tu sesión.
    Sales con la banda naranja.</div></div>

  <div class="card"><details><summary class="ct" style="cursor:pointer;font-size:16px">Qué pestaña conviene dar, y a quién</summary>
   <p class="cs" style="margin:8px 0 13px">La sensibilidad no es el margen que muestra, es lo que alguien podría deducir si se la lleva.</p>
   <div class="tw"><table><thead><tr><th>Pestaña</th><th class="n">Sensibilidad</th><th>Para quién</th><th>Qué deja ver</th></tr></thead>
    <tbody>${PESTANAS.map(p=>`<tr>
     <td style="font-weight:600">${esc(p.n)}</td><td class="n">${sens(p.sens)}</td>
     <td style="font-size:12.5px">${esc(p.qui)}</td>
     <td style="font-size:12.5px;color:var(--ink7)">${esc(p.expone)}</td></tr>`).join("")}</tbody></table></div>
   <div class="note warn" style="margin:13px 0 0"><b>Las tres que no se dan.</b>
    <b>Insumos y recetas</b> es el know-how: con eso alguien replica el producto.
    <b>Mano de obra</b> deja deducir los sueldos de cada puesto.
    <b>Canales</b> trae la comisión negociada con Rappi y los descuentos B2B.
    El resto se reparte con criterio; para la panadería, <b>Plan de producción</b> sola ya sirve.</div>
  </details></div>`;
  $("#bProbar").onclick=()=>abrirPrueba();
  $$("#p-usr [data-ap]").forEach(b=>b.onclick=()=>cambiarUsuario(b.dataset.ap,{estado:"aprobado",aprobado_en:new Date().toISOString(),aprobado_por:SESION.user.id}));
  $$("#p-usr [data-bl]").forEach(b=>b.onclick=()=>{ if(confirm("¿Retirar el acceso de esta persona?")) cambiarUsuario(b.dataset.bl,{estado:"bloqueado"}); });
  $$("#p-usr [data-rol]").forEach(s=>s.onchange=()=>cambiarUsuario(s.dataset.rol,{rol:s.value}));
  $$("#p-usr [data-pest]").forEach(b=>b.onclick=()=>abrirPestanas(us.find(x=>x.id===b.dataset.pest)));
}

/* ---------- probar como otra persona: un dialogo, tres pasos ---------- */
function abrirPrueba(pre){
  if(pre){ VISTA.nombre=pre.nombre; VISTA.rol=pre.rol; VISTA.set=new Set(pre.pest); }
  const paqActual=()=>{
    for(const [k,v] of Object.entries(PAQUETES))
      if(v.v.length===VISTA.set.size && v.v.every(x=>VISTA.set.has(x))) return k;
    return "medida";
  };
  const pintar=()=>{
    const pa=paqActual();
    $(".mtop b").textContent="Ver la aplicación como otra persona";
    $("#modalBody").innerHTML=`
    <div class="note">Esto no crea ninguna cuenta ni cambia permisos.
     <b>Para volver a lo tuyo</b> tienes tres caminos: la banda naranja de arriba, el botón flotante de abajo a la derecha,
     o la tecla <b>Esc</b>. Y si te pierdes, basta con recargar la página.</div>

    <div class="paso"><div class="pn">1</div><div style="flex:1">
      <h3>¿Quién es?</h3><p>Solo para acordarte de a quién le estás probando el acceso.</p>
      <input class="inp" id="pbNom" type="text" style="text-align:left;max-width:340px" value="${esc(VISTA.nombre)}" placeholder="Rosa, de panadería"/>
    </div></div>

    <div class="paso"><div class="pn">2</div><div style="flex:1">
      <h3>¿Qué va a ver?</h3><p>Elige un paquete. Casi siempre uno de estos cuatro alcanza.</p>
      <div class="paqs">${Object.entries(PAQUETES).map(([k,v])=>`
       <button class="paq ${pa===k?"on":""}" data-paq="${k}">
        <b>${esc(v.n)}</b><span>${v.v.length} pestañas</span>
        <em>${esc(v.d)}</em>
        <div class="paqt">${v.v.map(x=>esc((PESTANAS.find(p=>p.k===x)||{}).n||x)).join(" · ")}</div></button>`).join("")}
       <button class="paq ${pa==="medida"?"on":""}" data-paq="medida">
        <b>A medida</b><span>${VISTA.set.size} pestañas</span>
        <em>Marca una por una, abajo.</em></button></div>
      <details ${pa==="medida"?"open":""} style="margin-top:12px"><summary>Marcar pestaña por pestaña</summary>
       <div style="display:flex;flex-wrap:wrap;gap:9px 17px;margin:11px 0 0">
        ${PESTANAS.filter(p=>p.k!=="usr").map(p=>`<label style="display:flex;gap:7px;align-items:center;font-size:13px;font-weight:600;cursor:pointer">
         <input type="checkbox" data-pb="${p.k}" ${VISTA.set.has(p.k)?"checked":""}/> ${esc(p.n)}</label>`).join("")}</div></details>
    </div></div>

    <div class="paso"><div class="pn">3</div><div style="flex:1">
      <h3>¿Puede cambiar cosas?</h3><p>Lectura es lo normal para alguien que solo consulta.</p>
      <div class="paqs">
       ${[["lectura","Solo mirar","Ve los números pero no guarda nada."],
          ["edicion","Mirar y simular","Puede mover supuestos y guardar escenarios."]].map(([k,t,d])=>`
        <button class="paq ch ${VISTA.rol===k?"on":""}" data-rol2="${k}"><b>${t}</b><em>${d}</em></button>`).join("")}</div>
    </div></div>

    <div style="display:flex;gap:9px;margin:20px 0 0;flex-wrap:wrap;align-items:center">
     <button class="btn pri" id="pbIr" style="padding:11px 20px;font-size:14px">Entrar como ${esc(VISTA.nombre||"esa persona")}</button>
     <button class="btn" id="pbNo">Cancelar</button></div>`;

    $$("#modalBody [data-paq]").forEach(b=>b.onclick=()=>{
      const k=b.dataset.paq;
      VISTA.nombre=($("#pbNom").value||"").trim()||VISTA.nombre;
      if(k!=="medida") VISTA.set=new Set(PAQUETES[k].v);
      pintar();
    });
    $$("#modalBody [data-rol2]").forEach(b=>b.onclick=()=>{
      VISTA.nombre=($("#pbNom").value||"").trim()||VISTA.nombre;
      VISTA.rol=b.dataset.rol2; pintar();});
    $$("#modalBody [data-pb]").forEach(c=>c.onchange=e=>{
      e.target.checked?VISTA.set.add(e.target.dataset.pb):VISTA.set.delete(e.target.dataset.pb);
      const n=$("#modalBody [data-paq='medida'] span"); if(n) n.textContent=VISTA.set.size+" pestañas";});
    $("#pbNom").oninput=e=>{const v=(e.target.value||"").trim()||"esa persona";
      $("#pbIr").textContent="Entrar como "+v;};
    $("#pbNo").onclick=cerrar;
    $("#pbIr").onclick=()=>{
      VISTA.nombre=($("#pbNom").value||"").trim()||"Usuario de prueba";
      if(!VISTA.set.size) return alert("Marca al menos una pestaña, si no entra y no ve nada.");
      VISTA.activa=true; cerrar(); pintarSesion(); aplicarPermisos(); render();
      window.scrollTo({top:0,behavior:"smooth"});
    };
  };
  pintar();
  $("#modal").classList.add("on"); document.body.style.overflow="hidden";
}

/* elegir pestañas de una persona de verdad */
function abrirPestanas(u){
  if(!u) return;
  const actual=new Set(Array.isArray(u.pestanas)&&u.pestanas.length?u.pestanas:PESTANAS.filter(p=>p.k!=="usr").map(p=>p.k));
  $(".mtop b").textContent="Pestañas de "+(u.nombre||u.email);
  $("#modalBody").innerHTML=`
  <div class="note">Marca a qué entra <b>${esc(u.nombre||u.email)}</b>. Lo que desmarques no le aparece:
   no es que lo vea bloqueado, simplemente la pestaña no existe para él.
   ${u.rol==="admin"?"<b>Es administrador</b>, así que la pestaña de Usuarios le aparece siempre.":""}</div>
  <div style="display:flex;gap:9px;margin:0 0 15px;flex-wrap:wrap">
   ${Object.entries(PAQUETES).map(([k,v])=>`<button class="btn sm" data-paq="${k}">${esc(v.n)}</button>`).join("")}</div>
  <div class="tw"><table><thead><tr><th style="width:52px">Entra</th><th>Pestaña</th><th class="n">Sensibilidad</th>
    <th>Qué deja ver</th></tr></thead>
   <tbody>${PESTANAS.filter(p=>p.k!=="usr").map(p=>`<tr>
    <td style="text-align:center"><input type="checkbox" data-pk="${p.k}" ${actual.has(p.k)?"checked":""}/></td>
    <td style="font-weight:600">${esc(p.n)}</td>
    <td class="n">${({baja:'<span class="bd ok">baja</span>',media:'<span class="bd nt">media</span>',
      alta:'<span class="bd wa">alta</span>',"crítica":'<span class="bd ba">crítica</span>'})[p.sens]}</td>
    <td style="font-size:12.5px;color:var(--ink7)">${esc(p.expone)}</td></tr>`).join("")}</tbody></table></div>
  <div id="pestMsg"></div>
  <div style="display:flex;gap:9px;margin:17px 0 0">
   <button class="btn pri" id="pestOk">Guardar</button>
   <button class="btn" id="pestNo">Cancelar</button>
   <button class="btn" id="pestVer">Probar como esta persona</button></div>`;
  const leer=()=>[...document.querySelectorAll("#modalBody [data-pk]")].filter(c=>c.checked).map(c=>c.dataset.pk);
  $$("#modalBody [data-paq]").forEach(b=>b.onclick=()=>{const s=new Set(PAQUETES[b.dataset.paq].v);
    $$("#modalBody [data-pk]").forEach(c=>c.checked=s.has(c.dataset.pk));});
  $("#pestNo").onclick=cerrar;
  $("#pestVer").onclick=()=>abrirPrueba({nombre:u.nombre||u.email, rol:u.rol==="admin"?"edicion":u.rol, pest:leer()});
  $("#pestOk").onclick=async()=>{
    const v=leer();
    if(!v.length) return alert("Marca al menos una pestaña, o la persona entra y no ve nada.");
    $("#pestOk").disabled=true; $("#pestOk").textContent="Guardando...";
    const {error}=await sb.from("perfiles").update({pestanas:v}).eq("id",u.id);
    if(error){
      $("#pestMsg").innerHTML=`<div class="note bad" style="margin:15px 0 0">No se pudo guardar:
       ${esc(error.message)}${/pestanas|column/i.test(error.message)
        ?" — falta crear la columna <b>pestanas</b> en la tabla de perfiles. La vista previa sí funciona mientras tanto."
        :""}</div>`;
      $("#pestOk").disabled=false; $("#pestOk").textContent="Guardar"; return;
    }
    cerrar(); vUsuarios();
  };
  $("#modal").classList.add("on"); document.body.style.overflow="hidden";
}
async function cambiarUsuario(id,campos){
  const {error}=await sb.from("perfiles").update(campos).eq("id",id);
  if(error) return alert("No se pudo actualizar: "+error.message);
  vUsuarios();
}

/* ---------- arranque ---------- */
(async function(){
  if(typeof window.supabase==="undefined"){ pantalla(CAJA("Sin conexión",
    `<p class="gtxt">No se pudo cargar la librería de acceso. Revisa tu internet y recarga.</p>`)); return; }
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"){PERFIL=null;vLogin();} });
  const reloj=setTimeout(()=>{
    const g=$("#gate"), ap=$("#app");
    if(g && !g.classList.contains("on") && (!ap || ap.style.display==="none"))
      vLogin("La conexión tardó demasiado. Intenta de nuevo.");
  },15000);
  try{ await arrancarSesion(); } finally { clearTimeout(reloj); }
})();

</script>
</body>
